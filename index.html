// ---------- 난이도 모델 ----------
// 난이도 지수 D 하나로 모든 변수를 함께 움직임.
//  · 큰 흐름: 레벨이 오를수록 증가(60레벨까지 빠르게, 이후 완만하게 계속)
//  · 챕터 안 흐름: 10레벨 단위로 오르내림, 10번째는 보스(급상승), 다음 챕터 첫 판은 숨 고르기

const isBoss = lv => lv % 10 === 0;
// 지형 난이도 단계(쉬움 → 매우 어려움). D가 오를수록 어려운 단계가 자주 나옴

function genLevel(lv, seed, themeIdx){
  const r = rng(seed), R = (a, b) => a + r() * (b - a), pick = a => a[Math.floor(r() * a.length)];
  const has = k => MECH.find(m => m.k === k).lv <= lv;

  if (kinds.includes('crawl') || kinds.includes('bigdog')){
    const n = kinds.includes('crawl') ? clamp(Math.round(u / 2.5), 3, Math.round(8 * capS)) : 0;
    const nb = kinds.includes('bigdog') ? clamp(Math.round(u / 9), 1, Math.round(2 * capS)) : 0;
    // 개는 땅 위로 모모까지 막힘없이 달려올 수 있는 쪽에서만 나옴
    const clearSide = sd => { const x0 = sd < 0 ? 10 : W - 10; for (let x = x0; Math.abs(x - px) > 30; x += (px - x0) > 0 ? 6 : -6){ if (S.some(o => o.kind !== 'ground' && o.kind !== 'hill' && inRect({ x, y: GY - 12 }, o, 4))) return false; } return true; };
    let sides = (r() < 0.5 ? [-1, 1] : [px < W / 2 ? 1 : -1]).filter(clearSide);
    if (!sides.length) sides = [-1, 1].filter(clearSide);
    if (sides.length){
      for (let i = 0; i < n; i++) L.crawl.push({ side: sides[i % sides.length], t: 200 + i * 600 + R(0, 250), big: false });
      for (let i = 0; i < nb; i++) L.crawl.push({ side: sides[(i + 1) % sides.length], t: 400 + i * 1400 + R(0, 300), big: true });
    } else {
      ['crawl', 'bigdog'].forEach(k => { const i = kinds.indexOf(k); if (i >= 0) kinds.splice(i, 1); });
      if (!kinds.includes('bee')) kinds.push('bee');
    }
  }
  if (kinds.includes('rain')){
    const n = 1;
    for (let i = 0; i < n; i++){
      const w = R(90, 140);
      let cx = R(w / 2 + 10, W - w / 2 - 10);
      if (i === 0) cx = clamp(px + R(-w / 2 + 25, w / 2 - 25), w / 2 + 10, W - w / 2 - 10);
      L.clouds.push({ x: cx, w, rate: clamp(900 / u, 60, 150) });
    }
  }
  if (kinds.includes('wind')){
    const y0 = clamp(R(sp.y - 210, sp.y - 70), 90, 460), h = R(110, 170);
    L.winds.push({ y0, y1: Math.min(y0 + h, sp.y + 30), dir: r() < 0.5 ? -1 : 1, str: 0.6 + Math.min(0.5, lv * 0.015) });
  }
  if (L.winds.length) L.clouds.forEach(c => { c.w = Math.min(190, c.w + 40); c.x = clamp(c.x - L.winds[0].dir * 45, c.w / 2 + 10, W - c.w / 2 - 10); });
  const yMin = L.clouds.length ? 125 : 55, yMax = Math.min(sp.y - 30, 400);
  if (kinds.includes('bee')){
    const total = clamp(Math.round(u / 2), 4, Math.round(16 * capS)), nh = total > 18 ? 3 : total > 9 ? 2 : 1;
    for (let i = 0; i < nh; i++){
      const pit = arch === 'alcove' && i === 0 ? L.carveInfo.pit : null;
      const p = pit || place(170, yMin, yMax) || { x: px < W / 2 ? W - 40 : 40, y: yMin + 30 };
      if (pit) used.push(pit);
      L.hives.push({ ...p, n: Math.round(total / nh), kind: 'bee' });
    }
  }
  if (kinds.includes('tank')){
    // 헤비 드론: 수는 적지만 무거워서 선을 밀어냄
    const p = place(170, yMin, yMax) || { x: px < W / 2 ? W - 45 : 45, y: yMin + 40 };
    L.hives.push({ ...p, n: clamp(Math.round(u / 7), 1, Math.round(3 * capS)), kind: 'tank' });
  }
  // 두 점 사이에 지형이 없는지(오리의 사격 시야)
  const los = (a, b2) => {
    const n = Math.ceil(dist(a, b2) / 5);
    for (let i = 1; i < n; i++){
      const q = { x: a.x + (b2.x - a.x) * i / n, y: a.y + (b2.y - a.y) * i / n };
      if (dist(q, sp) < 34) break;
      if (S.some(o => inRect(q, o, 6)) || dynRects.some(o => inRect(q, o, 2))) return false;
    }
    return true;
  };
  if (kinds.includes('wasp')){
    // 예산이 크면 오리 두 마리가 서로 다른 각도에서 쏨(벽 하나로 다 막히지 않게)
    const nd = u > 70 ? 3 : u > 30 ? 2 : 1, ud = u / nd;
    for (let k = 0; k < nd; k++){
      let p = null;
      for (let t = 0; t < 40 && !p; t++){
        const c = place(190, yMin, Math.min(sp.y + 40, 470));
        const prev = L.hives.find(h => h.kind === 'wasp');
        const angOk = !prev || !c || Math.abs(Math.atan2(c.y - sp.y, c.x - sp.x) - Math.atan2(prev.y - sp.y, prev.x - sp.x)) > 0.9;
        if (c && los(c, sp) && angOk) p = c; else if (c) used.pop();
      }
      if (!p && k > 0) break;
      p = p || place(190, yMin, yMax) || { x: px < W / 2 ? W - 40 : 40, y: yMin + 60 };
      L.hives.push({ ...p, n: 0, burst: clamp(Math.round(3 + ud / 3), 5, Math.round(10 * Math.min(capS, 1.5))), gap: clamp(13000 / ud, 650 / capS, 1600), kind: 'wasp' });
    }
  }
  if (kinds.includes('rock')){
    const n = u > 45 ? 2 : 1;
    for (let i = 0; i < n; i++){
      const rr = R(10, 14), interval = clamp(10000 * n / u, 480 / capS, 1500);
      if (r() < 0.5 && !L.cave && !(intro && intro.k === 'rock')){
        L.chutes.push({ type: 'top', x: clamp(px + R(-30, 30), 24, W - 24), y: -12, vx: 0, vy: 1, r: rr, interval, first: R(350, 750) });
      } else {
        const fromLeft = L.cave ? !L.cave.left : r() < 0.5;
        let y = L.carve ? R(110, L.carveInfo.ys - 40) : R(Math.max(120, sp.y - 230), sp.y - 50);
        for (let t = 0; t < 20 && !free({ x: fromLeft ? 20 : W - 20, y }, 20); t++) y = L.carve ? R(110, L.carveInfo.ys - 40) : R(120, sp.y - 40);
        const vx = (fromLeft ? 1 : -1) * R(3.2, 4.2), x0 = fromLeft ? -40 : W + 40;
        const t = Math.abs(sp.x - x0) / Math.abs(vx), gstep = 0.278;
        const vy = clamp((sp.y - 6 - y - 0.5 * gstep * t * t) / t, -8, 2);
        L.chutes.push({ type: 'side', x: x0, y, vx, vy, r: rr, interval, first: R(350, 750) });
      }
    }
  }

  // 3) 고정 핀 (도우미 요소)
  if (L.carve && has('pin')){
    const ci = L.carveInfo;
    const cps = ci.arch === 'alcove'
      ? [{ x: ci.mouthX + (ci.left ? 10 : -10), y: ci.mouthTop + 8 }, { x: ci.mouthX + (ci.left ? 10 : -10), y: ci.floorY - 8 }] // 두 핀을 이으면 틈 없는 문
      : [{ x: ci.shaftX + (r() < 0.5 ? -1 : 1) * (ci.shaftW / 2 + 14), y: ci.ys - 16 }];
    for (const cp of cps) if (free(cp, ci.arch === 'alcove' ? 6 : 10)){ used.push(cp); L.pins.push(cp); }
  }
  if (L.cave && has('pin')){
    const cp = { x: L.cave.mouth + (L.cave.left ? 16 : -16), y: L.cave.ceilY + 18 };
    if (free(cp, 12)){ used.push(cp); L.pins.push(cp); }
  }
  // 31레벨부터는 어려운 대신 핀(풀이 도구)을 꼭 줌
  if (has('pin') && ((intro && intro.k === 'pin') || lv >= 31 || r() < 0.75 - 0.35 * D)){
    const n = lv >= 45 ? 2 : 1 + (r() < 0.35 ? 1 : 0);
    for (let i = 0; i < n; i++){
      for (let t = 0; t < 80; t++){
        const ang = R(-Math.PI + 0.25, -0.25), d = R(70, 130);
        const p = { x: sp.x + Math.cos(ang) * d, y: sp.y + Math.sin(ang) * d };
        if (!free(p, 12) || used.some(q => dist(q, p) < 45)) continue;
        used.push(p); L.pins.push(p); break;
      }
    }
  }

  // 4) 장애물 판자 (걸치거나 받칠 수 있는 지형)
  let no = L.carve ? 1 : Math.min(3, Math.floor(lv / 2)) - (arch === 'valley' || arch === 'pillar' ? 1 : 0);
  for (let i = 0; i < no; i++){
    for (let t = 0; t < 60; t++){
      const kr = r(), x = R(40, W - 40), y = R(140, GY - 70);
      const o = kr < 0.55 ? { x, y, w: R(50, 110), h: 14, a: R(-0.6, 0.6), kind: 'obs' }
              : kr < 0.8 ? (() => { const sz = R(28, 44); return { x, y, w: sz, h: sz, a: R(-0.4, 0.4), kind: 'box' }; })()
              : { shape: 'circle', x, y, r: R(14, 24), kind: 'boulder' };
      if (o.shape === 'circle'){ o.w = o.r * 2; }
      if (dist(o, sp) < 100 || dist(o, L.pot) < 90) continue;
      if (o.y < sp.y && Math.abs(o.x - sp.x) < o.w / 2 + 40) continue; // 모모 위를 덮는 공짜 지붕 금지
      if (used.some(q => dist(q, o) < 70) || L.chutes.some(c => Math.abs(c.y - o.y) < 30 && c.type === 'side')) continue;
      if (S.some(s => dist(s, o) < 70 && s.kind !== 'ground')) continue;
      if (dynRects.some(d => inRect(o, d, 40)) || chainRects.some(d => inRect(o, d, 30))) continue;
      // 오리의 사격 시야를 가리지 않게
      S.push(o); const blocks = L.hives.some(h => h.kind === 'wasp' && !los(h, sp)); S.pop();
      if (blocks) continue;
      S.push(o); break;
    }
  }
  // 금지 구역: 모모 주변·핀은 피해서 배치
  L.zones = [];
  if (mods.includes('nozone')){
    const nz = 1 + (r() < 0.5 ? 1 : 0) + (lv >= 50 ? 1 : 0);
    for (let i = 0; i < nz; i++) for (let t = 0; t < 60; t++){
      const z = { x: R(40, W - 40), y: R(110, GY - 40), w: R(60, 120), h: R(50, 110), a: 0 };
      if (inRect(sp, z, 60) || inRect(L.pot, z, 50) || L.pins.some(pn => inRect(pn, z, 16)) || L.zones.some(o => dist(o, z) < 70)) continue;
      L.zones.push(z); break;
    }
  }
  // 잉크: D가 오를수록 짧아짐(덮개 하나 ≈ 230px). 파낸 지형은 입구만 막으면 돼서 더 짧게
  L.ink = Math.round(clamp(620 - 380 * D, 210, 620) * (L.carve ? 0.85 : 1));
  L.speed = clamp(2.0 + 1.9 * D, 2.0, 4.2);
  L.force = clamp(0.75 + 0.85 * D + (L.boss ? 0.1 : 0), 0.75, 1.8); // 적이 선을 밀어내는 힘 배율
  L.diff10 = clamp(Math.round(D / 1.15 * 9) + 1, 1, 10);
  return L;
}

// ---------- 상태 ----------
let mode = 'level';

let L, engine, statics, dynBodies = [], potBody, potOff, sproutPart, lineBody, lineLocal;

function curKey(){ return mode === 'daily' ? 'ss_daily_' + todayKey() : 'ss_best_' + level; }

function setup(){
  L = mode === 'daily' ? genLevel(18, todayKey(), todayKey() % CHAPTERS.length) : genLevel(level, level * 7919 + 101, chapterOf(level));

  });
  // 움직이는 지형(시소·매달린 발판)
  dynBodies = []; const dynCons = [];
  L.D.forEach(d => {

    else for (const sd of [-1, 1]){

    }

  const px = L.pot.x, py = L.pot.y;
  // 모모: 몸통(사각) + 머리(원). 발밑 = 받침 윗면(top = py + 18)
  const top = py + 18;

  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);

  if (activePointer !== null){ try { cv.releasePointerCapture(activePointer); } catch (_){} activePointer = null; }
  bugs = []; drops = []; rocks = []; crawlers = []; flashT = 0; lineBody = null; toRemove = new Set();
  cloudAcc = L.clouds.map(() => 0);
  finger = null; fingerBlocked = false; flow = null; pops = []; jetPush = [];

  document.getElementById('lvl').textContent = curLabel();
  document.getElementById('prevLv').style.visibility = mode === 'level' ? 'visible' : 'hidden';
  document.getElementById('nextLv').style.visibility = mode === 'level' ? 'visible' : 'hidden';
  setTimerUI(-1);
  document.getElementById('modalWrap').classList.add('hidden');
  document.getElementById('shareBox').classList.add('hidden');
  const ch = CHAPTERS[L.theme], rd = mode === 'level' ? roundOf(level) : 0;
  const chips = [`<span class="chip" style="background:${L.boss ? '#7a1f1f' : '#22332a'}">${L.boss ? '🔥 보스 · ' : ''}난이도 ${'▮'.repeat(Math.ceil(L.diff10 / 2))}${'▯'.repeat(5 - Math.ceil(L.diff10 / 2))} ${L.diff10}</span>`, `<span class="chip">${ch.icon} ${ch.name}${rd ? ' ★' + (rd + 1) : ''}</span>`, `<span class="chip${L.archIntro ? ' new' : ''}">${ARCH_NAME[L.arch]}</span>`];
  L.mods.forEach(k => { const m = MODS.find(x => x.k === k); chips.push(`<span class="chip${L.modIntro && L.modIntro.k === k ? ' new' : ''}">${m.icon} ${m.name}</span>`); });
  L.kinds.forEach(k => { const m = MECH.find(x => x.k === k); chips.push(`<span class="chip${L.intro && L.intro.k === k ? ' new' : ''}">${m.icon} ${m.name}</span>`); });
  if (L.pins.length){ const m = MECH[1]; chips.push(`<span class="chip${L.intro && L.intro.k === 'pin' ? ' new' : ''}">${m.icon} 핀 ${L.pins.length}</span>`); }

function updateInk(){
  const left = 1 - inkUsed / L.ink;
  document.getElementById('inkFill').style.width = (left * 100) + '%';
  document.getElementById('inkTxt').textContent = `잉크 ${Math.round(left * 100)}% 남음 · 사용 ${Math.round(inkUsed / L.ink * 100)}%`;
}

// ---------- 선 그리기 ----------
function toWorld(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
// 선 두께(11px)만큼 물체와 겹치지 않게 가장자리 6px 안쪽은 그릴 수 없음
const EDGE = 6, PROBES = [[0, 0], [EDGE, 0], [-EDGE, 0], [0, EDGE], [0, -EDGE], [4.2, 4.2], [-4.2, 4.2], [4.2, -4.2], [-4.2, -4.2]];
function blocked(p){
  if (p.x < 2 || p.x > W - 2 || p.y < 2 || p.y > H - 2) return true;
  if (L.zones && L.zones.some(z => inRect(p, z, 0))) return true;
  const bs = [...statics, ...dynBodies, potBody];
  return PROBES.some(([ox, oy]) => Query.point(bs, { x: p.x + ox, y: p.y + oy }).length > 0);
}
function segFree(a, b){
  const steps = Math.max(1, Math.ceil(dist(a, b) / 3));
  for (let i = 1; i <= steps; i++){
    if (blocked({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps })) return (i - 1) / steps;
  }
  return 1;
}
function pushPt(q){
  const last = pts[pts.length - 1], d = dist(q, last);
  if (d < 0.5) return true;
  if (inkUsed + d >= L.ink){
    const f = (L.ink - inkUsed) / d;
    pts.push({ x: last.x + (q.x - last.x) * f, y: last.y + (q.y - last.y) * f });
    inkUsed = L.ink; updateInk(); endStroke(); return false;
  }
  pts.push(q); inkUsed += d; updateInk(); return true;
}
// 핀 근처를 지나가면 선이 핀 위로 스냅되고, 그 자리에 고정됨
function addPoint(q){
  const last = pts[pts.length - 1];
  for (const pin of L.pins){
    if (pin.on) continue;
    if (segPointDist(last, q, pin) < 12 && segFree(last, pin) >= 1){
      pin.on = true;
      if (!pushPt({ x: pin.x, y: pin.y })) return false;
      return addPoint(q);
    }
  }
  return pushPt(q);
}
// 막힌 곳을 눌렀으면 가장 가까운 빈 지점(최대 34px)으로 시작점을 옮김
function nearestFree(p, maxR = 34){
  if (!blocked(p)) return p;
  for (let r = 2; r <= maxR; r += 2){
    const n = Math.max(8, Math.round(r * 1.2));
    for (let i = 0; i < n; i++){
      const a = i / n * Math.PI * 2, q = { x: p.x + Math.cos(a) * r, y: p.y + Math.sin(a) * r };
      if (!blocked(q)) return q;
    }
  }
  return null;
}
function beginAt(p0){
  if (phase !== 'draw' || drawing) return false;
  const p = nearestFree(p0);
  if (!p){ showToast('물체 위에서는 시작할 수 없어요'); return false; }
  drawing = true; pts = [p];
  L.pins.forEach(pin => {
    if (dist(pin, p) < 12){ pin.on = true; pts = [{ x: pin.x, y: pin.y }]; }
  });
  document.getElementById('hint').classList.add('hidden');
  return true;
}
function moveTo(p){
  if (!drawing) return;
  const last = pts[pts.length - 1];
  finger = p;
  if (dist(p, last) < 4){ fingerBlocked = false; return; }
  const f = segFree(last, p);
  if (f >= 1){ fingerBlocked = false; addPoint(p); return; }
  fingerBlocked = true;
  if (!blockToastShown){ blockToastShown = true; showToast('선은 물체를 통과할 수 없어요 · 빈 곳으로 돌아오면 이어져요'); }
  const q = { x: last.x + (p.x - last.x) * f, y: last.y + (p.y - last.y) * f };
  if (dist(q, last) > 2) addPoint(q);
}
function release(){
  if (!drawing) return;
  const a = pts[0], z = pts[pts.length - 1];
  if (pts.length > 10 && dist(a, z) < 28 && segFree(z, a) >= 1) addPoint({ x: a.x, y: a.y });
  if (drawing) endStroke();
}
let activePointer = null;
cv.addEventListener('pointerdown', e => {
  // 이전 손가락 상태가 남아 있으면(놓친 pointerup) 정리하고 새로 시작
  if (drawing && phase === 'draw' && activePointer !== e.pointerId){ drawing = false; if (pts.length < 2){ pts = []; inkUsed = 0; } }
  if (beginAt(toWorld(e))){ activePointer = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (_){} }
});
cv.addEventListener('lostpointercapture', () => { if (drawing) release(); activePointer = null; });
cv.addEventListener('pointermove', e => moveTo(toWorld(e)));
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { release(); activePointer = null; }));

function showToast(msg){
  const h = document.getElementById('hint');
  h.textContent = msg; h.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (phase !== 'draw' || drawing) h.classList.add('hidden'); }, 2200);
}

const inkDensity = () => L.mods.includes('heavy') ? 0.0028 : 0.0012; // 선이 가벼워야 적에게 밀림
function endStroke(){
  drawing = false; fingerBlocked = false;
  if (inkUsed < 12){
    pts = []; inkUsed = 0; L.pins.forEach(p => p.on = false); updateInk();
    document.getElementById('hint').classList.remove('hidden'); return;
  }
  const rs = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++){
    acc += dist(pts[i], pts[i - 1]);
    const isPin = L.pins.some(p => p.on && p.x === pts[i].x && p.y === pts[i].y);
    if (acc >= 9 || i === pts.length - 1 || isPin){ rs.push(pts[i]); acc = 0; }
  }
  const parts = [];
  for (let i = 1; i < rs.length; i++){
    const a = rs[i - 1], b = rs[i], len = dist(a, b);
    if (len < 0.5) continue;
    parts.push(Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len + 2, 11, { angle: Math.atan2(b.y - a.y, b.x - a.x), density: inkDensity() }));
    if (i < rs.length - 1) parts.push(Bodies.circle(b.x, b.y, 5.5, { density: inkDensity() }));
  }
  if (!parts.length){ pts = []; inkUsed = 0; updateInk(); return; }
  lineBody = parts.length === 1 ? parts[0] : Body.create({ parts });
  // Matter.js는 조립 몸체의 관성에 평행축 항(m·r²)을 빼먹어서 선이 너무 쉽게 회전함 → 직접 계산
  if (parts.length > 1){
    let I = 0;
    for (const pt of lineBody.parts.slice(1)){
      const dx = pt.position.x - lineBody.position.x, dy = pt.position.y - lineBody.position.y;
      I += pt.inertia + pt.mass * (dx * dx + dy * dy);
    }
    Body.setInertia(lineBody, I);
  }
  lineBody.label = 'line';
  const ice = L.mods.includes('ice');
  lineBody.friction = ice ? 0.02 : 0.6; lineBody.frictionStatic = ice ? 0.05 : 1; lineBody.frictionAir = 0.01;
  if (ice) lineBody.parts.forEach(pt => { pt.friction = 0.02; pt.frictionStatic = 0.05; });
  const p0 = { x: lineBody.position.x, y: lineBody.position.y };
  lineLocal = pts.map(p => ({ x: p.x - p0.x, y: p.y - p0.y }));
  Composite.add(engine.world, lineBody);
  L.pins.filter(p => p.on).forEach(pin => {
    Composite.add(engine.world, Constraint.create({
      pointA: { x: pin.x, y: pin.y }, bodyB: lineBody,
      pointB: { x: pin.x - p0.x, y: pin.y - p0.y }, length: 0, stiffness: 0.9, damping: 0.1
    }));
  });
  startSim();
}

function startSim(){
  phase = 'sim'; simT = 0;
  if (tut) showToast('선은 물리 법칙대로 떨어져요 · 8초만 버티면 성공!');
  simRng = rng(L.seed + 7);
  spawnQ = [];
  L.hives.filter(h => h.kind === 'bee' || h.kind === 'tank').forEach(h => { for (let i = 0; i < h.n; i++) spawnQ.push({ t: (h.kind === 'tank' ? 250 + i * 650 : 100 + i * 110) + simRng() * 50, h }); });
  ducks = L.hives.filter(h => h.kind === 'wasp').map((h, i) => ({ h, next: 600 + i * 400 + simRng() * 300, burst: 0, shotT: 0, dir: { x: 0, y: 1 }, size: h.burst, gap: h.gap }));
  popQ = new Set();
  L.crawl.forEach(c => spawnQ.push({ t: c.t, crawl: c }));
  spawnQ.sort((a, b) => a.t - b.t);
  chuteT = L.chutes.map(c => c.first);
  pops = [];
  buildBaseGrid(); flow = null; flowStep = 0; prevPotSpeed = 0; lastHitT = -9999; lastImpactT = -9999;
}

// ---------- 충돌 ----------
function onCollide(ev){
  if (phase !== 'sim') return;
  for (const pr of ev.pairs){ handle(pr.bodyA, pr.bodyB, ev.name); handle(pr.bodyB, pr.bodyA, ev.name); }
}
let jetPush = [];
let prevPotSpeed = 0, lastHitT = -9999, lastImpactT = -9999, lastWet = false, ducks = [], popQ = new Set();
const WATER = ['drop', 'jet', 'splash'];
function ouch(dmg, wet = false){ hp -= dmg; flashT = 280; lastHitT = simT; lastWet = wet; }
function handle(a, b, name){
  // 높은 곳에서 떨어지거나 세게 부딪히면 다침
  if (name === 'collisionStart' && a.parent === potBody && (b.isStatic || b.parent.label === 'line') && prevPotSpeed > 6 && simT - lastImpactT > 500){ lastImpactT = simT; ouch(30); }
  if (a.parent === potBody){
    if (b.label === 'bee') hurtBy(b, 12, true);
    else if (b.label === 'tank') hurtBy(b, 22, true);
    else if (b.label === 'wasp') hurtBy(b, 18, true);
    else if (b.label === 'crawl') hurtBy(b, b.plugin.big ? 25 : 10, false);
    else if (WATER.includes(b.label)){ if (!toRemove.has(b)){ ouch(b.label === 'drop' ? 7 : b.label === 'jet' ? 6 : 4, true); toRemove.add(b); } }
    else if (b.label === 'balloon'){ if (!b.plugin.hit){ b.plugin.hit = true; ouch(18, true); } }
  }
  if (name === 'collisionStart' && a.label === 'jet' && b.parent.label === 'line') jetPush.push({ x: a.position.x, y: a.position.y, vx: a.velocity.x, vy: a.velocity.y, k: 0.004 });
  // 적이 선에 부딪히면 날아오던 방향으로 선을 튕겨냄(적마다 세기 다름). 무거운 적은 붙어 있는 동안 계속 밂
  if (b.parent.label === 'line'){
    const big = a.label === 'tank' || (a.label === 'crawl' && a.plugin && a.plugin.big);
    const k = name === 'collisionStart'
      ? ({ bee: 0.0030, tank: 0.0075, balloon: 0.0067, crawl: big ? 0.0075 : 0.0030 })[a.label] * L.force
      : (big ? 0.00042 * L.force : 0);
    // 선이 여러 조각이라 한 번 부딪혀도 충돌이 여러 개 생김 → 적 하나당 충격은 0.12초에 한 번, 미는 힘은 프레임당 한 번
    const P = a.plugin || {};
    const okHit = name === 'collisionStart' ? simT - (P.pushT ?? -1e9) >= 120 : P.pushStep !== simT;
    if (k && okHit){
      if (name === 'collisionStart') P.pushT = simT; else P.pushStep = simT;
      let vx = a.velocity.x, vy = a.velocity.y;
      if (Math.hypot(vx, vy) < 0.3){ vx = a.position.x - b.position.x; vy = a.position.y - b.position.y; vx = -vx; vy = -vy; }
      jetPush.push({ x: a.position.x, y: a.position.y, vx, vy, k });
    }
  }
  if (name === 'collisionStart' && WATER.includes(a.label) && b.parent !== potBody) toRemove.add(a);
  // 물풍선은 무엇에든 부딪히면 터짐
  if (name === 'collisionStart' && a.label === 'balloon' && !WATER.includes(b.label) && b.label !== 'balloon') popQ.add(a);
}
function hurtBy(c, dmg, knock){
  if (simT - c.plugin.hitT < 600) return;
  c.plugin.hitT = simT; ouch(dmg);
  if (knock){
    const dx = c.position.x - sproutPart.position.x, dy = c.position.y - sproutPart.position.y, m = Math.hypot(dx, dy) || 1;
    Body.setVelocity(c, { x: dx / m * 3, y: dy / m * 3 });
  } else Body.setVelocity(c, { x: Math.sign(c.position.x - sproutPart.position.x) * 2.5, y: -2 }); // 불독은 물고 살짝 튕겨남
}

// ---------- 벌레 길찾기: 격자 거리장(flow field) ----------
// 모모에서부터 BFS로 각 칸까지의 거리를 계산. 벌레는 거리가 줄어드는 이웃 칸으로 이동해 막힌 곳을 돌아감.
const CELL = 10, GW = Math.ceil(W / CELL), GH = Math.ceil(H / CELL);
let baseGrid, flow = null, flowGrid = null, flowStep = 0;
function buildBaseGrid(){
  baseGrid = new Uint8Array(GW * GH);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++){
    const c = { x: gx * CELL + CELL / 2, y: gy * CELL + CELL / 2 };
    if (L.S.some(o => inRect(c, o, 6)) || L.hives.some(h => dist(c, h) < 20)) baseGrid[gy * GW + gx] = 1;
  }
}
function markCircle(g, x, y, r){
  const x0 = Math.max(0, Math.floor((x - r) / CELL)), x1 = Math.min(GW - 1, Math.floor((x + r) / CELL));
  const y0 = Math.max(0, Math.floor((y - r) / CELL)), y1 = Math.min(GH - 1, Math.floor((y + r) / CELL));
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++){
    const cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
    if ((cx - x) * (cx - x) + (cy - y) * (cy - y) <= r * r) g[gy * GW + gx] = 1;
  }
}
function linePoints(){
  if (!lineBody) return [];
  const c = Math.cos(lineBody.angle), s = Math.sin(lineBody.angle), o = lineBody.position;
  return lineLocal.map(p => ({ x: o.x + p.x * c - p.y * s, y: o.y + p.x * s + p.y * c }));
}
function computeFlow(){
  const g = baseGrid.slice();
  // 움직이는 지형
  for (const b of dynBodies){
    const c = Math.cos(b.angle), sn = Math.sin(b.angle), w = b.plugin.w;
    for (let t = -w / 2; t <= w / 2; t += 6) markCircle(g, b.position.x + c * t, b.position.y + sn * t, b.plugin.h / 2 + 6);
  }
  // 선: 선 반두께 5.5 + 벌레 반지름 6 만큼 부풀려 표시
  const P = linePoints();
  for (let i = 1; i < P.length; i++){
    const a = P[i - 1], b = P[i], n = Math.max(1, Math.ceil(dist(a, b) / 4));
    for (let j = 0; j <= n; j++) markCircle(g, a.x + (b.x - a.x) * j / n, a.y + (b.y - a.y) * j / n, 11.5);
  }
  const d = new Int16Array(GW * GH).fill(-1), q = new Int32Array(GW * GH);
  let qh = 0, qt = 0;
  const hd = potBody.parts[2].position, tr = potBody.parts[1].position;
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++){
    const cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
    if (Math.hypot(cx - hd.x, cy - hd.y) < 30 || Math.hypot(cx - tr.x, cy - tr.y) < 28){ const i = gy * GW + gx; g[i] = 0; d[i] = 0; q[qt++] = i; }
  }
  while (qh < qt){
    const i = q[qh++], gx = i % GW, gy = (i / GW) | 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++){
      if (!ox && !oy) continue;
      const nx = gx + ox, ny = gy + oy;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const j = ny * GW + nx;
      if (d[j] >= 0 || g[j]) continue;
      if (ox && oy && (g[gy * GW + nx] || g[ny * GW + gx])) continue; // 대각선 모서리 끼어들기 금지
      d[j] = d[i] + 1; q[qt++] = j;
    }
  }
  flow = d; flowGrid = g;
}
function bestNeighbor(i){
  const gx = i % GW, gy = (i / GW) | 0;
  let best = -1, bv = 1e9;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++){
    if (!ox && !oy) continue;
    const nx = gx + ox, ny = gy + oy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    const j = ny * GW + nx;
    if (flow[j] >= 0 && flow[j] < bv){ bv = flow[j]; best = j; }
  }
  return best;
}
// 격자에서 a→모모 직선이 막혔는지
function clearShot(a, b){
  if (!flowGrid) return true;
  const n = Math.ceil(dist(a, b) / 5);
  for (let i = 1; i < n; i++){
    const x = a.x + (b.x - a.x) * i / n, y = a.y + (b.y - a.y) * i / n;
    if (Math.hypot(x - b.x, y - b.y) < 30) break;
    const gx = Math.floor(x / CELL), gy = Math.floor(y / CELL);
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) continue;
    if (flowGrid[gy * GW + gx]) return false;
  }
  return true;
}
// 길이 있으면 두 칸 앞을 향한 방향, 없으면 null(=직진해서 선을 밀어붙임)
function flowDir(b){
  if (!flow) return null;
  const gx = Math.floor(b.position.x / CELL), gy = Math.floor(b.position.y / CELL);
  if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return null;
  const i = gy * GW + gx;
  if (flow[i] === 0) return null;
  let n1 = flow[i] > 0 ? bestNeighbor(i) : bestNeighbor(i);
  if (n1 < 0 || (flow[i] > 0 && flow[n1] >= flow[i])) return null;
  const n2 = flow[n1] > 0 ? bestNeighbor(n1) : n1, t = n2 >= 0 ? n2 : n1;
  const tx = (t % GW) * CELL + CELL / 2, ty = ((t / GW) | 0) * CELL + CELL / 2;
  const dx = tx - b.position.x, dy = ty - b.position.y, m = Math.hypot(dx, dy) || 1;
  return { x: dx / m, y: dy / m };
}

// ---------- 시뮬레이션 ----------
function capV(body, max){
  const v = Body.getVelocity(body), m = Math.hypot(v.x, v.y);
  if (m > max) Body.setVelocity(body, { x: v.x / m * max, y: v.y / m * max });
}
function clampSpeeds(){
  for (const bug of bugs) capV(bug, bug.label === 'tank' ? 1.6 + L.speed * 0.3 : L.speed * 1.8);
  for (const d of drops) capV(d, d.label === 'jet' ? 7.5 : 7);
  for (const k of rocks) capV(k, 9);
  for (const c of crawlers){ const v = Body.getVelocity(c), cap = c.plugin.big ? 1.15 : 2.4; if (Math.abs(v.x) > cap) Body.setVelocity(c, { x: Math.sign(v.x) * cap, y: v.y }); }
  if (lineBody){
    capV(lineBody, 9);
    const av = Body.getAngularVelocity(lineBody);
    if (Math.abs(av) > 0.09) Body.setAngularVelocity(lineBody, Math.sign(av) * 0.09);
  }
  capV(potBody, 8);
  for (const b of dynBodies){
    if (b.label === 'seesaw' && Math.abs(b.angle) > 0.42){ Body.setAngle(b, Math.sign(b.angle) * 0.42); Body.setAngularVelocity(b, 0); }
    if (b.label === 'hang' && Math.abs(b.angle) > 0.3){ Body.setAngle(b, Math.sign(b.angle) * 0.3); Body.setAngularVelocity(b, 0); }
    capV(b, 6);
  }
}
function addBody(b, arr){ arr.push(b); Composite.add(engine.world, b); }

function step(){
  simT += STEP;
  if (flowStep++ % 8 === 0) computeFlow();
  while (spawnQ.length && spawnQ[0].t <= simT){
    const q = spawnQ.shift();
    if (q.crawl){
      const big = q.crawl.big, rr = big ? 21 : 10, x = q.crawl.side < 0 ? rr + 2 : W - rr - 2;
      const c = Bodies.circle(x, GY - rr - 1, rr, { label: 'crawl', density: big ? 0.014 : 0.0075, friction: 0.9, collisionFilter: { category: CAT_CRAWL, mask: CAT_DEF | CAT_CRAWL } });
      c.plugin = { hitT: -9999, ph: simRng() * 6, big, nextHop: simT + 500 + simRng() * 600 };
      addBody(c, crawlers);
    } else {
      const h = q.h, tank = h.kind === 'tank';
      const bug = Bodies.circle(h.x + (simRng() - 0.5) * 10, h.y + (tank ? 34 : 27), tank ? 11 : 6, {
        label: h.kind, frictionAir: tank ? 0.05 : 0.03, density: tank ? 0.012 : 0.003, restitution: tank ? 0.1 : 0.4,
        collisionFilter: { category: CAT_BUG, mask: CAT_DEF | CAT_BUG }
      });
      bug.plugin = { hitT: -9999, ph: simRng() * 6, mode: 'aim', until: simT + 500 + simRng() * 600, dir: null };
      addBody(bug, bugs);
    }
  }
  L.clouds.forEach((c, i) => {
    cloudAcc[i] += STEP;
    while (cloudAcc[i] >= c.rate){
      cloudAcc[i] -= c.rate;
      const d = Bodies.circle(c.x + (simRng() - 0.5) * (c.w - 20), 70, 3.5, {
        label: 'drop', frictionAir: 0.01, density: 0.0008, collisionFilter: { category: CAT_DROP, mask: CAT_DEF }
      });
      d.plugin = { born: simT };
      Body.setVelocity(d, { x: 0, y: 2 });
      addBody(d, drops);
    }
  });
  L.chutes.forEach((c, i) => {
    if (simT >= chuteT[i]){
      chuteT[i] += c.interval;
      const k = Bodies.circle(c.x, c.y, c.r, { label: 'balloon', density: 0.008, friction: 0.3, restitution: 0.25, collisionFilter: { category: 32, mask: 0xFFFFFFFF & ~16 } });
      k.plugin = { hit: false, col: Math.floor(simRng() * 4) };
      Body.setVelocity(k, { x: c.vx, y: c.vy });
      addBody(k, rocks);
    }
  });
  for (const dk of ducks){
    const h = dk.h, hd = sproutPart.position;
    if (!dk.burst){
      const dx = hd.x - h.x, dy = hd.y - h.y, m = Math.hypot(dx, dy) || 1;
      dk.dir = { x: dx / m, y: dy / m }; // 조준 중에는 모모를 계속 따라감
      if (simT >= dk.next){ dk.burst = dk.size; dk.shotT = simT; }
    }
    if (dk.burst && simT >= dk.shotT){
      const j = Bodies.circle(h.x + dk.dir.x * 18, h.y + dk.dir.y * 18, 3.4, {
        label: 'jet', frictionAir: 0, density: 0.0008, collisionFilter: { category: CAT_DROP, mask: CAT_DEF }
      });
      j.plugin = { born: simT };
      Body.setVelocity(j, { x: dk.dir.x * 7, y: dk.dir.y * 7 });
      addBody(j, drops);
      dk.burst--; dk.shotT = simT + 55;
      if (!dk.burst) dk.next = simT + dk.gap + simRng() * 300;
    }
  }
  for (const c of crawlers){
    if (!c.plugin.big && simT > c.plugin.nextHop && Math.abs(c.velocity.y) < 0.4){
      Body.setVelocity(c, { x: Body.getVelocity(c).x, y: -4.6 }); c.plugin.nextHop = simT + 900 + simRng() * 700;
    }
  }
  for (const d of drops) if (d.position.y > H + 20 || d.position.x < -20 || d.position.x > W + 20 || simT - d.plugin.born > (d.label === 'splash' ? 1500 : 4000)) toRemove.add(d);
  for (const k of rocks) if (k.position.y > H + 40 || k.position.x < -60 || k.position.x > W + 60) toRemove.add(k);

  const g = engine.gravity, sp = sproutPart.position;
  for (let s = 0; s < SUB; s++){
    for (const bug of bugs){
      Body.applyForce(bug, bug.position, { x: 0, y: -bug.mass * g.y * g.scale });
      let dx = sp.x - bug.position.x, dy = sp.y - bug.position.y, m = Math.hypot(dx, dy) || 1;
      if (bug.label === 'wasp'){
        const P = bug.plugin;
        if (P.mode === 'aim'){
          if (s === 0) P.shot = clearShot(bug.position, sp);
          const fd = s === 0 ? (P.fd = flowDir(bug)) : P.fd;
          if (!P.shot && fd){
            // 직선이 막혀 있으면 길을 따라 돌아서 접근
            Body.applyForce(bug, bug.position, { x: bug.mass * fd.x * 0.0012, y: bug.mass * fd.y * 0.0012 });
          } else {
            // 모모에서 110px 떨어진 곳에서 맴돌며 노림
            const tx = sp.x - dx / m * 110, ty = sp.y - dy / m * 110;
            const ex = tx - bug.position.x, ey = ty - bug.position.y, em = Math.hypot(ex, ey) || 1;
            Body.applyForce(bug, bug.position, { x: bug.mass * (ex / em * 0.0011 + (simRng() - 0.5) * 0.001), y: bug.mass * (ey / em * 0.0011 + (simRng() - 0.5) * 0.001) });
          }
          if (simT > P.until && (P.shot || !fd)){ P.mode = 'dash'; P.dir = { x: dx / m, y: dy / m }; P.until = simT + 550; }
        } else {
          Body.applyForce(bug, bug.position, { x: bug.mass * P.dir.x * 0.004, y: bug.mass * P.dir.y * 0.004 });
          if (simT > P.until){ P.mode = 'aim'; P.until = simT + 700 + simRng() * 500; }
        }
      } else {
        const tank = bug.label === 'tank';
        const fd = s === 0 ? (bug.plugin.fd = flowDir(bug)) : bug.plugin.fd;
        // 헤비 드론은 길이 막히면(직진 모드) 추력을 올려 선을 밀어붙임
        const acc = tank ? (fd ? 0.0010 : 0.0018) * (0.6 + L.force * 0.5) : 0.0012 * L.speed / 2.2 * (fd ? 1 : 1 + 0.5 * L.force);
        bug.plugin.ram = tank && !fd;
        let ux = dx / m, uy = dy / m;
        if (fd){ ux = fd.x; uy = fd.y; }
        // 좌우로 흔들리는 비행(일직선 방지)
        const wob = Math.sin(simT / 200 + bug.plugin.ph) * (tank ? 0.00012 : 0.0004);
        Body.applyForce(bug, bug.position, {
          x: bug.mass * (ux * acc - uy * wob + (simRng() - 0.5) * 0.001),
          y: bug.mass * (uy * acc + ux * wob + (simRng() - 0.5) * 0.001)
        });
      }
    }
    for (const c of crawlers) Body.applyForce(c, c.position, { x: c.mass * (c.plugin.big ? 0.0012 : 0.0011) * Math.sign(potBody.position.x - c.position.x), y: 0 });
    for (const d of drops) if (d.label === 'jet') Body.applyForce(d, d.position, { x: 0, y: -d.mass * g.y * g.scale });
    for (const w of L.winds){
      const inB = y => y > w.y0 && y < w.y1;
      const push = (b, k) => { if (inB(b.position.y)) Body.applyForce(b, b.position, { x: b.mass * k * w.dir * w.str, y: 0 }); };
      drops.forEach(d => { if (d.label !== 'jet') push(d, 0.0007); }); bugs.forEach(b => push(b, 0.0004)); rocks.forEach(k => push(k, 0.0002));
      if (lineBody){
        const parts = lineBody.parts.length > 1 ? lineBody.parts.slice(1) : [lineBody];
        for (const p of parts) if (inB(p.position.y)) Body.applyForce(lineBody, p.position, { x: p.mass * 0.0005 * w.dir * w.str, y: 0 });
      }
    }
    if (jetPush.length && lineBody){
      for (const j of jetPush){ const m = Math.hypot(j.vx, j.vy) || 1; Body.applyForce(lineBody, { x: j.x, y: j.y }, { x: j.vx / m * lineBody.mass * j.k, y: j.vy / m * lineBody.mass * j.k }); }
      jetPush = [];
    }
    Engine.update(engine, STEP / SUB);
    clampSpeeds();
  }
  if (popQ.size){
    popQ.forEach(bl => {
      toRemove.add(bl);
      for (let i = 0; i < 8; i++){
        const ang = -Math.PI * (0.05 + 0.9 * i / 7) + (simRng() - 0.5) * 0.3, sp2 = 2.5 + simRng() * 2;
        const sx = bl.position.x + Math.cos(ang) * (bl.circleRadius + 3), sy = bl.position.y + Math.sin(ang) * (bl.circleRadius + 3);
        const d = Bodies.circle(sx, sy, 2.8, { label: 'splash', frictionAir: 0.01, density: 0.0008, collisionFilter: { category: CAT_DROP, mask: CAT_DEF } });
        d.plugin = { born: simT };
        Body.setVelocity(d, { x: Math.cos(ang) * sp2 + bl.velocity.x * 0.3, y: Math.sin(ang) * sp2 });
        addBody(d, drops);
      }
      pops.push({ x: bl.position.x, y: bl.position.y, t: simT, col: bl.plugin.col });
    });
    popQ.clear();
  }
  if (toRemove.size){
    toRemove.forEach(b => Composite.remove(engine.world, b));
    drops = drops.filter(d => !toRemove.has(d));
    rocks = rocks.filter(k => !toRemove.has(k));
    toRemove.clear();
  }
  if (flashT > 0) flashT -= STEP;
  hp = Math.max(0, hp);
  if (hp <= 0) return finish(false, lastWet ? '모모가 흠뻑 젖었어요' : '모모가 다쳤어요');
  if (potBody.position.y > H + 60 || potBody.position.x < -60 || potBody.position.x > W + 60) return finish(false, '모모가 떨어졌어요');
  prevPotSpeed = Body.getSpeed(potBody);
  if (simT >= SIM_MS) return finish(true);
}

// ---------- 종료 ----------
function finish(win, reason, delay = 450){
  phase = 'end';
  const pct = Math.round(inkUsed / L.ink * 100);
  const stars = pct <= 22 ? 3 : pct <= 40 ? 2 : 1;
  const score = win ? Math.round((1 - inkUsed / L.ink) * 700 + hp * 3) : 0;
  endInfo = { win, pct, stars, score, hp: Math.round(hp), reason };
  let best = store.get(curKey(), null), newBest = false;
  if (win && (!best || score > best.score)){ best = { score, pct }; store.set(curKey(), best); newBest = true; }
  if (win && mode === 'level' && level + 1 > store.get('ss_level', 1)) store.set('ss_level', level + 1);
  setTimeout(() => {
    if (phase !== 'end') return;
    document.getElementById('mTitle').textContent = win ? (tut ? '성공! 낮잠을 지켰어요' : '성공!') : '실패 · ' + reason;
    const tip = document.getElementById('mTip');
    const tipText = tut ? (win ? '잉크를 적게 쓸수록 ⭐이 늘어나요. 22% 이하면 ⭐⭐⭐!' : '틈이 있으면 드론이 돌아서 들어와요. 빈틈없이 감싸 보세요!')
      : (!win && reason === '모모가 떨어졌어요') ? '선이 너무 무거우면 모모를 밀어낼 수 있어요' : '';
    tip.textContent = tipText; tip.classList.toggle('hidden', !tipText);
    if (tut && win) store.set('momo_tut_done', true);
    document.getElementById('mStars').textContent = win ? '⭐'.repeat(stars) + '☆'.repeat(3 - stars) : '💧';
    document.getElementById('mInk').textContent = pct + '%';
    document.getElementById('mHp').textContent = Math.round(hp);
    document.getElementById('mScore').textContent = score;
    document.getElementById('mBest').textContent = newBest ? '🏆 최고기록' : (best ? `(최고 ${best.score})` : '');
    document.getElementById('mNext').classList.toggle('hidden', !win || mode === 'daily');
    document.getElementById('mRetry').textContent = win ? '다시 도전 (잉크 줄이기)' : '다시 도전';
    document.getElementById('mShare').classList.toggle('hidden', !win);
    document.getElementById('modalWrap').classList.remove('hidden');
  }, delay);
}

// ---------- 렌더링 ----------
function poly(vs){ ctx.beginPath(); ctx.moveTo(vs[0].x, vs[0].y); for (let i = 1; i < vs.length; i++) ctx.lineTo(vs[i].x, vs[i].y); ctx.closePath(); }
function lerpColor(a, b, t){ return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
const now = () => phase === 'draw' ? performance.now() : simT;
function drawWind(w){
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(0, w.y0, W, w.y1 - w.y0);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const t = now() / 1000, rows = Math.max(3, Math.floor((w.y1 - w.y0) / 28));
  for (let i = 0; i < rows; i++){
    const y = w.y0 + (i + 0.5) * (w.y1 - w.y0) / rows;
    for (let j = 0; j < 3; j++){
      let x = ((j * 140 + i * 57 + t * 160 * w.dir * w.str) % (W + 60) + W + 60) % (W + 60) - 30;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 26 * w.dir, y); ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '800 11px sans-serif'; ctx.textAlign = w.dir > 0 ? 'left' : 'right';
  ctx.fillText(w.dir > 0 ? '💨 바람 →' : '← 바람 💨', w.dir > 0 ? 8 : W - 8, w.y0 + 14);
}
let pops = [];
const BALLOON = ['#ff6b8b', '#4dabf7', '#ffd43b', '#69db7c'];
function drawCloud(c){
  ctx.fillStyle = '#7d8896';
  const n = Math.max(3, Math.round(c.w / 30));
  for (let i = 0; i < n; i++){
    const x = c.x - c.w / 2 + 15 + i * (c.w - 30) / (n - 1);
    ctx.beginPath(); ctx.arc(x, 48 + (i % 2 ? -6 : 2), 18 + (i % 2) * 5, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#d0ebff'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('비구름', c.x, 52);
}
function duckOf(h){ return ducks.find(d => d.h === h); }
function drawHive(h){
  const t = phase === 'draw' ? performance.now() : simT;
  if (h.kind === 'wasp'){
    // 물총 오리
    const dk = duckOf(h), hd = sproutPart.position;
    const dir = dk ? dk.dir : (() => { const dx = hd.x - h.x, dy = hd.y - h.y, m = Math.hypot(dx, dy) || 1; return { x: dx / m, y: dy / m }; })();
    const face = dir.x >= 0 ? 1 : -1, bob = Math.sin(t / 300) * 1.5;
    if (dk && phase === 'sim' && !dk.burst && dk.next - simT < 650){
      ctx.setLineDash([4, 5]); ctx.strokeStyle = 'rgba(77,171,247,.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(h.x + dir.x * 18, h.y + dir.y * 18); ctx.lineTo(h.x + dir.x * 90, h.y + dir.y * 90); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.save(); ctx.translate(h.x, h.y + bob);
    ctx.save(); ctx.rotate(Math.atan2(dir.y, dir.x));
    ctx.fillStyle = '#339af0'; rrect(2, -4, 18, 8, 3); ctx.fill(); ctx.fillStyle = '#1c7ed6'; ctx.fillRect(4, 3, 5, 6);
    ctx.restore();
    ctx.scale(face, 1);
    ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.ellipse(-2, 6, 15, 10, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-10, 2, 6, 4, -0.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -6, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff922b'; ctx.beginPath(); ctx.ellipse(13, -4, 5, 2.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#212529'; ctx.beginPath(); ctx.arc(6, -8, 1.8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e8a400'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(-2, 6, 15, 10, 0, 0, 7); ctx.stroke();
    ctx.restore();
    return;
  }
  if (h.kind === 'tank'){
    // 헤비 드론 격납고: 크고 노랑·검정 경고 줄무늬
    ctx.save(); ctx.translate(h.x, h.y);
    ctx.fillStyle = '#343a40'; rrect(-26, -12, 52, 26, 6); ctx.fill();
    ctx.save(); rrect(-26, 6, 52, 8, 3); ctx.clip();
    for (let x = -30; x < 30; x += 10){ ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.moveTo(x, 14); ctx.lineTo(x + 5, 14); ctx.lineTo(x + 13, 6); ctx.lineTo(x + 8, 6); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = Math.floor(t / 300) % 2 ? '#ff6b6b' : '#c92a2a'; ctx.beginPath(); ctx.arc(0, -3, 4, 0, 7); ctx.fill();
    ctx.restore(); return;
  }
  // 드론 기지
  ctx.save(); ctx.translate(h.x, h.y);
  ctx.fillStyle = '#495057'; rrect(-20, -8, 40, 18, 5); ctx.fill();
  ctx.fillStyle = '#343a40'; ctx.fillRect(-14, 6, 28, 5);
  ctx.strokeStyle = '#495057'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, -8); ctx.lineTo(16, -18); ctx.stroke();
  ctx.fillStyle = Math.floor(t / 400) % 2 ? '#ff6b6b' : '#ffa8a8'; ctx.beginPath(); ctx.arc(16, -19, 2.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#74c0fc'; ctx.fillRect(-14, -3, 18, 5);
  ctx.restore();
}
function drawChute(c){
  // 물풍선 발사대(파란 통)
  ctx.fillStyle = '#4dabf7';
  if (c.type === 'top'){ ctx.fillRect(c.x - 17, 0, 34, 16); ctx.fillStyle = '#1c7ed6'; ctx.fillRect(c.x - 13, 10, 26, 6); }
  else { const x = c.x < 0 ? 0 : W - 22; /* 발사구는 화면 가장자리에 그림 */ ctx.fillRect(x, c.y - 17, 22, 34); ctx.fillStyle = '#1c7ed6'; ctx.fillRect(c.x < 0 ? 16 : W - 22, c.y - 13, 6, 26); }
  if (phase === 'draw'){
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'center';
    if (c.type === 'top') ctx.fillText('🎈 ↓', c.x, 30);
    else ctx.fillText(c.x < 0 ? '🎈 →' : '← 🎈', c.x < 0 ? 40 : W - 40, c.y + 4);
  }
}
function rrect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function hash(n){ n = Math.sin(n * 127.1) * 43758.5453; return n - Math.floor(n); }
// 돌 블록: 둥근 모서리 + 잔디 윗면 + 돌 무늬
function drawStone(b, grassTop){
  const th = TH(), w = b.plugin.w, h = b.plugin.h, seed = b.position.x * 0.37 + b.position.y;
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  ctx.fillStyle = th.stone; rrect(-w / 2, -h / 2, w, h, Math.min(6, h / 3)); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  const n = Math.max(2, Math.floor(w * h / 900));
  for (let i = 0; i < n; i++){ ctx.beginPath(); ctx.ellipse(-w / 2 + hash(seed + i) * w, -h / 2 + 8 + hash(seed + i * 3.1) * (h - 8), 3 + hash(seed + i * 7) * 6, 2 + hash(seed + i * 5) * 3, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(-w / 2, -h / 2, w, 3);
  if (grassTop){
    ctx.fillStyle = th.grass; ctx.fillRect(-w / 2, -h / 2, w, 6);
    for (let x = -w / 2 + 4; x < w / 2; x += 7) { ctx.beginPath(); ctx.moveTo(x, -h / 2 + 6); ctx.lineTo(x + 3, -h / 2 + 10); ctx.lineTo(x + 6, -h / 2 + 6); ctx.fill(); }
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; rrect(-w / 2, -h / 2, w, h, Math.min(6, h / 3)); ctx.stroke();
  ctx.restore();
}
// 나무 판자
function drawWood(b){
  const w = b.plugin.w, h = b.plugin.h;
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  ctx.fillStyle = '#b07a43'; rrect(-w / 2, -h / 2, w, h, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(80,45,15,.35)'; ctx.lineWidth = 1;
  for (let y = -h / 2 + 4; y < h / 2 - 1; y += 4){ ctx.beginPath(); ctx.moveTo(-w / 2 + 3, y); ctx.lineTo(w / 2 - 3, y + (y % 8 ? 0.6 : -0.6)); ctx.stroke(); }
  ctx.fillStyle = '#5b3a1c';
  for (const x of [-w / 2 + 6, w / 2 - 6]){ ctx.beginPath(); ctx.arc(x, 0, 1.6, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 1.5; rrect(-w / 2, -h / 2, w, h, 3); ctx.stroke();
  ctx.restore();
}
function drawStatic(b){
  const th = TH(), k = b.label;
  if (k === 'tile') return; // 파낸 지형은 배경에 미리 그림
  if (k === 'ground'){
    const v = b.vertices, x0 = Math.min(...v.map(p => p.x)), x1 = Math.max(...v.map(p => p.x));
    ctx.fillStyle = th.ground; ctx.fillRect(x0, GY, x1 - x0, 40);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, GY, x1 - x0, 40); ctx.clip();
    const bg = th.bg;
    if (bg === 'living'){ ctx.strokeStyle = 'rgba(60,35,15,.35)'; ctx.lineWidth = 1.5; for (let y = GY + 10; y < H; y += 10){ ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); for (let x = ((y / 10) % 2) * 30; x < W; x += 60){ ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y); ctx.stroke(); } } }
    else if (bg === 'roof'){ ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let y = GY + 6; y < H; y += 10) for (let x = ((y / 10) % 2) * 8; x < W; x += 16){ ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI); ctx.fill(); } }
    else if (bg === 'beach'){ ctx.fillStyle = 'rgba(150,110,50,.3)'; for (let i = 0; i < 60; i++) ctx.fillRect((i * 53) % W, GY + 6 + (i * 17) % 32, 2, 2); }
    else if (bg === 'alley'){ ctx.fillStyle = 'rgba(120,150,200,.25)'; for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.ellipse((i * 97 + 40) % W, GY + 16, 24, 4, 0, 0, 7); ctx.fill(); } }
    else if (bg === 'bath'){ ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; for (let x = 0; x < W; x += 20){ ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x, H); ctx.stroke(); } for (let y = GY + 20; y < H; y += 20){ ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); } }
    ctx.restore();
    if (bg === 'yard' || bg === 'park'){ ctx.fillStyle = th.grass; ctx.fillRect(x0, GY, x1 - x0, 7); }
    else { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x0, GY, x1 - x0, 3); }
    return;
  }
  if (k === 'hill'){
    const r = b.circleRadius;
    ctx.fillStyle = th.ground; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GY + 6); ctx.clip();
    ctx.strokeStyle = th.grass; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r - 5, 0, 7); ctx.stroke();
    ctx.restore(); return;
  }
  if (k === 'boulder'){
    const r = b.circleRadius;
    ctx.fillStyle = '#8a8278'; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(b.position.x - r * 0.3, b.position.y - r * 0.35, r * 0.4, 0, 7); ctx.fill();
    ctx.strokeStyle = '#5a534b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 7); ctx.stroke();
    return;
  }
  if (k === 'obs' || k === 'plank') return drawWood(b);
  if (k === 'box'){
    const w = b.plugin.w;

    g.fillStyle = '#2b3245'; g.fillRect(lx, 330, 5, GY - 330); g.fillRect(lx - 14, 330, 24, 5);
    const gl = g.createRadialGradient(lx - 10, 340, 2, lx - 10, 340, 70); gl.addColorStop(0, 'rgba(255,220,140,.5)'); gl.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = gl; g.beginPath(); g.arc(lx - 10, 340, 70, 0, 7); g.fill();
    g.strokeStyle = 'rgba(180,200,255,.18)'; g.lineWidth = 1;
    for (let i = 0; i < 60; i++){ const x = R(0, W), y = R(0, GY); g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y + 12); g.stroke(); }
  } else if (bg === 'bath'){
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2;
    for (let x = 0; x <= W; x += 30){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, GY); g.stroke(); }
    for (let y = 0; y <= GY; y += 30){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    const tx = R(20, W - 170);
    g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.moveTo(tx, GY - 70); g.lineTo(tx + 150, GY - 70); g.quadraticCurveTo(tx + 150, GY, tx + 110, GY); g.lineTo(tx + 40, GY); g.quadraticCurveTo(tx, GY, tx, GY - 70); g.fill();
    g.fillStyle = 'rgba(120,200,230,.6)'; g.fillRect(tx + 6, GY - 66, 138, 10);
    for (let i = 0; i < 4; i++) cloud(R(0, W - 60), R(60, 300), R(0.8, 1.3), 0.35);
  }
  if (L.carve) drawCarve(g, th);
  return c;
}
function drawCarve(g, th){
  const lay = document.createElement('canvas'); lay.width = W * 2; lay.height = H * 2;
  const q = lay.getContext('2d'); q.scale(2, 2);
  const shape = o => { q.beginPath(); if (o.t === 'rect') q.rect(o.x0, o.y0, o.x1 - o.x0, o.y1 - o.y0); else q.ellipse(o.cx, o.cy, o.rx, o.ry, 0, 0, 7); };
  for (const o of L.carve){ q.globalCompositeOperation = o.op === 'add' ? 'source-over' : 'destination-out'; q.fillStyle = th.ground; shape(o); q.fill(); }
  // 흙 무늬(벽돌)와 굴 안쪽 테두리는 흙 위에만
  q.globalCompositeOperation = 'source-atop';
  q.strokeStyle = 'rgba(0,0,0,.10)'; q.lineWidth = 1.2;
  for (let y = 0; y < H; y += 14){ q.beginPath(); q.moveTo(0, y); q.lineTo(W, y); q.stroke(); for (let x = (y / 14) % 2 * 14; x < W; x += 28){ q.beginPath(); q.moveTo(x, y); q.lineTo(x, y + 14); q.stroke(); } }
  q.strokeStyle = 'rgba(60,30,15,.55)'; q.lineWidth = 6;
  for (const o of L.carve) if (o.op === 'cut'){ shape(o); q.stroke(); }
  // 파낸 뒤 다시 채운 바닥(평평한 굴 바닥)은 테두리 없이 다시 칠함
  q.globalCompositeOperation = 'source-over';
  let afterCut = false;
  for (const o of L.carve){
    if (o.op === 'cut'){ afterCut = true; continue; }
    if (!afterCut) continue;
    q.save(); shape(o); q.clip(); q.fillStyle = th.ground; q.fillRect(0, 0, W, H);
    q.strokeStyle = 'rgba(0,0,0,.10)'; q.lineWidth = 1.2;
    for (let y = 0; y < H; y += 14){ q.beginPath(); q.moveTo(0, y); q.lineTo(W, y); q.stroke(); for (let x = (y / 14) % 2 * 14; x < W; x += 28){ q.beginPath(); q.moveTo(x, y); q.lineTo(x, y + 14); q.stroke(); } }
    q.strokeStyle = 'rgba(60,30,15,.55)'; q.lineWidth = 3; q.beginPath(); q.moveTo(o.x0, o.y0); q.lineTo(o.x1, o.y0); q.stroke();
    q.restore();
  }
  // 윗면 잔디
  q.globalCompositeOperation = 'source-over';
  const cols = Math.ceil(W / TILE);
  q.fillStyle = th.grass;
  for (let x = 0; x < W; x += 2){
    for (let y = 2; y < H; y += 2){
      if (solidAt(L.carve, x, y) && !solidAt(L.carve, x, y - 3)){ if (y <= L.carveInfo.ys + 4) q.fillRect(x, y, 2.2, 6); break; }
    }
  }
  // 땅속 굴 안쪽(지표 아래)은 어두운 흙벽으로 — 배경 풍경이 비치지 않게
  g.save(); g.beginPath(); g.rect(0, L.carveInfo.ys + 2, W, H); g.clip();
  g.fillStyle = th.ground; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(20,10,5,.55)'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 1;
  for (let y = 0; y < H; y += 14){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore();
  g.drawImage(lay, 0, 0, W, H);
}
function render(){
  const th = TH();
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  if (bgKey !== L.seed + ':' + L.theme){ bgCanvas = buildBackdrop(); bgKey = L.seed + ':' + L.theme; }
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  // 금지 구역
  (L.zones || []).forEach(z => {
    ctx.save(); ctx.beginPath(); ctx.rect(z.x - z.w / 2, z.y - z.h / 2, z.w, z.h); ctx.clip();
    ctx.fillStyle = 'rgba(230,50,50,.10)'; ctx.fillRect(z.x - z.w / 2, z.y - z.h / 2, z.w, z.h);
    ctx.strokeStyle = 'rgba(230,50,50,.35)'; ctx.lineWidth = 4;
    for (let d = -z.h; d < z.w; d += 14){ ctx.beginPath(); ctx.moveTo(z.x - z.w / 2 + d, z.y + z.h / 2); ctx.lineTo(z.x - z.w / 2 + d + z.h, z.y - z.h / 2); ctx.stroke(); }
    ctx.restore();
    ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(230,50,50,.8)'; ctx.lineWidth = 2; ctx.strokeRect(z.x - z.w / 2, z.y - z.h / 2, z.w, z.h); ctx.setLineDash([]);
    ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🚫', z.x, z.y + 5);
  });
  L.winds.forEach(drawWind);
  L.clouds.forEach(drawCloud);
  if (L.cave){ const c = L.cave, x0 = c.left ? 0 : c.mouth, x1 = c.left ? c.mouth : W; ctx.fillStyle = 'rgba(30,20,10,.22)'; ctx.fillRect(x0, c.ceilY, x1 - x0, c.floorY - c.ceilY); }
  statics.forEach(drawStatic);
  dynBodies.forEach(drawDyn);
  L.chutes.forEach(drawChute);
  L.hives.forEach(drawHive);
  if (phase === 'draw' && L.crawl.length){
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '700 11px sans-serif';
    [...new Set(L.crawl.map(c => c.side))].forEach(sd => { ctx.textAlign = sd < 0 ? 'left' : 'right'; const ic = L.crawl.some(c => c.side === sd && c.big) ? '🐕' : '🐶'; ctx.fillText(sd < 0 ? ic + ' →' : '← ' + ic, sd < 0 ? 6 : W - 6, GY - 10); });
  }
  drawCat();
  drops.forEach(drawWater);
  rocks.forEach(drawRock);
  drawPops();
  crawlers.forEach(drawCrawler);
  drawLine();
  L.pins.forEach(drawPin);
  if (tut && phase === 'draw' && !drawing && pts.length === 0) drawGuide();
  bugs.forEach(drawBug);
  if (phase === 'sim') setTimerUI(Math.max(0, (SIM_MS - simT) / 1000));
  else if (phase === 'end') setTimerUI(-1);
}

// ---------- 루프 ----------
function resize(){
  const st = document.getElementById('stage');
  const w = st.clientWidth - 16, h = st.clientHeight - 8;
  const ns = Math.min(w / W, h / H), nd = window.devicePixelRatio || 1;
  if (ns === scale && nd === dpr && cv.width) return; // 크기 그대로면 다시 만들지 않음
  scale = ns; dpr = nd;
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(document.getElementById('stage'));
let last = performance.now(), accum = 0;
// 다음 프레임 예약을 먼저 해서, 계산·그리기에서 오류가 나도 화면이 멈추지 않게 함
let loopErrors = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(100, t - last); last = t;
  try {
    if (phase === 'sim'){
      accum += dt;
      let n = 0;
      while (accum >= STEP && n < 5 && phase === 'sim'){ step(); accum -= STEP; n++; }
      if (n >= 5) accum = 0;
    } else accum = 0;
  } catch (e){ console.error(e); if (++loopErrors > 20){ loopErrors = 0; finish(false, '오류가 나서 다시 시작해요'); } }
  try { render(); } catch (e){ console.error(e); try { ctx.setLineDash([]); ctx.restore(); } catch (_){} }
}
// ---------- 이야기 (처음 실행 시 한 번) ----------
const STORY = [
  { art: '<img src="assets/momo_sleepy.png" class="big bob" alt=""><div class="zz">z z</div>', text: '햇살 좋은 오후,<br>낮잠이 세상에서 제일 좋은 고양이 <b>모모</b>.' },
  { art: '<div class="row"><span>🛸</span><span>🦆</span><span>🎈</span><span>🐶</span></div>', text: '그런데 오늘은 <b>목욕하는 날!</b><br>집사는 물 드론, 물총 오리, 물풍선을 꺼냈고<br>옆집 불독까지 놀자고 달려와요.' },
  { art: '<img src="assets/momo_surprised.png" class="big shake" alt="">', text: '물이라면 질색인 모모를<br>도와줄 수 있는 건 당신의 <b>펜 한 자루</b>뿐!' },
  { art: '<div class="pen">✏️</div><img src="assets/momo_sit.png" class="big" alt="">', text: '<b>선을 딱 한 번</b> 그어 벽을 만들고<br><b>8초</b> 동안 모모를 지켜 주세요.' },
];
let storyIdx = 0, cards = STORY;
function renderStory(){
  const sc = cards[storyIdx];
  document.getElementById('sArt').innerHTML = sc.art;
  document.getElementById('sText').innerHTML = sc.text;
  document.getElementById('sDots').innerHTML = cards.map((_, i) => `<i class="${i === storyIdx ? 'on' : ''}"></i>`).join('');
  document.getElementById('sNext').textContent = storyIdx === cards.length - 1 ? '시작하기 🐾' : '다음 ▶';
  document.getElementById('sSkip').style.display = cards.length > 1 ? '' : 'none';
}
function showStory(){ cards = STORY; storyIdx = 0; renderStory(); document.getElementById('story').classList.remove('hidden'); }
function closeStory(){
  document.getElementById('story').classList.add('hidden');
  if (!store.get('momo_story_seen', false)){ store.set('momo_story_seen', true); mode = 'level'; level = 1; setup(); }
}
document.getElementById('sNext').onclick = () => { if (storyIdx < cards.length - 1){ storyIdx++; renderStory(); } else closeStory(); };
// 새 챕터(11, 21, 31…레벨)에 처음 들어가면 장소 이동 이야기
function maybeChapterCard(){
  if (mode !== 'level' || level === 1 || (level - 1) % 10 !== 0) return;
  const key = 'momo_ch_' + level;
  if (store.get(key, false)) return;
  store.set(key, true);
  const ch = CHAPTERS[chapterOf(level)], rd = roundOf(level);
  cards = [{ art: `<div class="row"><span>${ch.icon}</span></div><img src="assets/momo_surprised.png" class="big shake" alt="" style="height:110px">`,
    text: `<b>챕터 ${Math.floor((level - 1) / 10) + 1} · ${ch.name}</b><br>` + (rd ? `<b>${rd + 1}회차</b> · 집사가 더 강해져서 돌아왔어요!<br>` : '') + (ch.story || '모모의 도망은 다시 거실에서 시작돼요.') }];
  storyIdx = 0; renderStory(); document.getElementById('story').classList.remove('hidden');
}
document.getElementById('sSkip').onclick = closeStory;
document.getElementById('btnStory').onclick = showStory;

resize(); setup(); requestAnimationFrame(loop);
if (!store.get('momo_story_seen', false)) showStory();

// ---------- 앱 설치(PWA) ----------
// 오프라인 실행용 서비스 워커. 한 번 열면 인터넷 없이도 실행됨
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => {
    // 새 버전이 설치되면, 선을 그리기 전 대기 화면일 때 조용히 새로고침
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return;
      const tryReload = () => { if (phase === 'draw' && !drawing && pts.length === 0){ reloaded = true; location.reload(); } else setTimeout(tryReload, 1500); };
      tryReload();
    });
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();
      setInterval(() => { try { reg.update(); } catch (_){} }, 30 * 60 * 1000);
    }).catch(() => {});
  });
}
// 안드로이드 크롬: 설치 버튼 / 아이폰 사파리: 홈 화면 추가 안내
let installEvt = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.getElementById('btnInstall').classList.remove('hidden'); });
if (isIOS && !standalone) document.getElementById('btnInstall').classList.remove('hidden');
document.getElementById('btnInstall').onclick = async () => {
  if (installEvt){
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (_){}
    installEvt = null; document.getElementById('btnInstall').classList.add('hidden');
  } else showToast('사파리 아래쪽 공유 버튼 → "홈 화면에 추가"를 눌러 주세요');
};
addEventListener('appinstalled', () => document.getElementById('btnInstall').classList.add('hidden'));
</script>
