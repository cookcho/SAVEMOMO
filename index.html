<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6cc4ff">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAVE MOMO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAVE MOMO 프로토타입</title>
<script src="lib/matter.min.js"></script>
<script src="audio.js"></script>
<style>
  @font-face{font-family:'Jua';src:url(fonts/jua-sub.woff2) format('woff2');font-display:swap}
  :root{color-scheme:only light;
    --navy:#23304d;--navy2:#3b4a6b;
    --green:#4fd65e;--greenD:#25993a;--blue:#3ea8f2;--blueD:#1c6fb5;--yellow:#ffcf3a;--yellowD:#d18f00;
    --pink:#ff6f91;--pinkD:#c63f62;--purple:#a77af2;--purpleD:#6c44bd;--orange:#ff9a3c;--orangeD:#cc6410;--red:#ff5a5a;--redD:#c22f3a;
    --cream:#fff8ea;
  }
  html,body{margin:0;height:100%;background:#8fd2ff;color:var(--navy);font-family:'Jua',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(180deg,#6cc4ff 0%,#a9dfff 55%,#cdeeff 100%) fixed}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle,rgba(255,255,255,.35) 0 9px,rgba(255,255,255,.6) 10px,transparent 11px);
    background-size:90px 90px,140px 140px;background-position:10px 20px,60px 80px}
  button{font-family:inherit}
  #app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;box-sizing:border-box;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  /* ---------- 공통: 통통한 캐주얼 버튼 ---------- */
  .cbtn{--c:var(--blue);--d:var(--blueD);position:relative;border:3px solid var(--d);background:var(--c);color:#fff;border-radius:16px;font-size:17px;padding:10px 16px;cursor:pointer;
    box-shadow:0 5px 0 var(--d),inset 0 -5px 0 rgba(0,0,0,.10);text-shadow:0 2px 0 var(--d);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1}
  .cbtn::after{content:'';position:absolute;left:10%;top:5px;width:34%;height:22%;border-radius:20px;background:rgba(255,255,255,.45);pointer-events:none}
  .cbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d),inset 0 -5px 0 rgba(0,0,0,.10)}
  .cbtn svg{width:24px;height:24px;filter:drop-shadow(0 2px 0 var(--d))}
  .green{--c:var(--green);--d:var(--greenD)}.blue{--c:var(--blue);--d:var(--blueD)}.yellow{--c:var(--yellow);--d:var(--yellowD)}
  .pink{--c:var(--pink);--d:var(--pinkD)}.purple{--c:var(--purple);--d:var(--purpleD)}.orange{--c:var(--orange);--d:var(--orangeD)}.red{--c:var(--red);--d:var(--redD)}
  .white{--c:#fff;--d:#c9d6e6;color:var(--navy);text-shadow:none}
  .cbtn.sq{width:48px;height:48px;padding:0;border-radius:15px;flex:none}
  .cbtn.sq svg{width:28px;height:28px}
  .hidden{display:none!important}

  /* ---------- 게임 화면 상단 ---------- */
  header{padding:8px 10px 2px}
  .topbar{display:flex;align-items:center;gap:8px}
  .lvpill{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border:3px solid #c9d6e6;border-radius:18px;box-shadow:0 4px 0 #c9d6e6;height:44px;padding:0 4px}
  .lvpill .nav{border:0;background:#e8f2fc;color:var(--blueD);border-radius:11px;width:32px;height:32px;font-size:13px;cursor:pointer;padding:0;flex:none}
  .lvpill .nav:active{background:#d4e7fa}
  .lvMid{flex:1;min-width:0;text-align:center;cursor:pointer;line-height:1.05}
  #lvl{font-size:22px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #best{display:block;font-size:11px;color:#7a8aa6;white-space:nowrap}
  #best .gs{color:#f2a900}

  /* 잉크 막대: 별 3개 기준선이 보이는 연필 게이지 */
  #hud{position:relative;height:46px;margin-top:6px}
  .ink{position:absolute;inset:0;display:flex;align-items:flex-end}
  .inkIcon{position:relative;z-index:2;width:42px;height:42px;border-radius:50%;background:#ffe9a8;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 rgba(35,48,77,.25)}
  .inkIcon svg{width:28px;height:28px}
  .inkTrack{position:relative;flex:1;height:22px;margin:0 6px 10px -10px;background:#3c7a3e;border:3px solid var(--navy);border-left:0;border-radius:0 14px 14px 0;overflow:visible}
  .inkClip{position:absolute;inset:0;border-radius:0 11px 11px 0;overflow:hidden}
  .inkfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#b4f25a,#86d63a);transition:width .08s}
  .inkfill::after{content:'';position:absolute;left:0;right:0;top:3px;height:4px;background:rgba(255,255,255,.4);border-radius:2px}
  .mk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--navy);opacity:.75}
  #inkTxt{position:absolute;inset:0;font-size:12px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;text-shadow:0 1px 0 #1f4d22,0 0 3px #1f4d22;white-space:nowrap}
  .stb{position:absolute;bottom:20px;transform:translateX(-50%);width:26px;height:24px;border-radius:9px;background:#fff;border:2.5px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:15px;color:#f2b400;transition:transform .2s}
  .stb::after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--navy)}
  .stb.off{color:#c3cbd6;background:#eef1f5;transform:translateX(-50%) scale(.85)}
  /* 타이머: 시뮬레이션 동안 잉크 막대 자리에 표시 */
  #timer{position:absolute;inset:4px 0 0;display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;border-radius:22px;background:#fff;border:3px solid var(--green);box-shadow:0 4px 0 rgba(35,48,77,.18);pointer-events:none;transition:border-color .2s,background .2s}
  #timer.hidden{display:none}
  #tNum{display:flex;align-items:baseline;justify-content:center;width:56px;height:34px;border-radius:17px;background:var(--green);color:#fff;font-size:24px;line-height:34px;font-variant-numeric:tabular-nums;transform-origin:center;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  #tNum small{font-size:14px;opacity:.9}
  #tBar{flex:1;height:14px;border-radius:7px;background:#e3ebf3;overflow:hidden;border:2px solid #c9d6e6}
  #tFill{height:100%;width:100%;background:var(--green);border-radius:5px}
  #timer.warn{border-color:#f5b82e}#timer.warn #tFill,#timer.warn #tNum{background:#f5b82e}
  #timer.danger{border-color:#ff4d4d;background:#fff0f0}#timer.danger #tFill,#timer.danger #tNum{background:#ff4d4d}
  #timer.tick #tNum{animation:tick .45s ease-out}
  #timer.danger.tick{animation:shakeX .4s ease-out}
  #timer.danger.tick #tNum{animation:tickBig .45s ease-out}
  @keyframes tick{0%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes tickBig{0%{transform:scale(1.35)}100%{transform:scale(1)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  #chips{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;margin-top:6px;height:24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap;font-size:12px;background:rgba(255,255,255,.88);color:var(--navy);padding:3px 9px 2px;border-radius:12px;border:2px solid rgba(35,48,77,.12);line-height:15px}
  .chip.new{background:var(--yellow);border-color:var(--yellowD)}
  .chip.boss{background:var(--red);border-color:var(--redD);color:#fff}

  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 0 8px}
  canvas{touch-action:none;border-radius:18px;display:block;border:4px solid #fff;box-shadow:0 6px 0 rgba(35,48,77,.22),0 10px 24px rgba(35,48,77,.18)}
  #stage.danger::after{content:'';position:absolute;inset:6px 8px 8px;border-radius:18px;pointer-events:none;box-shadow:inset 0 0 0 4px rgba(255,60,60,.7);animation:dpulse .5s ease-in-out infinite alternate}
  @keyframes dpulse{from{opacity:.35}to{opacity:1}}
  #hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--navy);border:3px solid var(--navy);box-shadow:0 4px 0 rgba(35,48,77,.25);padding:8px 14px 7px;border-radius:16px;font-size:14px;text-align:center;pointer-events:none;max-width:86%;width:max-content;line-height:1.45;word-break:keep-all}
  #hint b{color:#e8590c}

  /* ---------- 결과 창 ---------- */
  .modalWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,32,60,.45);z-index:5}
  .modal{position:relative;background:var(--cream);color:var(--navy);border:4px solid var(--navy);border-radius:26px;padding:34px 18px 18px;width:272px;text-align:center;box-shadow:0 8px 0 rgba(35,48,77,.35);animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .mRibbon{position:absolute;left:50%;top:-22px;transform:translateX(-50%);min-width:170px;padding:9px 22px 7px;font-size:24px;color:#fff;background:var(--green);border:4px solid var(--navy);border-radius:16px;text-shadow:0 2px 0 rgba(0,0,0,.25);white-space:nowrap;box-shadow:0 4px 0 rgba(35,48,77,.3)}
  .mRibbon.fail{background:var(--pink)}
  .mImg{height:92px;margin-top:2px;animation:bob 2s ease-in-out infinite}
  .stars{display:flex;justify-content:center;gap:4px;margin:2px 0 6px;height:46px}
  .stars i{font-style:normal;font-size:44px;line-height:46px;color:#d5dbe4;-webkit-text-stroke:2px var(--navy);transform:scale(0);animation:starPop .45s cubic-bezier(.2,1.8,.4,1) forwards}
  .stars i:nth-child(2){font-size:52px;margin-top:-8px}
  .stars i.on{color:#ffcf3a}
  .stars i.drop{font-size:40px;-webkit-text-stroke:0}
  @keyframes starPop{to{transform:scale(1)}}
  #mReason{font-size:16px;color:var(--pinkD);margin:0 0 6px}
  .mStats{display:flex;gap:6px;justify-content:center}
  .mStats div{flex:1;background:#fff;border:2.5px solid #d9e2ee;border-radius:12px;padding:5px 0 4px}
  .mStats small{display:block;font-size:11px;color:#7a8aa6}
  .mStats b{font-weight:400;font-size:18px}
  #mBest{font-size:13px;color:#d17a00;min-height:16px;margin-top:6px}
  #mTip{font-size:13px;color:#8a4b12;background:#fff1d6;border:2px solid #f2d39b;border-radius:12px;padding:7px 8px;margin-top:6px;word-break:keep-all;line-height:1.4}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .btns .big{font-size:21px;padding:13px 0}
  .brow{display:flex;gap:8px}.brow .wide{flex:1;font-size:17px}
  #shareBox{width:100%;box-sizing:border-box;margin-top:8px;font-size:12px;border:2px solid #c9d6e6;border-radius:10px;padding:6px;resize:none;font-family:inherit}

  /* ---------- 레벨 선택 ---------- */
  #picker{position:fixed;inset:0;z-index:30;background:rgba(20,32,60,.55);display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .pk{width:min(500px,100%);flex:1;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#6cc4ff,#cdeeff);border-radius:0 0 24px 24px}
  .pkTop{display:flex;align-items:center;gap:8px;padding:14px 12px 10px}
  .pkTop h3{margin:0;font-size:24px;flex:1;font-weight:400;color:#fff;text-shadow:0 3px 0 var(--blueD),0 0 2px var(--blueD)}
  .pkTop input{width:70px;height:44px;box-sizing:border-box;padding:6px;border-radius:13px;border:3px solid #c9d6e6;font-size:18px;text-align:center;font-family:inherit;color:var(--navy)}
  .pkList{flex:1;overflow-y:auto;padding:4px 14px 24px}
  .pkCh{margin:14px 0 8px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:6px}
  .pkCh span{background:#fff;border:2.5px solid #c9d6e6;border-radius:12px;padding:4px 12px 2px}
  .pkGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pkGrid button{position:relative;border:3px solid var(--blueD);border-radius:15px;padding:9px 0 5px;background:var(--blue);color:#fff;font-size:21px;cursor:pointer;line-height:1;box-shadow:0 4px 0 var(--blueD);text-shadow:0 2px 0 var(--blueD)}
  .pkGrid button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blueD)}
  .pkGrid button small{display:block;font-size:11px;color:#ffe066;min-height:13px;margin-top:3px;letter-spacing:-1px;text-shadow:0 1px 0 var(--blueD)}
  .pkGrid button.cur{--c:var(--green);background:var(--green);border-color:var(--greenD);box-shadow:0 4px 0 var(--greenD);text-shadow:0 2px 0 var(--greenD)}
  .pkGrid button.boss{background:var(--orange);border-color:var(--orangeD);box-shadow:0 4px 0 var(--orangeD);text-shadow:0 2px 0 var(--orangeD)}
  .lvpill .nav.dim{opacity:.35}
  .pkGrid button.lock{background:#b9c6d6;border-color:#8d9cb1;box-shadow:0 4px 0 #8d9cb1;text-shadow:none;color:#eef3f9}

  /* ---------- 이야기 카드 ---------- */
  #story{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(20,32,60,.6)}
  .scard{width:min(340px,88vw);background:var(--cream);color:var(--navy);border:4px solid var(--navy);border-radius:26px;padding:20px 18px 18px;text-align:center;box-shadow:0 8px 0 rgba(35,48,77,.35);animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
  .sart{height:170px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
  .sart img.big{height:150px}
  .sart .row{font-size:46px;display:flex;gap:10px;align-items:center}
  .sart .row span,.sart .row img{animation:bob 1.2s ease-in-out infinite}
  .sart .row img{height:58px}
  .sart .row svg{width:58px;height:58px}
  .sart .row :nth-child(2){animation-delay:.2s}.sart .row :nth-child(3){animation-delay:.4s}.sart .row :nth-child(4){animation-delay:.6s}
  .sart .zz{position:absolute;top:18px;right:62px;color:#5a7bd8;font-size:24px;animation:bob 1.6s ease-in-out infinite}
  .sart .pen{font-size:54px;animation:draw 1.6s ease-in-out infinite}
  .bob{animation:bob 2s ease-in-out infinite}.shake{animation:shake .5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  @keyframes draw{0%{transform:translate(-20px,10px) rotate(-10deg)}50%{transform:translate(20px,-6px) rotate(10deg)}100%{transform:translate(-20px,10px) rotate(-10deg)}}
  .stext{font-size:17px;line-height:1.6;margin:10px 0 12px;word-break:keep-all;min-height:76px}
  .stext b{font-weight:400;color:#e8590c}
  .sdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .sdots i{width:9px;height:9px;border-radius:5px;background:#e2d5c3}.sdots i.on{background:var(--orange);width:22px}
  .sbtns{display:flex;gap:8px}.sbtns button{flex:1}

  /* ---------- 시작 화면 ---------- */
  #title{position:fixed;inset:0;z-index:20;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 26px);box-sizing:border-box;
    background:linear-gradient(180deg,#5bbcff 0%,#9fdcff 52%,#d7f1ff 78%,#bfe3f6 100%)}
  #title.bgimg{background-size:cover;background-position:center bottom}
  #title.bgimg .tCloud{display:none}
  .tSky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .tCloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.85;animation:cloudMove linear infinite}
  .tCloud::before,.tCloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
  .tCloud::before{width:56px;height:56px;left:16px;top:-26px}.tCloud::after{width:44px;height:44px;left:58px;top:-18px}
  @keyframes cloudMove{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
  .bub{position:absolute;bottom:-60px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.18) 30%,rgba(160,215,255,.25) 70%,rgba(255,255,255,.7) 100%);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8);animation:bubUp var(--d) linear var(--dl) infinite}
  @keyframes bubUp{0%{transform:translate(0,0)}25%{transform:translate(12px,-28vh)}50%{transform:translate(-8px,-56vh)}75%{transform:translate(10px,-84vh)}100%{transform:translate(0,-115vh)}}
  .tTop{position:relative;width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:3px solid #fff;box-shadow:0 4px 0 rgba(35,48,77,.18);border-radius:22px;padding:5px 14px 4px 6px;font-size:18px;color:var(--navy)}
  .pill .pi{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:var(--yellow);border:2.5px solid var(--yellowD)}
  .pill .pi.cat{background:var(--orange);border-color:var(--orangeD)}
  .tLogoWrap{position:relative;margin-top:2vh;text-align:center;animation:logoIn .8s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes logoIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}
  #tLogoImg{width:min(350px,88vw);display:block;margin:0 auto;animation:logoBob 3s ease-in-out infinite}
  .tLogo{display:flex;flex-direction:column;align-items:center;line-height:.86;animation:logoBob 3s ease-in-out infinite}
  @keyframes logoBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
  .tLogo span{display:block;font-size:min(19vw,82px);letter-spacing:2px;color:#fff;
    -webkit-text-stroke:3px var(--navy);paint-order:stroke fill;
    text-shadow:0 6px 0 var(--navy),0 9px 10px rgba(35,48,77,.3)}
  .tLogo .l1{color:#fff;font-size:min(13vw,56px);transform:rotate(-4deg);margin-bottom:4px}
  .tLogo .l1 em{font-style:normal;color:#7fd3ff}
  .tLogo .l2{color:#ffc12e;-webkit-text-stroke:4px var(--navy);text-shadow:0 7px 0 var(--navy),0 10px 12px rgba(35,48,77,.3)}
  .tLogo .l2 i{font-style:normal;display:inline-block;animation:letterHop 2.4s ease-in-out infinite}
  .tLogo .l2 i:nth-child(2){animation-delay:.12s;color:#ff8fb1}.tLogo .l2 i:nth-child(3){animation-delay:.24s}.tLogo .l2 i:nth-child(4){animation-delay:.36s;color:#7fd3ff}
  @keyframes letterHop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(2px)}}
  .tRibbon{display:inline-block;margin-top:10px;padding:6px 18px 5px;font-size:16px;color:#fff;background:var(--pink);border:3px solid var(--navy);border-radius:14px;transform:rotate(-2deg);box-shadow:0 4px 0 rgba(35,48,77,.3);text-shadow:0 2px 0 var(--pinkD)}

  /* 시작 화면 주인공 장면: 선으로 만든 방패 안의 모모, 밖에서 공격하는 드론·물방울·강아지 */
  .tHero{position:relative;width:min(330px,86vw);height:min(250px,31vh);margin-top:1vh;flex:none}
  .hFloor{position:absolute;left:4%;right:4%;bottom:0;height:22px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(35,48,77,.28),rgba(35,48,77,0) 70%)}
  .hInk{position:absolute;left:50%;bottom:2%;width:66%;height:92%;transform:translateX(-50%);overflow:visible}

}

// ---------- 파낸 지형: 땅 덩어리를 깔고 굴·통로를 파냄 ----------
// ops: [{op:'add'|'cut', t:'rect'|'ellipse', ...}] 순서대로 적용. 물리는 8px 타일로 근사, 그림은 실제 도형으로
const TILE = 8;
function inShape(x, y, o){
  if (o.t === 'rect') return x >= o.x0 && x <= o.x1 && y >= o.y0 && y <= o.y1;
  const dx = (x - o.cx) / o.rx, dy = (y - o.cy) / o.ry; return dx * dx + dy * dy <= 1;
}
function solidAt(ops, x, y){ let v = false; for (const o of ops){ if (inShape(x, y, o)) v = o.op === 'add'; } return v; }
function carveToRects(ops){
  const X0 = -3 * TILE; // 화면 밖까지 땅을 만들어 드론이 바깥으로 돌아 들어오지 못하게
  const cols = Math.ceil((W - 2 * X0) / TILE), rows = Math.ceil(H / TILE), sol = new Uint8Array(cols * rows), used = new Uint8Array(cols * rows);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) sol[r * cols + c] = solidAt(ops, X0 + c * TILE + TILE / 2, r * TILE + TILE / 2) ? 1 : 0;
  const out = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    if (!sol[r * cols + c] || used[r * cols + c]) continue;
    let w = 1; while (c + w < cols && sol[r * cols + c + w] && !used[r * cols + c + w]) w++;
    let h = 1;
    outer: while (r + h < rows){ for (let k = 0; k < w; k++){ const i = (r + h) * cols + c + k; if (!sol[i] || used[i]) break outer; } h++; }
    for (let a = 0; a < h; a++) for (let k = 0; k < w; k++) used[(r + a) * cols + c + k] = 1;
    out.push({ x: X0 + (c + w / 2) * TILE, y: (r + h / 2) * TILE, w: w * TILE, h: h * TILE, a: 0, kind: 'tile' });
  }
  return out;
}
function buildCarve(arch, R, r){
  const snap = v => Math.round(v / TILE) * TILE;
  const ops = [], info = { arch };
  if (arch === 'pocket'){
    // 지표 아래 타원형 방 + 지표로 이어진 통로
    const ys = snap(R(300, 390)), cx = R(110, 250), rx = R(78, 108), ry = R(52, 68), cy = ys + R(125, 170);
    const floorY = snap(cy + ry * 0.55), sw = R(50, 78), sx = clamp(cx + R(-rx * 0.35, rx * 0.35), sw / 2 + 20, W - sw / 2 - 20);
    ops.push({ op: 'add', t: 'rect', x0: -40, y0: ys, x1: W + 40, y1: H + 10 });
    ops.push({ op: 'cut', t: 'ellipse', cx, cy, rx, ry });
    ops.push({ op: 'cut', t: 'rect', x0: sx - sw / 2, y0: ys - 10, x1: sx + sw / 2, y1: cy });
    ops.push({ op: 'add', t: 'rect', x0: -40, y0: floorY, x1: W + 40, y1: H + 10 });
    Object.assign(info, { ys, shaftX: sx, shaftW: sw, floorY, px: clamp(cx + R(-20, 20), cx - rx * 0.5, cx + rx * 0.5) });
  } else if (arch === 'well'){
    // 깊고 좁은 수직 우물, 바닥은 조금 넓음
    const ys = snap(R(250, 340)), sw = R(70, 92), sx = R(sw / 2 + 50, W - sw / 2 - 50), floorY = snap(ys + R(170, 240));
    ops.push({ op: 'add', t: 'rect', x0: -40, y0: ys, x1: W + 40, y1: H + 10 });
    ops.push({ op: 'cut', t: 'rect', x0: sx - sw / 2, y0: ys - 10, x1: sx + sw / 2, y1: floorY });
    ops.push({ op: 'cut', t: 'rect', x0: sx - sw / 2 - R(15, 30), y0: floorY - 90, x1: sx + sw / 2 + R(15, 30), y1: floorY });
    Object.assign(info, { ys, shaftX: sx, shaftW: sw, floorY, px: sx });
  } else {
    // alcove: 높은 절벽 속 옆굴 + 바로 옆 깊은 구덩이(드론 기지가 구덩이 안에 있음)
    const left = r() < 0.5, ys = snap(R(220, 300)), ay = snap(R(420, 500)), aw = R(95, 125), pw = R(72, 95), pitBot = snap(ay + R(60, 120));
    const ax0 = left ? 0 : W - aw, ax1 = left ? aw : W;
    const px0 = left ? aw : W - aw - pw, px1 = left ? aw + pw : W - aw;
    ops.push({ op: 'add', t: 'rect', x0: -40, y0: ys, x1: W + 40, y1: H + 10 });
    ops.push({ op: 'cut', t: 'rect', x0: Math.max(0, ax0 - 10), y0: ay - 92, x1: Math.min(W, ax1 + (left ? 10 : 0)), y1: ay });
    ops.push({ op: 'cut', t: 'rect', x0: px0, y0: ys - 10, x1: px1, y1: pitBot });
    Object.assign(info, { ys, floorY: ay, left, mouthX: left ? aw : W - aw, mouthTop: ay - 92, pit: { x: (px0 + px1) / 2, y: pitBot - 26 }, px: left ? R(45, aw - 35) : W - R(45, aw - 35) });
  }
  return { ops, info };
}

const RAD = { drone: 8, tank: 14, pup: 12, bigdog: 24, balloon: [13, 17], rain: 4.5, jet: 4.2 };

// ---------- 난이도 모델 ----------
// 난이도 지수 D 하나로 모든 변수를 함께 움직임.
//  · 큰 흐름: 레벨이 오를수록 증가(60레벨까지 빠르게, 이후 완만하게 계속)
//  · 챕터 안 흐름: 10레벨 단위로 오르내림, 10번째는 보스(급상승), 다음 챕터 첫 판은 숨 고르기
const CH_SHAPE = [-0.06, -0.03, 0, 0.02, 0.04, -0.02, 0.05, 0.07, 0.09, 0.16];
function diffOf(lv){
  const base = 0.12 + 0.88 * (1 - Math.exp(-lv / 30)) + 0.004 * Math.max(0, lv - 60);
  return Math.max(0.05, base + CH_SHAPE[(lv - 1) % 10]);
}
const isBoss = lv => lv % 10 === 0;
// 지형 난이도 단계(쉬움 → 매우 어려움). D가 오를수록 어려운 단계가 자주 나옴
const ARCH_TIER = { plat: 0, ground: 0, pocket: 0, cliff: 1, shelf: 1, valley: 1, well: 1, cave: 1, stairs: 2, pillar: 2, bowl: 2, alcove: 2, hang: 3, seesaw: 3 };

// ---------- 절차적 맵 생성기 ----------
function genLevel(lv, seed, themeIdx){
  const r = rng(seed), R = (a, b) => a + r() * (b - a), pick = a => a[Math.floor(r() * a.length)];
  const has = k => MECH.find(m => m.k === k).lv <= lv;
  const intro = MECH.find(m => m.lv === lv) || null;
  const L = { lv, seed, theme: themeIdx, intro, S: [], D: [], pins: [], hives: [], clouds: [], chutes: [], winds: [], crawl: [], groundCat: false, cave: null };
  const S = L.S;

  // 1) 모모가 앉는 지형: 레벨에 따라 하나씩 해금(8레벨부터는 새 지형을 소개)
  const archIntro = ARCH_UNLOCK.find(([, l]) => l === lv && l > 1);
  const unlocked = ARCH_UNLOCK.filter(([, l]) => l <= lv).map(([a]) => a);
  const carvedOk = unlocked.filter(a => CARVED.includes(a)), otherOk = unlocked.filter(a => !CARVED.includes(a));
  const D = diffOf(lv);
  L.diff = D; L.boss = isBoss(lv) && lv >= 10;
  // 단계 t의 가중치: D×3.2 근처 단계가 가장 자주. 보스는 해금된 가장 어려운 단계 쪽으로
  const target = Math.min(L.boss ? 3.0 : 2.4, 3.2 * D + (L.boss ? 0.6 : 0)); // 후반에도 여러 단계가 섞이게 상한
  const wPick = list => { const ws = list.map(a => Math.exp(-((ARCH_TIER[a] - target) ** 2) / 1.2) * (CARVED.includes(a) ? 1.3 : 1)); let t = r() * ws.reduce((x, y) => x + y, 0); for (let i = 0; i < list.length; i++){ t -= ws[i]; if (t <= 0) return list[i]; } return list[list.length - 1]; };
  let arch = lv === 1 ? 'plat' : archIntro ? archIntro[0] : wPick(unlocked);
  if (intro && (intro.k === 'crawl' || intro.k === 'bigdog')) arch = 'ground';
  L.archIntro = archIntro ? arch : null;
  let px, top, hw;
  if (arch === 'plat'){
    px = R(70, 290); top = R(400, 540); const pw = R(80, 120); hw = pw / 2;
    S.push({ x: px, y: top + 8, w: pw, h: 16, a: 0, kind: 'plat' });
  } else if (arch === 'ground'){
    px = R(60, 300); top = GY; hw = 999; L.groundCat = true;
    // 언덕: 모모 자리는 피해서 0~2개
    const nh = Math.floor(R(0, 2.7));
    for (let i = 0; i < nh; i++) for (let t = 0; t < 30; t++){
      const hr = R(50, 90), hx = R(20, W - 20);
      if (Math.abs(hx - px) < hr * 0.85 + 40 || S.some(o => o.kind === 'hill' && Math.abs(o.x - hx) < o.r + hr)) continue;
      S.push({ shape: 'circle', x: hx, y: GY + hr * 0.55, r: hr, kind: 'hill' }); break;
    }
  } else if (arch === 'shelf'){
    const left = r() < 0.5, sw = R(110, 165); top = R(380, 540);
    S.push({ x: left ? sw / 2 : W - sw / 2, y: top + 8, w: sw, h: 16, a: 0, kind: 'shelf', left });
    px = left ? sw - R(32, 50) : W - sw + R(32, 50); hw = 30;
  } else if (arch === 'pillar'){
    px = R(70, 290); const pwid = R(56, 70); top = R(380, 510); hw = pwid / 2;
    S.push({ x: px, y: (top + GY) / 2 + 2, w: pwid, h: GY - top + 4, a: 0, kind: 'pillar' });
  } else if (arch === 'valley'){
    const gap = R(110, 150); px = R(gap / 2 + 26, W - gap / 2 - 26); top = GY; hw = gap / 2;
    const h1 = R(70, 140), h2 = R(70, 140);
    S.push({ x: px - gap / 2 - 8, y: GY - h1 / 2 + 2, w: 16, h: h1 + 4, a: 0, kind: 'wall' });
    S.push({ x: px + gap / 2 + 8, y: GY - h2 / 2 + 2, w: 16, h: h2 + 4, a: 0, kind: 'wall' });
  } else if (arch === 'cliff'){
    // 한쪽이 높은 절벽: 모모는 절벽 끝 위 또는 절벽 아래
    const left = r() < 0.5, cw = R(120, 190), ch = R(110, 210), edge = left ? cw : W - cw;
    S.push({ x: left ? cw / 2 : W - cw / 2, y: GY - ch / 2 + 2, w: cw, h: ch + 4, a: 0, kind: 'cliff' });
    if (r() < 0.55){ top = GY - ch; px = left ? edge - R(30, 50) : edge + R(30, 50); hw = 30; }
    else { top = GY; px = left ? edge + R(38, 75) : edge - R(38, 75); hw = 999; L.groundCat = true; }
  } else if (arch === 'cave'){
    // 벽에 붙은 동굴: 입구가 한쪽뿐
    const left = r() < 0.5, depth = R(100, 140), ft = R(400, 530), open = R(90, 110);
    const fw = depth + R(15, 40), cw2 = depth + R(-10, 25);
    S.push({ x: left ? fw / 2 : W - fw / 2, y: ft + 10, w: fw, h: 20, a: 0, kind: 'cave' });
    S.push({ x: left ? cw2 / 2 : W - cw2 / 2, y: ft - open - 10, w: cw2, h: 20, a: 0, kind: 'cave' });
    top = ft; px = left ? R(40, depth - 30) : W - R(40, depth - 30); hw = 30;
    L.cave = { left, mouth: left ? Math.max(fw, cw2) : W - Math.max(fw, cw2), ceilY: ft - open, floorY: ft };
  } else if (arch === 'bowl'){
    // V자 그릇: 짧은 바닥 + 양쪽으로 기운 판자
    px = R(100, 260); const by = R(440, 550); top = by - 7; hw = 25;
    S.push({ x: px, y: by, w: 56, h: 14, a: 0, kind: 'plank' });
    const ang = R(0.55, 0.95), len = R(85, 120);
    for (const sd of [-1, 1]){
      const dx = sd * Math.cos(ang), dy = -Math.sin(ang), sx = px + sd * 26, sy = by - 2;
      S.push({ x: sx + dx * len / 2, y: sy + dy * len / 2, w: len, h: 12, a: Math.atan2(dy, dx), kind: 'plank' });
    }
  } else if (arch === 'seesaw'){
    // 시소: 기둥 위 축에 고정된 판자. 선의 무게로 기울어짐
    px = R(110, 250); const py0 = R(440, 540); top = py0 - 6; hw = 40;
    S.push({ x: px, y: (py0 + 8 + GY) / 2 + 2, w: 14, h: GY - py0 - 8 + 4, a: 0, kind: 'post' });
    L.D.push({ type: 'seesaw', x: px, y: py0, w: R(150, 200), h: 12 });
  } else if (arch === 'hang'){
    // 사슬 두 줄에 매달린 발판: 부딪히면 흔들림
    px = R(90, 270); const pw = R(95, 130), py0 = R(390, 500); top = py0 - 7; hw = pw / 2;
    L.D.push({ type: 'hang', x: px, y: py0, w: pw, h: 14, ay: Math.max(26, py0 - R(150, 260)) });
  } else if (CARVED.includes(arch)){
    const cv2 = buildCarve(arch, R, r);
    L.carve = cv2.ops; L.carveInfo = cv2.info;
    carveToRects(cv2.ops).forEach(o => S.push(o));
    px = cv2.info.px; top = cv2.info.floorY; hw = 30;
  } else { // stairs: 벽 쪽이 가장 높은 계단
    const left = r() < 0.5, n = 3 + Math.floor(R(0, 2)), sw = R(60, 74), sh = R(38, 56);
    for (let i = 0; i < n; i++){
      const hgt = (n - i) * sh, x = left ? sw * i + sw / 2 : W - sw * i - sw / 2;
      S.push({ x, y: GY - hgt / 2 + 2, w: sw + 1, h: hgt + 4, a: 0, kind: 'stair' });
    }
    const i = Math.floor(R(0, n));
    px = left ? sw * i + sw / 2 : W - sw * i - sw / 2; top = GY - (n - i) * sh; hw = sw / 2;
  }
  L.arch = arch;
  L.pot = { x: px, y: top - 18 };
  const sp = { x: px, y: top - 60 };
  L.sp = sp;

  // 바닥(구덩이 가능)
  let ground = [{ x: 0, w: W }];
  if (lv >= 5 && ['plat', 'shelf', 'hang', 'bowl'].includes(arch) && r() < 0.5){
    const gw = R(60, 90); let gx, t = 0;
    do { gx = R(30, W - gw - 30); t++; } while (Math.abs(gx + gw / 2 - px) < hw + 60 && t < 40);
    ground = [{ x: 0, w: gx }, { x: gx + gw, w: W - gx - gw }];
  }
  if (L.carve) ground = [];
  L.ground = ground;
  ground.forEach(g => S.unshift({ x: g.x + g.w / 2, y: H - 20, w: g.w, h: 40, a: 0, kind: 'ground' }));

  // 2) 위협 고르기: 새로 등장한 요소는 반드시 포함
  const pool = ['bee', 'rain', 'rock', 'wind', 'wasp', 'crawl', 'tank', 'bigdog'].filter(k => has(k) && ((k !== 'crawl' && k !== 'bigdog') || L.groundCat) && !(k === 'rain' && arch === 'cave') && !(k === 'wasp' && L.carve));
  // 위협 종류 수: 소개 레벨은 1종, 이후 레벨대에 따라 2~3종
  const kinds = [];
  if (intro && pool.includes(intro.k)) kinds.push(intro.k);
  const nT = (intro || archIntro || lv < 6) ? 1 : D < 0.45 ? (r() < 0.6 ? 1 : 2) : D < 0.65 ? 2 : D < 0.82 ? (r() < 0.5 ? 2 : 3) : D < 0.95 ? 3 : (r() < 0.5 ? 3 : 4);
  const pickPool = archIntro ? pool.filter(k => k !== 'wind') : pool;
  for (let g = 0; kinds.length < Math.min(nT, pool.length) && g < 60; g++){ const k = pick(pickPool); if (!kinds.includes(k)) kinds.push(k); }
  if (arch === 'alcove' && !kinds.includes('bee') && !kinds.includes('tank')){ const i = kinds.findIndex(k => k !== intro?.k); if (i >= 0 && kinds.length >= nT) kinds[i] = 'bee'; else kinds.push('bee'); }
  // 모모가 땅에 있으면 개가 자주 나옴(소개 레벨 제외)
  if (!intro && !archIntro && L.groundCat && lv >= 8 && !kinds.some(k => k === 'crawl' || k === 'bigdog') && r() < 0.6){
    const dog = has('bigdog') && r() < 0.5 ? 'bigdog' : 'crawl';
    if (kinds.length >= nT) kinds[kinds.length - 1] = dog; else kinds.push(dog);
  }
  if (kinds.includes('wind') && kinds.filter(k => k !== 'wind').every(k => k === 'rain') && pool.includes('bee') && !kinds.includes('bee')) kinds.push('bee');
  if (!kinds.some(k => k !== 'wind')) kinds.push(pool.includes('bee') ? 'bee' : pick(pool.filter(k => k !== 'wind')));
  L.kinds = kinds;
  // 난이도 예산: 레벨에 비례해 완만히 증가. 새 요소 소개 레벨은 20% 낮춤. 어려운 지형일수록 위협 예산 감소
  // 퍼즐 규칙(31레벨~): 소개 레벨은 하나, 40레벨부터 무작위 0~1개, 50레벨부터 1~2개
  const modIntro = MODS.find(m => m.lv === lv) || null;
  let mods = [];
  if (modIntro) mods = [modIntro.k];
  else if (lv >= 38 || (L.boss && lv >= 31)){
    let nm = D > 0.92 ? (r() < 0.5 ? 2 : 1) : (r() < 0.6 ? 1 : 0);
    if (L.boss) nm = Math.max(1, nm);
    const avail = MODS.map(m => m.k);
    while (mods.length < nm){ const k = pick(avail); if (!mods.includes(k)) mods.push(k); }
  }
  // 흔들리는 지형(시소·매달린 발판)에 무거운 잉크는 너무 가혹 → 제외
  if ((arch === 'hang' || arch === 'seesaw') && mods.includes('heavy') && !modIntro) mods = mods.filter(k => k !== 'heavy');
  L.mods = mods; L.modIntro = modIntro;
  const capS = Math.min(2.4, 1 + Math.max(0, D - 0.68) * 2.6); // D가 높아지면 위협 상한(드론 수 등)도 커짐
  L.capS = capS;
  // 30레벨까지 레벨당 +3, 이후 +1.5 (상한이 커지는 속도와 맞춤)
  let B = 8 + 100 * Math.pow(D, 1.15); // 위협 예산
  if (L.boss) B *= 1.1;
  if ((intro || archIntro || modIntro) && lv > 1) B *= 0.85;
  B *= 1 - 0.08 * mods.length;
  B /= ARCH_W[arch];
  if (kinds.includes('wind')) B *= 0.8;
  const u = B / kinds.filter(k => k !== 'wind').length;
  L.budget = Math.round(B * 10) / 10;
  const used = [];
  const dynRects = L.D.map(d => ({ x: d.x, y: d.y, w: d.w, h: d.h + 30, a: 0 }));
  const chainRects = L.D.filter(d => d.type === 'hang').map(d => ({ x: d.x, y: (d.ay + d.y) / 2, w: d.w + 10, h: d.y - d.ay, a: 0 }));
  const free = (p, pad) => p.x > 15 && p.x < W - 15 && p.y > 15 && !S.some(o => inRect(p, o, pad)) && !dynRects.some(o => inRect(p, o, pad)) && !chainRects.some(o => inRect(p, o, pad));
  const place = (minD, y0, y1, gap = 80) => {
    for (let t = 0; t < 120; t++){
      const p = { x: R(42, W - 42), y: R(y0, y1) };
      if (dist(p, sp) < minD || !free(p, 24) || used.some(q => dist(q, p) < gap)) continue;
      used.push(p); return p;
    }
    return null;
  };

  if (kinds.includes('crawl') || kinds.includes('bigdog')){
    const n = kinds.includes('crawl') ? clamp(Math.round(u / 2.5), 3, Math.round(8 * capS)) : 0;
    const nb = kinds.includes('bigdog') ? clamp(Math.round(u / 9), 1, Math.round(2 * capS)) : 0;
    // 개는 땅 위로 모모까지 막힘없이 달려올 수 있는 쪽에서만 나옴
    const clearSide = sd => { const x0 = sd < 0 ? 10 : W - 10; for (let x = x0; Math.abs(x - px) > 30; x += (px - x0) > 0 ? 6 : -6){ if (S.some(o => o.kind !== 'ground' && o.kind !== 'hill' && inRect({ x, y: GY - 12 }, o, 4))) return false; } return true; };
    let sides = (r() < 0.5 ? [-1, 1] : [px < W / 2 ? 1 : -1]).filter(clearSide);
    if (!sides.length) sides = [-1, 1].filter(clearSide);
    if (sides.length){
      for (let i = 0; i < n; i++) L.crawl.push({ side: sides[i % sides.length], t: 200 + i * 600 + R(0, 250), big: false });
      for (let i = 0; i < nb; i++) L.crawl.push({ side: sides[(i + 1) % sides.length], t: 400 + i * 1400 + R(0, 300), big: true });
    } else {
      ['crawl', 'bigdog'].forEach(k => { const i = kinds.indexOf(k); if (i >= 0) kinds.splice(i, 1); });
      if (!kinds.includes('bee')) kinds.push('bee');
    }
  }
  if (kinds.includes('rain')){
    const n = 1;
    for (let i = 0; i < n; i++){
      const w = R(90, 140);
      let cx = R(w / 2 + 10, W - w / 2 - 10);
      if (i === 0) cx = clamp(px + R(-w / 2 + 25, w / 2 - 25), w / 2 + 10, W - w / 2 - 10);
      L.clouds.push({ x: cx, w, rate: clamp(900 / u, 60, 150) });
    }
  }
  if (kinds.includes('wind')){
    const y0 = clamp(R(sp.y - 210, sp.y - 70), 90, 460), h = R(110, 170);
    L.winds.push({ y0, y1: Math.min(y0 + h, sp.y + 30), dir: r() < 0.5 ? -1 : 1, str: 0.6 + Math.min(0.5, lv * 0.015) });
  }
  if (L.winds.length) L.clouds.forEach(c => { c.w = Math.min(190, c.w + 40); c.x = clamp(c.x - L.winds[0].dir * 45, c.w / 2 + 10, W - c.w / 2 - 10); });
  const yMin = L.clouds.length ? 125 : 55, yMax = Math.min(sp.y - 30, 400);
  if (kinds.includes('bee')){
    const total = clamp(Math.round(u / 2), 4, Math.round(16 * capS)), nh = total > 18 ? 3 : total > 9 ? 2 : 1;
    for (let i = 0; i < nh; i++){
      const pit = arch === 'alcove' && i === 0 ? L.carveInfo.pit : null;
      const p = pit || place(170, yMin, yMax) || { x: px < W / 2 ? W - 40 : 40, y: yMin + 30 };
      if (pit) used.push(pit);
      L.hives.push({ ...p, n: Math.round(total / nh), kind: 'bee' });
    }
  }
  if (kinds.includes('tank')){
    // 헤비 드론: 수는 적지만 무거워서 선을 밀어냄
    const p = place(170, yMin, yMax) || { x: px < W / 2 ? W - 45 : 45, y: yMin + 40 };
    L.hives.push({ ...p, n: clamp(Math.round(u / 7), 1, Math.round(3 * capS)), kind: 'tank' });
  }
  // 두 점 사이에 지형이 없는지(오리의 사격 시야)
  const los = (a, b2) => {
    const n = Math.ceil(dist(a, b2) / 5);
    for (let i = 1; i < n; i++){
      const q = { x: a.x + (b2.x - a.x) * i / n, y: a.y + (b2.y - a.y) * i / n };
      if (dist(q, sp) < 34) break;
      if (S.some(o => inRect(q, o, 6)) || dynRects.some(o => inRect(q, o, 2))) return false;
    }
    return true;
  };
  if (kinds.includes('wasp')){
    // 예산이 크면 오리 두 마리가 서로 다른 각도에서 쏨(벽 하나로 다 막히지 않게)
    const nd = u > 70 ? 3 : u > 30 ? 2 : 1, ud = u / nd;
    for (let k = 0; k < nd; k++){
      let p = null;
      for (let t = 0; t < 40 && !p; t++){
        const c = place(190, yMin, Math.min(sp.y + 40, 470));
        const prev = L.hives.find(h => h.kind === 'wasp');
        const angOk = !prev || !c || Math.abs(Math.atan2(c.y - sp.y, c.x - sp.x) - Math.atan2(prev.y - sp.y, prev.x - sp.x)) > 0.9;
        if (c && los(c, sp) && angOk) p = c; else if (c) used.pop();
      }
      if (!p && k > 0) break;
      p = p || place(190, yMin, yMax) || { x: px < W / 2 ? W - 40 : 40, y: yMin + 60 };
      L.hives.push({ ...p, n: 0, burst: clamp(Math.round(3 + ud / 3), 5, Math.round(10 * Math.min(capS, 1.5))), gap: clamp(13000 / ud, 650 / capS, 1600), kind: 'wasp' });
    }
  }
  if (kinds.includes('rock')){
    const n = u > 45 ? 2 : 1;
    for (let i = 0; i < n; i++){
      const rr = R(RAD.balloon[0], RAD.balloon[1]), interval = clamp(10000 * n / u, 480 / capS, 1500);
      if (r() < 0.5 && !L.cave && !(intro && intro.k === 'rock')){
        L.chutes.push({ type: 'top', x: clamp(px + R(-30, 30), 24, W - 24), y: -12, vx: 0, vy: 1, r: rr, interval, first: R(350, 750) });
      } else {
        const fromLeft = L.cave ? !L.cave.left : r() < 0.5;
        let y = L.carve ? R(110, L.carveInfo.ys - 40) : R(Math.max(120, sp.y - 230), sp.y - 50);
        for (let t = 0; t < 20 && !free({ x: fromLeft ? 20 : W - 20, y }, 20); t++) y = L.carve ? R(110, L.carveInfo.ys - 40) : R(120, sp.y - 40);
        const vx = (fromLeft ? 1 : -1) * R(3.2, 4.2), x0 = fromLeft ? -40 : W + 40;
        const t = Math.abs(sp.x - x0) / Math.abs(vx), gstep = 0.278;
        const vy = clamp((sp.y - 6 - y - 0.5 * gstep * t * t) / t, -8, 2);
        L.chutes.push({ type: 'side', x: x0, y, vx, vy, r: rr, interval, first: R(350, 750) });
      }
    }
  }

  // 3) 고정 핀 (도우미 요소)
  if (L.carve && has('pin')){
    const ci = L.carveInfo;
    const cps = ci.arch === 'alcove'
      ? [{ x: ci.mouthX + (ci.left ? 10 : -10), y: ci.mouthTop + 8 }, { x: ci.mouthX + (ci.left ? 10 : -10), y: ci.floorY - 8 }] // 두 핀을 이으면 틈 없는 문
      : [{ x: ci.shaftX + (r() < 0.5 ? -1 : 1) * (ci.shaftW / 2 + 14), y: ci.ys - 16 }];
    for (const cp of cps) if (free(cp, ci.arch === 'alcove' ? 6 : 10)){ used.push(cp); L.pins.push(cp); }
  }
  if (L.cave && has('pin')){
    const cp = { x: L.cave.mouth + (L.cave.left ? 16 : -16), y: L.cave.ceilY + 18 };
    if (free(cp, 12)){ used.push(cp); L.pins.push(cp); }
  }
  // 31레벨부터는 어려운 대신 핀(풀이 도구)을 꼭 줌
  if (has('pin') && ((intro && intro.k === 'pin') || lv >= 31 || r() < 0.75 - 0.35 * D)){
    const n = lv >= 45 ? 2 : 1 + (r() < 0.35 ? 1 : 0);
    for (let i = 0; i < n; i++){
      for (let t = 0; t < 80; t++){
        const ang = R(-Math.PI + 0.25, -0.25), d = R(70, 130);
        const p = { x: sp.x + Math.cos(ang) * d, y: sp.y + Math.sin(ang) * d };
        if (!free(p, 12) || used.some(q => dist(q, p) < 45)) continue;
        used.push(p); L.pins.push(p); break;
      }
    }
  }

  // 4) 장애물 판자 (걸치거나 받칠 수 있는 지형)
  let no = L.carve ? 1 : Math.min(3, Math.floor(lv / 2)) - (arch === 'valley' || arch === 'pillar' ? 1 : 0);
  for (let i = 0; i < no; i++){
    for (let t = 0; t < 60; t++){
      const kr = r(), x = R(40, W - 40), y = R(140, GY - 70);
      const o = kr < 0.55 ? { x, y, w: R(50, 110), h: 14, a: R(-0.6, 0.6), kind: 'obs' }
              : kr < 0.8 ? (() => { const sz = R(28, 44); return { x, y, w: sz, h: sz, a: R(-0.4, 0.4), kind: 'box' }; })()
              : { shape: 'circle', x, y, r: R(14, 24), kind: 'boulder' };
      if (o.shape === 'circle'){ o.w = o.r * 2; }
      if (dist(o, sp) < 100 || dist(o, L.pot) < 90) continue;
      if (o.y < sp.y && Math.abs(o.x - sp.x) < o.w / 2 + 40) continue; // 모모 위를 덮는 공짜 지붕 금지
      if (used.some(q => dist(q, o) < 70) || L.chutes.some(c => Math.abs(c.y - o.y) < 30 && c.type === 'side')) continue;
      if (S.some(s => dist(s, o) < 70 && s.kind !== 'ground')) continue;
      if (dynRects.some(d => inRect(o, d, 40)) || chainRects.some(d => inRect(o, d, 30))) continue;
      // 오리의 사격 시야를 가리지 않게
      S.push(o); const blocks = L.hives.some(h => h.kind === 'wasp' && !los(h, sp)); S.pop();
      if (blocks) continue;
      S.push(o); break;
    }
  }
  // 금지 구역: 모모 주변·핀은 피해서 배치
  L.zones = [];
  if (mods.includes('nozone')){
    const nz = 1 + (r() < 0.5 ? 1 : 0) + (lv >= 50 ? 1 : 0);
    for (let i = 0; i < nz; i++) for (let t = 0; t < 60; t++){
      const z = { x: R(40, W - 40), y: R(110, GY - 40), w: R(60, 120), h: R(50, 110), a: 0 };
      if (inRect(sp, z, 60) || inRect(L.pot, z, 50) || L.pins.some(pn => inRect(pn, z, 16)) || L.zones.some(o => dist(o, z) < 70)) continue;
      L.zones.push(z); break;
    }
  }
  // 잉크: D가 오를수록 짧아짐(덮개 하나 ≈ 230px). 파낸 지형은 입구만 막으면 돼서 더 짧게
  L.ink = Math.round(clamp(620 - 380 * D, 210, 620) * (L.carve ? 0.85 : 1));
  L.speed = clamp(2.0 + 1.9 * D, 2.0, 4.2);
  L.force = clamp(0.75 + 0.85 * D + (L.boss ? 0.1 : 0), 0.75, 1.8); // 적이 선을 밀어내는 힘 배율
  L.diff10 = clamp(Math.round(D / 1.15 * 9) + 1, 1, 10);
  return L;
}

// ---------- 상태 ----------

  const edgeWalls = [-15, W + 15].map(x => Bodies.rectangle(x, H / 2 - 200, 30, H + 400, { isStatic: true, label: 'edge', collisionFilter: { category: 16, mask: CAT_DEF } }));

  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);

  phase = 'draw'; pts = []; inkUsed = 0; drawing = false; simT = 0; hp = 100; act = {}; simDur = SIM_MS;
  if (document.getElementById('title').classList.contains('hidden')) AU.play(CHAPTERS[L.theme].bg, 'draw'); AU.setState('draw'); AU.drawingStop();
  if (activePointer !== null){ try { cv.releasePointerCapture(activePointer); } catch (_){} activePointer = null; }
  bugs = []; drops = []; rocks = []; crawlers = []; flashT = 0; lineBody = null; toRemove = new Set();
  cloudAcc = L.clouds.map(() => 0);
  finger = null; fingerBlocked = false; flow = null; pops = []; jetPush = []; fx = [];

  document.getElementById('lvl').textContent = mode === 'daily' ? '오늘의 도전' : curLabel();
  document.getElementById('prevLv').style.visibility = mode === 'level' ? 'visible' : 'hidden';
  document.getElementById('nextLv').style.visibility = mode === 'level' ? 'visible' : 'hidden';
  document.getElementById('nextLv').classList.toggle('dim', mode === 'level' && !devOpen() && level + 1 > store.get('ss_level', 1));
  setTimerUI(-1);
  document.getElementById('modalWrap').classList.add('hidden');
  document.getElementById('shareBox').classList.add('hidden');
  const ch = CHAPTERS[L.theme], rd = mode === 'level' ? roundOf(level) : 0;
  const chips = [`<span class="chip${L.boss ? ' boss' : ''}">${L.boss ? '🔥 보스 · ' : ''}난이도 ${'▮'.repeat(Math.ceil(L.diff10 / 2))}${'▯'.repeat(5 - Math.ceil(L.diff10 / 2))} ${L.diff10}</span>`, `<span class="chip">${ch.icon} ${ch.name}${rd ? ' ★' + (rd + 1) : ''}</span>`, `<span class="chip${L.archIntro ? ' new' : ''}">${ARCH_NAME[L.arch]}</span>`];
  L.mods.forEach(k => { const m = MODS.find(x => x.k === k); chips.push(`<span class="chip${L.modIntro && L.modIntro.k === k ? ' new' : ''}">${m.icon} ${m.name}</span>`); });
  L.kinds.forEach(k => { const m = MECH.find(x => x.k === k); chips.push(`<span class="chip${L.intro && L.intro.k === k ? ' new' : ''}">${m.icon} ${m.name}</span>`); });
  if (L.pins.length){ const m = MECH[1]; chips.push(`<span class="chip${L.intro && L.intro.k === 'pin' ? ' new' : ''}">${m.icon} 핀 ${L.pins.length}</span>`); }

  updateInk(); renderItemBar();

function updateInk(){
  const cap = inkCap(), left = 1 - inkUsed / cap;
  document.getElementById('inkFill').style.width = (left * 100) + '%';
  // 별 기준선: 기본 잉크의 22%·40% 사용 지점 (긴 펜을 켜면 기준선이 오른쪽으로 감)
  const p3 = 1 - 0.22 * L.ink / cap, p2 = 1 - 0.40 * L.ink / cap;
  [['stb3', 'mk3', p3], ['stb2', 'mk2', p2]].forEach(([a, b, v]) => { document.getElementById(a).style.left = document.getElementById(b).style.left = (v * 100) + '%'; });
  document.getElementById('inkTxt').textContent = `${Math.round(left * 100)}%`;
  document.getElementById('stb3').classList.toggle('off', left < p3 - 0.001);
  document.getElementById('stb2').classList.toggle('off', left < p2 - 0.001);
}

// ---------- 선 그리기 ----------
function toWorld(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - cv.clientLeft) / scale, y: (e.clientY - r.top - cv.clientTop) / scale }; }
// 선 두께(11px)만큼 물체와 겹치지 않게 가장자리 6px 안쪽은 그릴 수 없음
const EDGE = 6, PROBES = [[0, 0], [EDGE, 0], [-EDGE, 0], [0, EDGE], [0, -EDGE], [4.2, 4.2], [-4.2, 4.2], [4.2, -4.2], [-4.2, -4.2]];
function blocked(p){
  if (p.x < 2 || p.x > W - 2 || p.y < 2 || p.y > H - 2) return true;
  if (L.zones && L.zones.some(z => inRect(p, z, 0))) return true;
  const bs = [...statics, ...dynBodies, potBody];
  return PROBES.some(([ox, oy]) => Query.point(bs, { x: p.x + ox, y: p.y + oy }).length > 0);
}
function segFree(a, b){
  const steps = Math.max(1, Math.ceil(dist(a, b) / 3));
  for (let i = 1; i <= steps; i++){
    if (blocked({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps })) return (i - 1) / steps;
  }
  return 1;
}
function pushPt(q){
  const last = pts[pts.length - 1], d = dist(q, last);
  if (d < 0.5) return true;
  if (inkUsed + d >= inkCap()){
    const f = (inkCap() - inkUsed) / d;
    pts.push({ x: last.x + (q.x - last.x) * f, y: last.y + (q.y - last.y) * f });
    inkUsed = inkCap(); updateInk(); AU.sfx('inkOut'); endStroke(); return false;
  }
  pts.push(q); inkUsed += d; updateInk(); return true;
}
// 핀 근처를 지나가면 선이 핀 위로 스냅되고, 그 자리에 고정됨
function addPoint(q){
  const last = pts[pts.length - 1];
  for (const pin of L.pins){
    if (pin.on) continue;
    if (segPointDist(last, q, pin) < 15 && segFree(last, pin) >= 1){
      pin.on = true; AU.sfx('pin');
      if (!pushPt({ x: pin.x, y: pin.y })) return false;
      return addPoint(q);
    }
  }
  return pushPt(q);
}
// 막힌 곳을 눌렀으면 가장 가까운 빈 지점(최대 34px)으로 시작점을 옮김
function nearestFree(p, maxR = 34){
  if (!blocked(p)) return p;
  for (let r = 2; r <= maxR; r += 2){
    const n = Math.max(8, Math.round(r * 1.2));
    for (let i = 0; i < n; i++){
      const a = i / n * Math.PI * 2, q = { x: p.x + Math.cos(a) * r, y: p.y + Math.sin(a) * r };
      if (!blocked(q)) return q;
    }
  }
  return null;
}
function beginAt(p0){
  if (phase !== 'draw' || drawing) return false;
  const p = nearestFree(p0);
  if (!p){ showToast('물체 위에서는 시작할 수 없어요'); return false; }
  drawing = true; pts = [p]; AU.sfx('drawStart'); lastMoveT = performance.now();
  L.pins.forEach(pin => {
    if (dist(pin, p) < 15){ pin.on = true; pts = [{ x: pin.x, y: pin.y }]; AU.sfx('pin'); }
  });
  document.getElementById('hint').classList.add('hidden');
  return true;
}
let lastMoveT = 0;
function moveTo(p){
  if (!drawing) return;
  const last = pts[pts.length - 1];
  { const tn = performance.now(), sp = finger ? dist(p, finger) / Math.max(8, tn - lastMoveT) * 16 : 0; lastMoveT = tn; AU.drawing(sp); }
  finger = p;
  if (dist(p, last) < 4){ fingerBlocked = false; return; }
  const f = segFree(last, p);
  if (f >= 1){ fingerBlocked = false; addPoint(p); return; }
  fingerBlocked = true; AU.sfx('blocked');
  if (!blockToastShown){ blockToastShown = true; showToast('선은 물체를 통과할 수 없어요 · 빈 곳으로 돌아오면 이어져요'); }
  const q = { x: last.x + (p.x - last.x) * f, y: last.y + (p.y - last.y) * f };
  if (dist(q, last) > 2) addPoint(q);
}
function release(){
  if (!drawing) return;
  const a = pts[0], z = pts[pts.length - 1];
  if (pts.length > 10 && dist(a, z) < 28 && segFree(z, a) >= 1) addPoint({ x: a.x, y: a.y });
  if (drawing) endStroke();
}
let activePointer = null;
cv.addEventListener('pointerdown', e => {
  // 이전 손가락 상태가 남아 있으면(놓친 pointerup) 정리하고 새로 시작
  if (drawing && phase === 'draw' && activePointer !== e.pointerId){ drawing = false; if (pts.length < 2){ pts = []; inkUsed = 0; } }
  if (beginAt(toWorld(e))){ activePointer = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (_){} }
});
cv.addEventListener('lostpointercapture', () => { if (drawing) release(); activePointer = null; });
cv.addEventListener('pointermove', e => moveTo(toWorld(e)));
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { release(); activePointer = null; }));

function showToast(msg){
  const h = document.getElementById('hint');
  h.textContent = msg; h.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (phase !== 'draw' || drawing) h.classList.add('hidden'); }, 2200);
}

const inkDensity = () => L.mods.includes('heavy') ? 0.0028 : 0.0012; // 선이 가벼워야 적에게 밀림
function endStroke(){
  drawing = false; fingerBlocked = false; AU.drawingStop();
  if (inkUsed < 12){
    pts = []; inkUsed = 0; L.pins.forEach(p => p.on = false); updateInk();
    document.getElementById('hint').classList.remove('hidden'); return;
  }
  const rs = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++){
    acc += dist(pts[i], pts[i - 1]);
    const isPin = L.pins.some(p => p.on && p.x === pts[i].x && p.y === pts[i].y);
    if (acc >= 9 || i === pts.length - 1 || isPin){ rs.push(pts[i]); acc = 0; }
  }
  const parts = [];
  for (let i = 1; i < rs.length; i++){
    const a = rs[i - 1], b = rs[i], len = dist(a, b);
    if (len < 0.5) continue;
    parts.push(Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len + 2, 11, { angle: Math.atan2(b.y - a.y, b.x - a.x), density: inkDensity() }));
    if (i < rs.length - 1) parts.push(Bodies.circle(b.x, b.y, 5.5, { density: inkDensity() }));
  }
  if (!parts.length){ pts = []; inkUsed = 0; updateInk(); return; }
  lineBody = parts.length === 1 ? parts[0] : Body.create({ parts });
  // Matter.js는 조립 몸체의 관성에 평행축 항(m·r²)을 빼먹어서 선이 너무 쉽게 회전함 → 직접 계산
  if (parts.length > 1){
    let I = 0;
    for (const pt of lineBody.parts.slice(1)){
      const dx = pt.position.x - lineBody.position.x, dy = pt.position.y - lineBody.position.y;
      I += pt.inertia + pt.mass * (dx * dx + dy * dy);
    }
    Body.setInertia(lineBody, I);
  }
  lineBody.label = 'line';
  const ice = L.mods.includes('ice');
  lineBody.friction = ice ? 0.02 : 0.6; lineBody.frictionStatic = ice ? 0.05 : 1; lineBody.frictionAir = 0.01;
  if (ice) lineBody.parts.forEach(pt => { pt.friction = 0.02; pt.frictionStatic = 0.05; });
  const p0 = { x: lineBody.position.x, y: lineBody.position.y };
  lineLocal = pts.map(p => ({ x: p.x - p0.x, y: p.y - p0.y }));
  Composite.add(engine.world, lineBody);
  L.pins.filter(p => p.on).forEach(pin => {
    Composite.add(engine.world, Constraint.create({
      pointA: { x: pin.x, y: pin.y }, bodyB: lineBody,
      pointB: { x: pin.x - p0.x, y: pin.y - p0.y }, length: 0, stiffness: 0.9, damping: 0.1
    }));
  });
  startSim();
}

function startSim(){
  phase = 'sim'; simT = 0; useItems(); AU.setState('sim'); AU.sfx('drop');
  if (tut) showToast('선은 물리 법칙대로 떨어져요 · 7초만 버티면 성공!');
  simRng = rng(L.seed + 7);
  spawnQ = [];
  L.hives.filter(h => h.kind === 'bee' || h.kind === 'tank').forEach(h => { for (let i = 0; i < h.n; i++) spawnQ.push({ t: (h.kind === 'tank' ? 250 + i * 650 : 100 + i * 110) + simRng() * 50, h }); });
  ducks = L.hives.filter(h => h.kind === 'wasp').map((h, i) => ({ h, next: (600 + i * 400 + simRng() * 300) * TC, burst: 0, shotT: 0, dir: { x: 0, y: 1 }, size: h.burst, gap: h.gap * TC }));
  popQ = new Set();
  L.crawl.forEach(c => spawnQ.push({ t: c.t * TC, crawl: c }));
  spawnQ.sort((a, b) => a.t - b.t);
  chuteT = L.chutes.map(c => c.first * TC);
  pops = [];
  buildBaseGrid(); flow = null; flowStep = 0; prevPotSpeed = 0; lastHitT = -9999; lastImpactT = -9999;
}

// ---------- 충돌 ----------
function onCollide(ev){
  if (phase !== 'sim') return;
  for (const pr of ev.pairs){ handle(pr.bodyA, pr.bodyB, ev.name); handle(pr.bodyB, pr.bodyA, ev.name); }
}
let jetPush = [];
let prevPotSpeed = 0, lastHitT = -9999, lastImpactT = -9999, lastWet = false, ducks = [], popQ = new Set();
const WATER = ['drop', 'jet', 'splash'];
function ouch(dmg, wet = false){ hp -= dmg; flashT = 280; lastHitT = simT; lastWet = wet; if (wet) AU.sfx('splat'); AU.sfx('meow'); }
function handle(a, b, name){
  // 높은 곳에서 떨어지거나 세게 부딪히면 다침
  if (name === 'collisionStart' && a.parent === potBody && (b.isStatic || b.parent.label === 'line') && prevPotSpeed > 6 && simT - lastImpactT > 500){ lastImpactT = simT; ouch(30); }
  if (a.parent === potBody){
    if (b.label === 'bee') hurtBy(b, 12, true);
    else if (b.label === 'tank') hurtBy(b, 22, true);
    else if (b.label === 'wasp') hurtBy(b, 18, true);
    else if (b.label === 'crawl') hurtBy(b, b.plugin.big ? 25 : 10, false);
    else if (WATER.includes(b.label)){ if (!toRemove.has(b)){ ouch(b.label === 'drop' ? 7 : b.label === 'jet' ? 6 : 4, true); toRemove.add(b); } }
    else if (b.label === 'balloon'){ if (!b.plugin.hit){ b.plugin.hit = true; ouch(18, true); } }
  }
  if (name === 'collisionStart' && a.label === 'jet' && b.parent.label === 'line') jetPush.push({ x: a.position.x, y: a.position.y, vx: a.velocity.x, vy: a.velocity.y, k: 0.004 * (act.tough ? 0.5 : 1) });
  // 적이 선에 부딪히면 날아오던 방향으로 선을 튕겨냄(적마다 세기 다름). 무거운 적은 붙어 있는 동안 계속 밂
  if (b.parent.label === 'line'){
    const big = a.label === 'tank' || (a.label === 'crawl' && a.plugin && a.plugin.big);
    const k = name === 'collisionStart'
      ? ({ bee: 0.0030, tank: 0.0075, balloon: 0.0067, crawl: big ? 0.0075 : 0.0030 })[a.label] * L.force
      : (big ? 0.00042 * L.force : 0);
    // 선이 여러 조각이라 한 번 부딪혀도 충돌이 여러 개 생김 → 적 하나당 충격은 0.12초에 한 번, 미는 힘은 프레임당 한 번
    const P = a.plugin || {};
    P.lineT = simT;
    const kk = P.atk === 'charge' ? 1.6 : 1;
    const okHit = name === 'collisionStart' ? simT - (P.pushT ?? -1e9) >= 120 : P.pushStep !== simT;
    if (k && okHit){
      if (name === 'collisionStart'){ P.pushT = simT; if (a.label !== 'balloon'){ fxHit((a.position.x + b.position.x) / 2, (a.position.y + b.position.y) / 2, big || P.atk === 'charge'); AU.sfx('hit', { big: big || P.atk === 'charge' }); } }
      else P.pushStep = simT;
      let vx = a.velocity.x, vy = a.velocity.y;
      if (Math.hypot(vx, vy) < 0.3){ vx = a.position.x - b.position.x; vy = a.position.y - b.position.y; vx = -vx; vy = -vy; }
      jetPush.push({ x: a.position.x, y: a.position.y, vx, vy, k: k * kk * (act.tough ? 0.5 : 1) });
    }
  }
  if (name === 'collisionStart' && WATER.includes(a.label) && b.parent !== potBody) toRemove.add(a);
  // 물풍선은 무엇에든 부딪히면 터짐
  if (name === 'collisionStart' && a.label === 'balloon' && !WATER.includes(b.label) && b.label !== 'balloon') popQ.add(a);
}
function hurtBy(c, dmg, knock){
  if (simT - c.plugin.hitT < 600) return;
  c.plugin.hitT = simT; ouch(dmg);
  if (knock){
    const dx = c.position.x - sproutPart.position.x, dy = c.position.y - sproutPart.position.y, m = Math.hypot(dx, dy) || 1;
    Body.setVelocity(c, { x: dx / m * 3, y: dy / m * 3 });
  } else Body.setVelocity(c, { x: Math.sign(c.position.x - sproutPart.position.x) * 2.5, y: -2 }); // 불독은 물고 살짝 튕겨남
}

// ---------- 벌레 길찾기: 격자 거리장(flow field) ----------
// 모모에서부터 BFS로 각 칸까지의 거리를 계산. 벌레는 거리가 줄어드는 이웃 칸으로 이동해 막힌 곳을 돌아감.
const CELL = 10, GW = Math.ceil(W / CELL), GH = Math.ceil(H / CELL);
let baseGrid, flow = null, flowGrid = null, flowStep = 0;
function buildBaseGrid(){
  baseGrid = new Uint8Array(GW * GH);
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++){
    const c = { x: gx * CELL + CELL / 2, y: gy * CELL + CELL / 2 };
    if (L.S.some(o => inRect(c, o, 6)) || L.hives.some(h => dist(c, h) < 32)) baseGrid[gy * GW + gx] = 1;
  }
}
function markCircle(g, x, y, r){
  const x0 = Math.max(0, Math.floor((x - r) / CELL)), x1 = Math.min(GW - 1, Math.floor((x + r) / CELL));
  const y0 = Math.max(0, Math.floor((y - r) / CELL)), y1 = Math.min(GH - 1, Math.floor((y + r) / CELL));
  for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++){
    const cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
    if ((cx - x) * (cx - x) + (cy - y) * (cy - y) <= r * r) g[gy * GW + gx] = 1;
  }
}
function linePoints(){
  if (!lineBody) return [];
  const c = Math.cos(lineBody.angle), s = Math.sin(lineBody.angle), o = lineBody.position;
  return lineLocal.map(p => ({ x: o.x + p.x * c - p.y * s, y: o.y + p.x * s + p.y * c }));
}
function computeFlow(){
  const g = baseGrid.slice();
  // 움직이는 지형
  for (const b of dynBodies){
    const c = Math.cos(b.angle), sn = Math.sin(b.angle), w = b.plugin.w;
    for (let t = -w / 2; t <= w / 2; t += 6) markCircle(g, b.position.x + c * t, b.position.y + sn * t, b.plugin.h / 2 + 6);
  }
  // 선: 선 반두께 5.5 + 벌레 반지름 6 만큼 부풀려 표시
  const P = linePoints();
  for (let i = 1; i < P.length; i++){
    const a = P[i - 1], b = P[i], n = Math.max(1, Math.ceil(dist(a, b) / 4));
    for (let j = 0; j <= n; j++) markCircle(g, a.x + (b.x - a.x) * j / n, a.y + (b.y - a.y) * j / n, 5.5 + RAD.drone);
  }
  const d = new Int16Array(GW * GH).fill(-1), q = new Int32Array(GW * GH);
  let qh = 0, qt = 0;
  const hd = potBody.parts[2].position, tr = potBody.parts[1].position;
  for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++){
    const cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
    if (Math.hypot(cx - hd.x, cy - hd.y) < 30 || Math.hypot(cx - tr.x, cy - tr.y) < 28){ const i = gy * GW + gx; g[i] = 0; d[i] = 0; q[qt++] = i; }
  }
  while (qh < qt){
    const i = q[qh++], gx = i % GW, gy = (i / GW) | 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++){
      if (!ox && !oy) continue;
      const nx = gx + ox, ny = gy + oy;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const j = ny * GW + nx;
      if (d[j] >= 0 || g[j]) continue;
      if (ox && oy && (g[gy * GW + nx] || g[ny * GW + gx])) continue; // 대각선 모서리 끼어들기 금지
      d[j] = d[i] + 1; q[qt++] = j;
    }
  }
  flow = d; flowGrid = g;
}
function bestNeighbor(i){
  const gx = i % GW, gy = (i / GW) | 0;
  let best = -1, bv = 1e9;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++){
    if (!ox && !oy) continue;
    const nx = gx + ox, ny = gy + oy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    const j = ny * GW + nx;
    if (flow[j] >= 0 && flow[j] < bv){ bv = flow[j]; best = j; }
  }
  return best;
}
// 격자에서 a→모모 직선이 막혔는지
function clearShot(a, b){
  if (!flowGrid) return true;
  const n = Math.ceil(dist(a, b) / 5);
  for (let i = 1; i < n; i++){
    const x = a.x + (b.x - a.x) * i / n, y = a.y + (b.y - a.y) * i / n;
    if (Math.hypot(x - b.x, y - b.y) < 30) break;
    const gx = Math.floor(x / CELL), gy = Math.floor(y / CELL);
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) continue;
    if (flowGrid[gy * GW + gx]) return false;
  }
  return true;
}
// 길이 있으면 두 칸 앞을 향한 방향, 없으면 null(=직진해서 선을 밀어붙임)
function flowDir(b){
  if (!flow) return null;
  const gx = Math.floor(b.position.x / CELL), gy = Math.floor(b.position.y / CELL);
  if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return null;
  const i = gy * GW + gx;
  if (flow[i] === 0) return null;
  let n1 = flow[i] > 0 ? bestNeighbor(i) : bestNeighbor(i);
  if (n1 < 0 || (flow[i] > 0 && flow[n1] >= flow[i])) return null;
  const n2 = flow[n1] > 0 ? bestNeighbor(n1) : n1, t = n2 >= 0 ? n2 : n1;
  const tx = (t % GW) * CELL + CELL / 2, ty = ((t / GW) | 0) * CELL + CELL / 2;
  const dx = tx - b.position.x, dy = ty - b.position.y, m = Math.hypot(dx, dy) || 1;
  return { x: dx / m, y: dy / m };
}

// ---------- 시뮬레이션 ----------
function capV(body, max){
  const v = Body.getVelocity(body), m = Math.hypot(v.x, v.y);
  if (m > max) Body.setVelocity(body, { x: v.x / m * max, y: v.y / m * max });
}
function clampSpeeds(){
  for (const bug of bugs) capV(bug, (bug.label === 'tank' ? 1.6 + L.speed * 0.3 : L.speed * 1.8) * (bug.plugin.atk === 'charge' ? 1.6 : 1));
  for (const d of drops) capV(d, d.label === 'jet' ? 7.5 : 7);
  for (const k of rocks) capV(k, 9);
  for (const c of crawlers){ const v = Body.getVelocity(c), cap = (c.plugin.big ? 1.15 : 2.4) * (c.plugin.atk === 'charge' ? 1.9 : 1); if (Math.abs(v.x) > cap) Body.setVelocity(c, { x: Math.sign(v.x) * cap, y: v.y }); }
  if (lineBody){
    capV(lineBody, 9);
    const av = Body.getAngularVelocity(lineBody);
    if (Math.abs(av) > 0.09) Body.setAngularVelocity(lineBody, Math.sign(av) * 0.09);
  }
  capV(potBody, 8);
  for (const b of dynBodies){
    if (b.label === 'seesaw' && Math.abs(b.angle) > 0.42){ Body.setAngle(b, Math.sign(b.angle) * 0.42); Body.setAngularVelocity(b, 0); }
    if (b.label === 'hang' && Math.abs(b.angle) > 0.3){ Body.setAngle(b, Math.sign(b.angle) * 0.3); Body.setAngularVelocity(b, 0); }
    capV(b, 6);
  }
}
function addBody(b, arr){ arr.push(b); Composite.add(engine.world, b); }

function step(){
  simT += STEP;
  if (flowStep++ % 8 === 0) computeFlow();
  while (spawnQ.length && spawnQ[0].t <= simT){
    const q = spawnQ.shift();
    if (q.crawl){
      const big = q.crawl.big, rr = big ? RAD.bigdog : RAD.pup, x = q.crawl.side < 0 ? rr + 2 : W - rr - 2;
      const c = Bodies.circle(x, GY - rr - 1, rr, { label: 'crawl', density: big ? 0.014 : 0.0075, friction: 0.9, collisionFilter: { category: CAT_CRAWL, mask: CAT_DEF | CAT_CRAWL } });
      c.plugin = { hitT: -9999, ph: simRng() * 6, big, nextHop: simT + 500 + simRng() * 600 };
      addBody(c, crawlers); AU.sfx('woof', { big });
    } else {
      const h = q.h, tank = h.kind === 'tank';
      const bug = Bodies.circle(h.x + (simRng() - 0.5) * 10, h.y + (tank ? 48 : 40), tank ? RAD.tank : RAD.drone, {
        label: h.kind, frictionAir: tank ? 0.05 : 0.03, density: tank ? 0.012 : 0.003, restitution: tank ? 0.1 : 0.4,
        collisionFilter: { category: CAT_BUG, mask: CAT_DEF | CAT_BUG }
      });
      bug.plugin = { hitT: -9999, ph: simRng() * 6, mode: 'aim', until: simT + 500 + simRng() * 600, dir: null };
      addBody(bug, bugs);
    }
  }
  L.clouds.forEach((c, i) => {
    cloudAcc[i] += STEP;
    while (cloudAcc[i] >= c.rate * TC){
      cloudAcc[i] -= c.rate * TC;
      const d = Bodies.circle(c.x + (simRng() - 0.5) * (c.w - 20), 70, RAD.rain, {
        label: 'drop', frictionAir: 0.01, density: 0.0008, collisionFilter: { category: CAT_DROP, mask: CAT_DEF }
      });
      d.plugin = { born: simT };
      Body.setVelocity(d, { x: 0, y: 2 });
      addBody(d, drops);
    }
  });
  L.chutes.forEach((c, i) => {
    if (simT >= chuteT[i]){
      chuteT[i] += c.interval * TC;
      const k = Bodies.circle(c.x, c.y, c.r, { label: 'balloon', density: 0.008, friction: 0.3, restitution: 0.25, collisionFilter: { category: 32, mask: 0xFFFFFFFF & ~16 } });
      k.plugin = { hit: false, col: Math.floor(simRng() * 4) };
      Body.setVelocity(k, { x: c.vx, y: c.vy });
      addBody(k, rocks);
    }
  });
  for (const dk of ducks){
    const h = dk.h, hd = sproutPart.position;
    if (!dk.burst){
      const dx = hd.x - h.x, dy = hd.y - h.y, m = Math.hypot(dx, dy) || 1;
      dk.dir = { x: dx / m, y: dy / m }; // 조준 중에는 모모를 계속 따라감
      if (simT >= dk.next){ dk.burst = dk.size; dk.shotT = simT; AU.sfx('quack'); AU.sfx('squirt'); }
    }
    if (dk.burst && simT >= dk.shotT){
      const j = Bodies.circle(h.x + dk.dir.x * 30, h.y + dk.dir.y * 30, RAD.jet, {
        label: 'jet', frictionAir: 0, density: 0.0008, collisionFilter: { category: CAT_DROP, mask: CAT_DEF }
      });
      j.plugin = { born: simT };
      Body.setVelocity(j, { x: dk.dir.x * 7, y: dk.dir.y * 7 });
      addBody(j, drops);
      dk.burst--; dk.shotT = simT + 55;
      if (!dk.burst) dk.next = simT + dk.gap + simRng() * 300 * TC;
    }
  }
  for (const c of crawlers){
    if (!c.plugin.big && c.plugin.atk !== 'back' && simT > c.plugin.nextHop && Math.abs(c.velocity.y) < 0.4){
      Body.setVelocity(c, { x: Body.getVelocity(c).x, y: -4.6 }); c.plugin.nextHop = simT + 900 + simRng() * 700;
    }
  }
  for (const d of drops) if (d.position.y > H + 20 || d.position.x < -20 || d.position.x > W + 20 || simT - d.plugin.born > (d.label === 'splash' ? 1500 : 4000)) toRemove.add(d);
  for (const k of rocks) if (k.position.y > H + 40 || k.position.x < -60 || k.position.x > W + 60) toRemove.add(k);

  const g = engine.gravity, sp = sproutPart.position;
  for (let s = 0; s < SUB; s++){
    for (const bug of bugs){
      Body.applyForce(bug, bug.position, { x: 0, y: -bug.mass * g.y * g.scale });
      let dx = sp.x - bug.position.x, dy = sp.y - bug.position.y, m = Math.hypot(dx, dy) || 1;
      if (bug.label === 'wasp'){
        const P = bug.plugin;
        if (P.mode === 'aim'){
          if (s === 0) P.shot = clearShot(bug.position, sp);
          const fd = s === 0 ? (P.fd = flowDir(bug)) : P.fd;
          if (!P.shot && fd){
            // 직선이 막혀 있으면 길을 따라 돌아서 접근
            Body.applyForce(bug, bug.position, { x: bug.mass * fd.x * 0.0012, y: bug.mass * fd.y * 0.0012 });
          } else {
            // 모모에서 110px 떨어진 곳에서 맴돌며 노림
            const tx = sp.x - dx / m * 110, ty = sp.y - dy / m * 110;
            const ex = tx - bug.position.x, ey = ty - bug.position.y, em = Math.hypot(ex, ey) || 1;
            Body.applyForce(bug, bug.position, { x: bug.mass * (ex / em * 0.0011 + (simRng() - 0.5) * 0.001), y: bug.mass * (ey / em * 0.0011 + (simRng() - 0.5) * 0.001) });
          }
          if (simT > P.until && (P.shot || !fd)){ P.mode = 'dash'; P.dir = { x: dx / m, y: dy / m }; P.until = simT + 550; }
        } else {
          Body.applyForce(bug, bug.position, { x: bug.mass * P.dir.x * 0.004, y: bug.mass * P.dir.y * 0.004 });
          if (simT > P.until){ P.mode = 'aim'; P.until = simT + 700 + simRng() * 500; }
        }
      } else {
        const tank = bug.label === 'tank', P = bug.plugin;
        const fd = s === 0 ? (P.fd = flowDir(bug)) : P.fd;
        // 선에 막혀 0.6초간 모모에게 못 다가가면: 물러났다 돌진하거나, 옆으로 미끄러지며 틈을 찾음
        if (s === 0){
          if (P.best === undefined){ P.best = m; P.prog = simT; P.atk = 'seek'; }
          if (m < P.best - 4){ P.best = m; P.prog = simT; }
          const stuck = simT - P.prog > (tank ? 700 : 600) && simT - (P.lineT ?? -1e9) < 350;
          if (P.atk === 'seek' && stuck){
            if (simRng() < (tank ? 0.75 : 0.6)){ P.atk = 'back'; P.atkT = simT + 320 + simRng() * 200; }
            else { P.atk = 'probe'; P.atkT = simT + 450 + simRng() * 300; P.side = simRng() < 0.5 ? -1 : 1; }
          } else if (P.atk === 'back' && simT > P.atkT){ P.atk = 'charge'; P.atkT = simT + 480; }
          else if ((P.atk === 'charge' || P.atk === 'probe') && simT > P.atkT){ P.atk = 'seek'; P.best = m; P.prog = simT; }
        }
        if (P.atk !== 'seek'){
          const ux = dx / m, uy = dy / m, base = tank ? 0.0012 * (0.6 + L.force * 0.5) : 0.0012 * L.speed / 2.2;
          let fx, fy;
          if (P.atk === 'back'){ fx = -ux * base * 1.5; fy = -uy * base * 1.5; }
          else if (P.atk === 'charge'){ fx = ux * base * 3.2; fy = uy * base * 3.2; }
          else { fx = (-uy * P.side * 1.4 + ux * 0.35) * base; fy = (ux * P.side * 1.4 + uy * 0.35) * base; }
          Body.applyForce(bug, bug.position, { x: bug.mass * (fx + (simRng() - 0.5) * 0.0008), y: bug.mass * (fy + (simRng() - 0.5) * 0.0008) });
          continue;
        }
        // 헤비 드론은 길이 막히면(직진 모드) 추력을 올려 선을 밀어붙임
        const acc = tank ? (fd ? 0.0010 : 0.0018) * (0.6 + L.force * 0.5) : 0.0012 * L.speed / 2.2 * (fd ? 1 : 1 + 0.5 * L.force);
        bug.plugin.ram = tank && !fd;
        let ux = dx / m, uy = dy / m;
        if (fd){ ux = fd.x; uy = fd.y; }
        // 좌우로 흔들리는 비행(일직선 방지)
        const wob = Math.sin(simT / 200 + bug.plugin.ph) * (tank ? 0.00012 : 0.0004);
        Body.applyForce(bug, bug.position, {
          x: bug.mass * (ux * acc - uy * wob + (simRng() - 0.5) * 0.001),
          y: bug.mass * (uy * acc + ux * wob + (simRng() - 0.5) * 0.001)
        });
      }
    }
    for (const c of crawlers){
      const P = c.plugin, ddx = potBody.position.x - c.position.x, ad = Math.abs(ddx), dir = Math.sign(ddx);
      // 0.7초간 못 다가가면 뒷걸음질 → 달려들기(강아지는 뛰어오름)
      if (s === 0){
        if (P.best === undefined){ P.best = ad; P.prog = simT; P.atk = 'seek'; }
        if (ad < P.best - 4){ P.best = ad; P.prog = simT; }
        if (P.atk === 'seek' && simT - P.prog > 700 && ad > 18){ P.atk = 'back'; P.atkT = simT + 380 + simRng() * 150; }
        else if (P.atk === 'back' && simT > P.atkT){
          P.atk = 'charge'; P.atkT = simT + 550; AU.sfx('woof', { big: P.big });
          const v = Body.getVelocity(c);
          if (Math.abs(v.y) < 0.8) Body.setVelocity(c, { x: dir * (P.big ? 1.6 : 3.5), y: P.big ? -2.2 : -5.2 });
        } else if (P.atk === 'charge' && simT > P.atkT){ P.atk = 'seek'; P.best = ad; P.prog = simT; }
      }
      const base = P.big ? 0.0012 : 0.0011;
      const k = P.atk === 'back' ? -0.9 : P.atk === 'charge' ? 2.6 : 1;
      Body.applyForce(c, c.position, { x: c.mass * base * k * dir, y: 0 });
    }
    for (const d of drops) if (d.label === 'jet') Body.applyForce(d, d.position, { x: 0, y: -d.mass * g.y * g.scale });
    for (const w of L.winds){
      const inB = y => y > w.y0 && y < w.y1;
      const push = (b, k) => { if (inB(b.position.y)) Body.applyForce(b, b.position, { x: b.mass * k * w.dir * w.str, y: 0 }); };
      drops.forEach(d => { if (d.label !== 'jet') push(d, 0.0007); }); bugs.forEach(b => push(b, 0.0004)); rocks.forEach(k => push(k, 0.0002));
      if (lineBody){
        const parts = lineBody.parts.length > 1 ? lineBody.parts.slice(1) : [lineBody];
        for (const p of parts) if (inB(p.position.y)) Body.applyForce(lineBody, p.position, { x: p.mass * 0.0005 * w.dir * w.str, y: 0 });
      }
    }
    if (jetPush.length && lineBody){
      for (const j of jetPush){ const m = Math.hypot(j.vx, j.vy) || 1; Body.applyForce(lineBody, { x: j.x, y: j.y }, { x: j.vx / m * lineBody.mass * j.k, y: j.vy / m * lineBody.mass * j.k }); }
      jetPush = [];
    }
    Engine.update(engine, STEP / SUB);
    clampSpeeds();
  }
  if (popQ.size){
    popQ.forEach(bl => {
      toRemove.add(bl);
      for (let i = 0; i < 8; i++){
        const ang = -Math.PI * (0.05 + 0.9 * i / 7) + (simRng() - 0.5) * 0.3, sp2 = 2.5 + simRng() * 2;
        const sx = bl.position.x + Math.cos(ang) * (bl.circleRadius + 3), sy = bl.position.y + Math.sin(ang) * (bl.circleRadius + 3);
        const d = Bodies.circle(sx, sy, 2.8, { label: 'splash', frictionAir: 0.01, density: 0.0008, collisionFilter: { category: CAT_DROP, mask: CAT_DEF } });
        d.plugin = { born: simT };
        Body.setVelocity(d, { x: Math.cos(ang) * sp2 + bl.velocity.x * 0.3, y: Math.sin(ang) * sp2 });
        addBody(d, drops);
      }
      pops.push({ x: bl.position.x, y: bl.position.y, t: simT, col: bl.plugin.col });
      fxPop(bl.position.x, bl.position.y, BALLOON[bl.plugin.col || 0]); AU.sfx('pop');
    });
    popQ.clear();
  }
  if (toRemove.size){
    toRemove.forEach(b => Composite.remove(engine.world, b));
    drops = drops.filter(d => !toRemove.has(d));
    rocks = rocks.filter(k => !toRemove.has(k));
    toRemove.clear();
  }
  if (flashT > 0) flashT -= STEP;
  hp = Math.max(0, hp);
  if (hp <= 0) return finish(false, lastWet ? '모모가 흠뻑 젖었어요' : '모모가 다쳤어요');
  if (potBody.position.y > H + 60 || potBody.position.x < -60 || potBody.position.x > W + 60) return finish(false, '모모가 떨어졌어요');
  prevPotSpeed = Body.getSpeed(potBody);
  if (simT >= simDur) return finish(true);
}

// ---------- 종료 ----------
function finish(win, reason, delay = 450){
  phase = 'end'; endT = performance.now();
  if (win){ delay = Math.max(delay, 1100); fxWin(potBody.position.x, potBody.position.y + potOff.foot); AU.sfx('win'); AU.sfx('popper'); }
  else AU.sfx('fail');
  AU.duck(2.4); AU.setState('draw'); AU.drawingStop();
  const pct = Math.round(inkUsed / L.ink * 100);
  const stars = pct <= 22 ? 3 : pct <= 40 ? 2 : 1;
  const score = win ? Math.round(Math.max(0, 1 - inkUsed / L.ink) * 700 + hp * 3) : 0;
  endInfo = { win, pct, stars, score, hp: Math.round(hp), reason };
  let best = store.get(curKey(), null), newBest = false;
  if (win && (!best || score > best.score)){ best = { score, pct }; store.set(curKey(), best); newBest = true; }
  if (win && mode === 'level' && level + 1 > store.get('ss_level', 1)) store.set('ss_level', level + 1);
  setTimeout(() => {
    if (phase !== 'end') return;
    const mt = document.getElementById('mTitle');
    mt.textContent = win ? (newBest && best && !tut ? '최고 기록!' : '성공!') : '앗, 실패!'; mt.classList.toggle('fail', !win);
    document.getElementById('mImg').src = win ? 'assets/momo_heart.png' : 'assets/momo_angry.png';
    refreshAccs();
    const rs = document.getElementById('mReason'); rs.textContent = win ? '' : reason; rs.classList.toggle('hidden', win);
    const tip = document.getElementById('mTip');
    const tipText = tut ? (win ? '잉크를 적게 쓸수록 ⭐이 늘어나요. 22% 이하면 ⭐⭐⭐!' : '틈이 있으면 드론이 돌아서 들어와요. 빈틈없이 감싸 보세요!')
      : (!win && reason === '모모가 떨어졌어요') ? '선이 너무 무거우면 모모를 밀어낼 수 있어요' : '';
    tip.textContent = tipText; tip.classList.toggle('hidden', !tipText);
    if (tut && win) store.set('momo_tut_done', true);
    document.getElementById('mStars').innerHTML = win ? [0, 1, 2].map(i => `<i class="${i < stars ? 'on' : ''}" style="animation-delay:${0.2 + i * 0.18}s">★</i>`).join('') : '<i class="drop" style="animation-delay:.15s">💧</i>';
    document.getElementById('mInk').textContent = pct + '%';
    document.getElementById('mHp').textContent = Math.round(hp);
    document.getElementById('mScore').textContent = score;
    document.getElementById('mBest').textContent = newBest ? '🏆 새 최고 기록!' : (best ? `최고 기록 ${best.score}점` : '');
    document.getElementById('mNext').classList.toggle('hidden', !win || mode === 'daily');
    document.getElementById('mRetry').textContent = win && stars < 3 ? '⭐ 더 받기' : '다시 도전';
    document.getElementById('mShare').classList.toggle('hidden', !win);
    document.getElementById('modalWrap').classList.remove('hidden');
    if (win) for (let i = 0; i < stars; i++) setTimeout(() => AU.sfx('star', { i }), 220 + i * 180);
  }, delay);
}

function drawLine(){
  let P = pts;

    const c = Math.cos(lineBody.angle), s = Math.sin(lineBody.angle), o = lineBody.position;
    P = lineLocal.map(p => ({ x: o.x + p.x * c - p.y * s, y: o.y + p.x * s + p.y * c }));
  }
  if (drawing && fingerBlocked && finger && P.length){
    const z = P[P.length - 1];
    ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(224,60,60,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(z.x, z.y); ctx.lineTo(finger.x, finger.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(224,60,60,.85)'; ctx.beginPath(); ctx.arc(finger.x, finger.y, 7, 0, 7); ctx.fill();
  }
  if (P.length < 2) return;
  const pen = penNow(), path = () => { ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y); for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (pen.k === 'navy'){ ctx.strokeStyle = TH().ink; ctx.lineWidth = 11; path(); ctx.stroke(); return; }
  // 꾸민 펜: 굵기(11)는 그대로, 테두리 + 안쪽 색. 밤 배경에서는 밝은 테두리
  ctx.strokeStyle = TH().bg === 'alley' ? '#f1e9c9' : '#23304d'; ctx.lineWidth = 11; path(); ctx.stroke();
  if (pen.k === 'rainbow'){

      ctx.beginPath(); ctx.moveTo(P[i - 1].x, P[i - 1].y); ctx.lineTo(P[i].x, P[i].y); ctx.stroke();
    }
  } else { ctx.strokeStyle = pen.c; ctx.lineWidth = 6.5; path(); ctx.stroke(); }
  if (pen.k === 'gold'){ ctx.save(); ctx.translate(-0.8, -1.2); ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 1.8; path(); ctx.stroke(); ctx.restore(); }

function drawRush(b, r){

  const x = b.position.x, y = b.position.y;
  if (P.atk === 'back'){
    ctx.save(); ctx.fillStyle = '#ff2d2d'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.font = `900 ${Math.round(r * 1.3 + 8)}px system-ui,sans-serif`; ctx.textAlign = 'center';
    const yy = y - r - 6 + Math.sin(simT / 40) * 1.5;
    ctx.strokeText('!', x, yy); ctx.fillText('!', x, yy); ctx.restore();
  } else {
    const v = b.velocity, vm = Math.hypot(v.x, v.y) || 1, ux = v.x / vm, uy = v.y / vm;
    ctx.save();
    for (let i = 1; i <= 4; i++){
      ctx.fillStyle = `rgba(255,50,50,${0.46 - i * 0.09})`;
      ctx.beginPath(); ctx.arc(x - ux * i * r * 0.9, y - uy * i * r * 0.9, r * (1 - i * 0.12), 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawFx(){
  const now = performance.now();
  fx = fx.filter(f => now - f.t0 < f.life);
  for (const f of fx){
    const t = (now - f.t0) / 1000, k = (now - f.t0) / f.life;
    ctx.save();
    if (f.kind === 'spark'){
      ctx.translate(f.x, f.y); ctx.rotate(f.rot); const sc = f.s * (0.6 + Math.sin(Math.min(1, k * 1.6) * Math.PI) * 0.7);
      ctx.globalAlpha = 1 - k * k; ctx.lineCap = 'round';
      for (let i = 0; i < 5; i++){ ctx.rotate(Math.PI * 2 / 5); const r0 = 4 * sc + k * 6, r1 = r0 + 7 * sc;
        ctx.strokeStyle = '#23304d'; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.moveTo(r0, 0); ctx.lineTo(r1, 0); ctx.stroke();
        ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(r0, 0); ctx.lineTo(r1, 0); ctx.stroke(); }
    } else if (f.kind === 'ring'){
      const r = (f.r0 ?? 10) + ((f.r1 ?? 34) - (f.r0 ?? 10)) * (1 - (1 - k) * (1 - k));
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.c; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.stroke();
    } else if (f.kind === 'bit'){
      const dr = f.drag ? Math.exp(-f.drag * t) : 1, tt = f.drag ? (1 - dr) / f.drag : t;
      const x = f.x + f.vx * tt, y = f.y + f.vy * tt + 0.5 * f.g * t * t * (f.drag ? 0.55 : 1);
      ctx.translate(x, y); ctx.rotate(f.rot + f.spin * t); ctx.scale(1, Math.cos(t * 9 + f.rot) * 0.5 + 0.6);
      ctx.globalAlpha = k > 0.75 ? (1 - k) / 0.25 : 1;
      ctx.fillStyle = f.c; ctx.strokeStyle = '#23304d'; ctx.lineWidth = 1.2;
      rrect(-f.w / 2, -f.h / 2, f.w, f.h, 1.5); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
}

function guidePath(){
  const sp = L.sp, top = L.pot.y + 18, w = 40, y = sp.y - 26;
  return [{ x: sp.x - w, y: top - 10 }, { x: sp.x - w, y }, { x: sp.x + w, y }, { x: sp.x + w, y: top - 10 }];

function drawGuide(){
  const P = guidePath();
  ctx.setLineDash([7, 7]); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y); P.slice(1).forEach(q => ctx.lineTo(q.x, q.y)); ctx.stroke(); ctx.setLineDash([]);
  const lens = P.slice(1).map((q, i) => dist(q, P[i])), total = lens.reduce((a, b) => a + b, 0);
  let d = ((performance.now() / 1800) % 1) * total, i = 0;
  while (i < lens.length - 1 && d > lens[i]){ d -= lens[i]; i++; }
  const a = P[i], b = P[i + 1], t = Math.min(1, d / lens[i]), hx = a.x + (b.x - a.x) * t, hy = a.y + (b.y - a.y) * t;
  ctx.fillStyle = 'rgba(255,209,102,.9)'; ctx.beginPath(); ctx.arc(hx, hy, 6, 0, 7); ctx.fill();
  ctx.font = '26px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('👆', hx - 8, hy + 26);
}
