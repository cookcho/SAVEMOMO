  const th = TH();
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, XP * scale * dpr, 0);
  if (bgKey !== L.seed + ':' + L.theme + ':' + XP){ bgCanvas = buildBackdrop(); bgKey = L.seed + ':' + L.theme + ':' + XP; }
  ctx.drawImage(bgCanvas, -XP, 0, W + 2 * XP, H);
  // 금지 구역
  (L.zones || []).forEach(z => {
    ctx.save(); ctx.beginPath(); ctx.rect(z.x - z.w / 2, z.y - z.h / 2, z.w, z.h); ctx.clip();
    ctx.fillStyle = 'rgba(230,50,50,.10)'; ctx.fillRect(z.x - z.w / 2, z.y - z.h / 2, z.w, z.h);
    ctx.strokeStyle = 'rgba(230,50,50,.35)'; ctx.lineWidth = 4;
    for (let d = -z.h; d < z.w; d += 14){ ctx.beginPath(); ctx.moveTo(z.x - z.w / 2 + d, z.y + z.h / 2); ctx.lineTo(z.x - z.w / 2 + d + z.h, z.y - z.h / 2); ctx.stroke(); }
    ctx.restore();
    ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(230,50,50,.8)'; ctx.lineWidth = 2; ctx.strokeRect(z.x - z.w / 2, z.y - z.h / 2, z.w, z.h); ctx.setLineDash([]);
    ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🚫', z.x, z.y + 5);
  });
  L.winds.forEach(drawWind);
  L.clouds.forEach(drawCloud);
  if (L.cave){ const c = L.cave, x0 = c.left ? 0 : c.mouth, x1 = c.left ? c.mouth : W; ctx.fillStyle = 'rgba(30,20,10,.22)'; ctx.fillRect(x0, c.ceilY, x1 - x0, c.floorY - c.ceilY); }
  statics.forEach(drawStatic);
  dynBodies.forEach(drawDyn);
  L.chutes.forEach(drawChute);
  L.hives.forEach(drawHive);
  (L.claws || []).forEach(drawClawDock);
  if (phase === 'draw' && L.crawl.length){
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '700 11px sans-serif';
    [...new Set(L.crawl.map(c => c.side))].forEach(sd => { ctx.textAlign = sd < 0 ? 'left' : 'right'; const ic = L.crawl.some(c => c.side === sd && c.big) ? '🐕' : '🐶'; ctx.fillText(sd < 0 ? ic + ' →' : '← ' + ic, sd < 0 ? 6 : W - 6, GY - 10); });
  }
  drawCat();
  drops.forEach(drawWater);
  rocks.forEach(drawRock);
  drawPops();
  crawlers.forEach(drawCrawler);
  drawLine();
  L.pins.forEach(drawPin);
  if ((tut || pinTut()) && phase === 'draw' && !drawing && pts.length === 0) drawGuide();
  if (L.water){ if (L.hz === 'spike') drawSpikeFloor(); else if (L.hz === 'fire') drawFireFloor(); else drawWaterPool(); }
  bugs.forEach(drawBug);
  claws.forEach(drawClaw);
  drawFx();
  if (phase === 'sim') setTimerUI(Math.max(0, (simDur - simT) / 1000));
  else if (phase === 'end') setTimerUI(-1);
}

// ---------- 루프 ----------
function resize(){
  const st = document.getElementById('stage');
  const w = st.clientWidth - 10, h = st.clientHeight - 18; // 흰 테두리(3px)만 남기고 가로를 꽉 채움
  const ns = Math.min(w / W, h / H), nd = window.devicePixelRatio || 1;
  // 세로가 모자라 양옆이 남으면, 놀이 영역(360)은 그대로 두고 양옆을 배경·바닥으로 채움(한쪽 최대 36)
  const nx = Math.max(0, Math.min(36, Math.floor((w / ns - W) / 2)));
  if (ns === scale && nd === dpr && nx === XP && cv.width) return; // 크기 그대로면 다시 만들지 않음
  scale = ns; dpr = nd; XP = nx;
  cv.style.width = (W + 2 * XP) * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round((W + 2 * XP) * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(document.getElementById('stage'));
let last = performance.now(), accum = 0;
// 다음 프레임 예약을 먼저 해서, 계산·그리기에서 오류가 나도 화면이 멈추지 않게 함
let loopErrors = 0;
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(100, t - last); last = t;
  try {
    if (phase === 'sim'){
      accum += dt;
      let n = 0;
      while (accum >= STEP && n < 5 && phase === 'sim'){ step(); accum -= STEP; n++; }
      if (n >= 5) accum = 0;
    } else accum = 0;
  } catch (e){ console.error(e); if (++loopErrors > 20){ loopErrors = 0; finish(false, '오류가 나서 다시 시작해요'); } }
  try { AU.update(phase === 'sim' ? { active: true, drones: bugs.filter(b => b.label === 'bee').length, tanks: bugs.filter(b => b.label === 'tank').length, rain: L.clouds.length > 0 } : { active: false }); } catch (_){}
  try { render(); } catch (e){ console.error(e); try { ctx.setLineDash([]); ctx.restore(); } catch (_){} }
}
// ---------- 이야기 (처음 실행 시 한 번) ----------
const STORY = [
  { art: '<img src="assets/momo_sleepy.png" class="big bob" alt=""><div class="zz">z z</div>', text: '햇살 좋은 오후,<br>낮잠이 세상에서 제일 좋은 고양이 <b>모모</b>.' },
  { art: () => `<div class="row">${sprTag('drone', '🛸')}${sprTag('duck', '🦆')}${sprTag('balloon_red', '🎈')}${sprTag('puppy', '🐶')}</div>`, text: '그런데 오늘은 <b>목욕하는 날!</b><br>집사는 물 드론, 물총 오리, 물풍선을 꺼냈고<br>옆집 불독까지 놀자고 달려와요.' },
  { art: '<img src="assets/momo_surprised.png" class="big shake" alt="">', text: '물이라면 질색인 모모를<br>도와줄 수 있는 건 당신의 <b>펜 한 자루</b>뿐!' },
  { art: '<div class="pen">✏️</div><img src="assets/momo_sit.png" class="big" alt="">', text: '<b>선을 딱 한 번</b> 그어 벽을 만들고<br><b>7초</b> 동안 모모를 지켜 주세요.' },
];
let storyIdx = 0, cards = STORY;
function renderStory(){
  const sc = cards[storyIdx];
  document.getElementById('sArt').innerHTML = typeof sc.art === 'function' ? sc.art() : sc.art;
  document.getElementById('sText').innerHTML = sc.text;
  document.getElementById('sDots').innerHTML = cards.map((_, i) => `<i class="${i === storyIdx ? 'on' : ''}"></i>`).join('');
  document.getElementById('sNext').textContent = storyIdx === cards.length - 1 ? '시작하기 🐾' : '다음 ▶';
  document.getElementById('sSkip').style.display = cards.length > 1 ? '' : 'none';
}
function showStory(){ cards = STORY; storyIdx = 0; renderStory(); document.getElementById('story').classList.remove('hidden'); }
function closeStory(){
  document.getElementById('story').classList.add('hidden');
  if (!store.get('momo_story_seen', false)){ store.set('momo_story_seen', true); hideTitle(); mode = 'level'; level = 1; setup(); }
}
document.getElementById('sNext').onclick = () => { if (storyIdx < cards.length - 1){ storyIdx++; renderStory(); } else closeStory(); };
// 새 챕터(11, 21, 31…레벨)에 처음 들어가면 장소 이동 이야기
function maybeChapterCard(){
  if (mode !== 'level' || level === 1 || (level - 1) % 10 !== 0) return;
  const key = 'momo_ch_' + level;
  if (store.get(key, false)) return;
  store.set(key, true);
  showCutscene(level);
}
// ---------- 챕터 전환 장면: 동네 지도에서 모모가 다음 장소로 도망 ----------
const TOWN_PINS = [[164, 183], [133, 214], [197, 136], [101, 152], [195, 233], [278, 180], [197, 80]];
let cs = null;
function newThingsIn(first){
  const last = first + 9, out = [], add = (l, n) => { if (l > 1 && l >= first && l <= last) out.push([l, n]); };
  MECH.forEach(m => add(m.lv, m.name)); FEATS.forEach(f => add(f.lv, f.name)); MODS.forEach(m => add(m.lv, m.name));
  ARCH_UNLOCK.forEach(([a, l]) => add(l, ARCH_NAME[a])); add(MIS_LV, '보너스 목표');
  return out.sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
function csPins(upto, cur){
  document.getElementById('csPins').innerHTML = TOWN_PINS.map(([x, y], i) => {
    const done = i <= upto && i !== cur, c = i === cur;
    return `<span class="csPin${done ? ' done' : c ? ' cur' : i === 6 ? ' boss' : ''}" style="left:${x}px;top:${y}px">${done ? STAR_I('#fff') : i + 1}</span>`;
  }).join('');
}
function csMomoAt(i){ const [x, y] = TOWN_PINS[i], m = document.getElementById('csMomo'); m.style.left = (x - 22) + 'px'; m.style.top = (y - 66) + 'px'; }
function csFit(){
  const k = Math.min(innerWidth / 390, (innerHeight - 250) / 440, 1.3);
  document.getElementById('csStage').style.transform = `translateX(-50%) scale(${Math.max(0.6, k)})`;
}
function showCutscene(lv){
  const c = Math.floor((lv - 1) / 10), N = CHAPTERS.length, to = c % N, from = (c - 1) % N, rd = roundOf(lv);
  const ch = CHAPTERS[to], prev = CHAPTERS[from], wrap = to === 0, parts = (ch.story || '').split('<br>');
  cs = { step: -1, c, to, from, rd, lv, ch,
    lines: [
      wrap ? `<b>${prev.name}</b>에서 끝까지 버텨냈어요!<br>그런데 집사가 포기하지 않았어요…` : `<b>${prev.name}</b>에서 끝까지 버텨냈어요!<br>이제 다음 장소로 도망쳐요.`,
      wrap ? '모모는 다시 <b>거실</b>로 도망쳤어요!' : parts[0],
      wrap ? `<b>${rd + 1}회차</b> · 집사가 더 강해져서 돌아왔어요!` : (parts[1] || '그런데… 위잉- 드론 소리가 또 들려요!'),
    ] };
  const sc = document.getElementById('csScene'); sc.style.transition = 'none'; sc.style.transform = ''; sc.offsetWidth; sc.style.transition = '';
  const m = document.getElementById('csMomo'); m.style.transition = 'none'; csMomoAt(from); m.offsetWidth; m.style.transition = ''; m.classList.remove('run');
  document.getElementById('csDrones').innerHTML = ''; document.getElementById('csPins').style.opacity = 1;
  const al = document.getElementById('csAlert'); if (al) al.remove();
  document.getElementById('csCard').classList.add('hidden'); document.getElementById('csDim').style.opacity = 0;
  document.getElementById('csBox').style.display = ''; document.getElementById('csSkip').style.display = '';
  csFit(); document.getElementById('cs').classList.remove('hidden');
  csGo(0);
}
function csGo(n){
  if (!cs || n <= cs.step) return;
  cs.step = n;
  document.getElementById('csDots').innerHTML = [0, 1, 2, 3].map(i => `<i class="${i === n ? 'on' : ''}"></i>`).join('');
  const txt = document.getElementById('csText'), ban = document.getElementById('csBanner');
  const setText = t => { txt.innerHTML = t; txt.style.animation = 'none'; txt.offsetWidth; txt.style.animation = ''; };
  if (n === 0){
    csPins(cs.from, -1);
    ban.innerHTML = `<div class="csBan">챕터 ${cs.c} 클리어!</div><div class="csSub">${STAR_I('#ffcf3a')} ${chStars(cs.c - 1)} 모음</div>`;
    setText(cs.lines[0]); AU.sfx('popper');
  } else if (n === 1){
    ban.innerHTML = '';
    const m = document.getElementById('csMomo'); m.classList.add('run'); csMomoAt(cs.to);
    setTimeout(() => { m.classList.remove('run'); if (cs && cs.step >= 1) csPins(cs.to === 0 ? -1 : cs.to - 1, cs.to); AU.sfx('pin'); }, 1300);
    setText(cs.lines[1]); AU.sfx('drawStart');
  } else if (n === 2){
    ban.innerHTML = '';
    const m = document.getElementById('csMomo'); m.classList.remove('run'); m.style.transition = 'none'; csMomoAt(cs.to); m.offsetWidth; m.style.transition = '';
    csPins(cs.to === 0 ? -1 : cs.to - 1, cs.to);
    const [x, y] = TOWN_PINS[cs.to], sc = document.getElementById('csScene');
    sc.style.transformOrigin = `${x}px ${y}px`; sc.style.transform = `translate(${195 - x}px, ${250 - y}px) scale(1.9)`;
    document.getElementById('csPins').style.opacity = 0;
    sc.insertAdjacentHTML('beforeend', `<div id="csAlert" style="left:${x + 6}px;top:${y - 90}px">!</div>`);
    const dr = document.getElementById('csDrones'), src = sprOk('drone') ? SPR.drone.src : 'assets/sprites/drone.png';
    dr.innerHTML = [[430, 40, 300, 50, 64], [460, 150, 320, 150, 52], [420, -40, 230, 0, 44]].map(([x0, y0, , , sz], i) => `<img class="csDrone" src="${src}" alt="" style="left:${x0}px;top:${y0}px;width:${sz}px;height:${sz}px">`).join('');
    setTimeout(() => { if (!cs || cs.step !== 2) return; [[300, 50], [320, 150], [230, 0]].forEach(([x1, y1], i) => { const d = dr.children[i]; if (d){ d.style.left = x1 + 'px'; d.style.top = y1 + 'px'; } }); AU.sfx('meow'); }, 700);
    setText(cs.lines[2]);
  } else {
    ban.innerHTML = '';
    const first = cs.c * 10 + 1, nw = cs.rd ? [] : newThingsIn(first);
    document.getElementById('csDim').style.opacity = 1;
    document.getElementById('csBox').style.display = 'none'; document.getElementById('csSkip').style.display = 'none';
    const card = document.getElementById('csCard');
    card.innerHTML = `<img id="csCardMomo" src="assets/momo_sit.png" alt=""><div class="csCh">CHAPTER ${cs.c + 1}</div>
      <div class="csName">${cs.ch.name}</div>
      <div class="csLv">${cs.rd ? `<b style="font-weight:400;color:var(--pinkD)">${cs.rd + 1}회차</b> · ` : ''}Lv.${first} – ${first + 9} · 보스는 Lv.${first + 9}</div>
      ${nw.length ? `<div class="csHr"></div><div class="csNewT">여기서 처음 만나요</div><div class="csNew">${nw.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
      <button class="cbtn green big" id="csGo">시작하기 🐾</button>`;
    card.classList.remove('hidden'); AU.sfx('star');
    document.getElementById('csGo').onclick = e => { e.stopPropagation(); AU.sfx('click'); closeCutscene(); };
  }
}
function closeCutscene(){ cs = null; document.getElementById('cs').classList.add('hidden'); }
document.getElementById('cs').addEventListener('click', e => {
  if (!cs || e.target.closest('button')) return;
  if (cs.step < 3){ AU.sfx('click'); csGo(cs.step + 1); }
});
document.getElementById('csSkip').onclick = e => { e.stopPropagation(); csGo(3); };
addEventListener('resize', () => { if (cs) csFit(); });
document.getElementById('sSkip').onclick = closeStory;
document.getElementById('btnStory').onclick = showStory;

resize(); setup(); requestAnimationFrame(loop);
showTitle();

// ---------- 앱 설치(PWA) ----------
// 오프라인 실행용 서비스 워커. 한 번 열면 인터넷 없이도 실행됨
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => {
    // 새 버전의 서비스 워커가 자리를 잡아도 게임 중에는 새로고침하지 않음(시작 버튼을 누른 직후 처음 화면으로 튕기던 문제).
    // 화면(index.html)은 늘 서버에서 최신본을 받아 오므로 지금 화면이 이미 최신이고, 바뀐 그림·소리는 다음 실행 때 반영됨.
    // 예외: 처음 화면에 그대로 있고 아직 아무것도 누르지 않았을 때만 조용히 새로고침
    const hadController = !!navigator.serviceWorker.controller;
    let touched = false, reloaded = false;
    addEventListener('pointerdown', () => { touched = true; }, { capture: true, once: true });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded || !hadController || touched) return; // 첫 설치 직후에는 새로고침할 필요 없음
      if (!document.getElementById('title').classList.contains('hidden')){ reloaded = true; location.reload(); }
    });
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();
      setInterval(() => { try { reg.update(); } catch (_){} }, 30 * 60 * 1000);
    }).catch(() => {});
  });
}
// 안드로이드 크롬: 설치 버튼 / 아이폰 사파리: 홈 화면 추가 안내
let installEvt = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.getElementById('btnInstall').classList.remove('hidden'); });
if (isIOS && !standalone) document.getElementById('btnInstall').classList.remove('hidden');
document.getElementById('btnInstall').onclick = async () => {
  if (installEvt){
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (_){}
    installEvt = null; document.getElementById('btnInstall').classList.add('hidden');
  } else showToast('사파리 아래쪽 공유 버튼 → "홈 화면에 추가"를 눌러 주세요');
};
addEventListener('appinstalled', () => document.getElementById('btnInstall').classList.add('hidden'));
</script>
