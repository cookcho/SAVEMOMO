<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6cc4ff">
<meta name="color-scheme" content="only light">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAVE MOMO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAVE MOMO</title>
<script src="lib/matter.min.js"></script>
<script src="audio.js"></script>
<style>
  @font-face{font-family:'Jua';src:url(fonts/jua-sub.woff2) format('woff2');font-display:swap}
  :root{color-scheme:only light;
    --navy:#23304d;--navy2:#3b4a6b;
    --green:#4fd65e;--greenD:#25993a;--blue:#3ea8f2;--blueD:#1c6fb5;--yellow:#ffcf3a;--yellowD:#d18f00;
    --pink:#ff6f91;--pinkD:#c63f62;--purple:#a77af2;--purpleD:#6c44bd;--orange:#ff9a3c;--orangeD:#cc6410;--red:#ff5a5a;--redD:#c22f3a;
    --cream:#fff8ea;
  }
  html,body{margin:0;height:100%;background:#8fd2ff;color:var(--navy);font-family:'Jua',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(180deg,#6cc4ff 0%,#a9dfff 55%,#cdeeff 100%) fixed}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle,rgba(255,255,255,.35) 0 9px,rgba(255,255,255,.6) 10px,transparent 11px);
    background-size:90px 90px,140px 140px;background-position:10px 20px,60px 80px}
  button{font-family:inherit}
  #app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;box-sizing:border-box;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  /* ---------- 공통: 통통한 캐주얼 버튼 ---------- */
  .cbtn{--c:var(--blue);--d:var(--blueD);position:relative;border:3px solid var(--d);background:var(--c);color:#fff;border-radius:16px;font-size:17px;padding:10px 16px;cursor:pointer;
    box-shadow:0 5px 0 var(--d),inset 0 -5px 0 rgba(0,0,0,.10);text-shadow:0 2px 0 var(--d);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1}
  .cbtn::after{content:'';position:absolute;left:10%;top:5px;width:34%;height:22%;border-radius:20px;background:rgba(255,255,255,.45);pointer-events:none}
  .cbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d),inset 0 -5px 0 rgba(0,0,0,.10)}
  .cbtn svg{width:24px;height:24px;filter:drop-shadow(0 2px 0 var(--d))}
  .green{--c:var(--green);--d:var(--greenD)}.blue{--c:var(--blue);--d:var(--blueD)}.yellow{--c:var(--yellow);--d:var(--yellowD)}
  .pink{--c:var(--pink);--d:var(--pinkD)}.purple{--c:var(--purple);--d:var(--purpleD)}.orange{--c:var(--orange);--d:var(--orangeD)}.red{--c:var(--red);--d:var(--redD)}
  .white{--c:#fff;--d:#c9d6e6;color:var(--navy);text-shadow:none}
  .cbtn.sq{width:48px;height:48px;padding:0;border-radius:15px;flex:none}
  .cbtn.sq svg{width:28px;height:28px}
  .hidden{display:none!important}

  /* ---------- 게임 화면 상단 ---------- */
  header{padding:8px 10px 2px}
  .topbar{display:flex;align-items:center;gap:8px}
  .lvpill{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border:3px solid #c9d6e6;border-radius:18px;box-shadow:0 4px 0 #c9d6e6;height:44px;padding:0 4px}
  .lvpill .nav{border:0;background:#e8f2fc;color:var(--blueD);border-radius:11px;width:32px;height:32px;font-size:13px;cursor:pointer;padding:0;flex:none}
  .lvpill .nav:active{background:#d4e7fa}
  .lvMid{flex:1;min-width:0;text-align:center;cursor:pointer;line-height:1.05}
  #lvl{font-size:22px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #best{display:block;font-size:11px;color:#7a8aa6;white-space:nowrap}
  #best .gs{color:#f2a900}

  /* 잉크 막대: 별 3개 기준선이 보이는 연필 게이지 */
  #hud{position:relative;height:46px;margin-top:6px}
  .ink{position:absolute;inset:0;display:flex;align-items:flex-end}
  .inkIcon{position:relative;z-index:2;width:42px;height:42px;border-radius:50%;background:#ffe9a8;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 rgba(35,48,77,.25)}
  .inkIcon svg{width:28px;height:28px}
  .inkTrack{position:relative;flex:1;height:22px;margin:0 6px 10px -10px;background:#3c7a3e;border:3px solid var(--navy);border-left:0;border-radius:0 14px 14px 0;overflow:visible}
  .inkClip{position:absolute;inset:0;border-radius:0 11px 11px 0;overflow:hidden}
  .inkfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#b4f25a,#86d63a);transition:width .08s}
  .inkfill::after{content:'';position:absolute;left:0;right:0;top:3px;height:4px;background:rgba(255,255,255,.4);border-radius:2px}
  .mk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--navy);opacity:.75}
  #inkTxt{position:absolute;inset:0;font-size:12px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;text-shadow:0 1px 0 #1f4d22,0 0 3px #1f4d22;white-space:nowrap}
  .stb{position:absolute;bottom:20px;transform:translateX(-50%);width:26px;height:24px;border-radius:9px;background:#fff;border:2.5px solid var(--navy);display:flex;align-items:center;justify-content:center;font-size:15px;color:#f2b400;transition:transform .2s}
  .stb::after{content:'';position:absolute;bottom:-6px;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--navy)}
  .stb.off{color:#c3cbd6;background:#eef1f5;transform:translateX(-50%) scale(.85)}
  /* 타이머: 시뮬레이션 동안 잉크 막대 자리에 표시 */
  #timer{position:absolute;inset:4px 0 0;display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;border-radius:22px;background:#fff;border:3px solid var(--green);box-shadow:0 4px 0 rgba(35,48,77,.18);pointer-events:none;transition:border-color .2s,background .2s}
  #timer.hidden{display:none}
  #tNum{display:flex;align-items:baseline;justify-content:center;width:56px;height:34px;border-radius:17px;background:var(--green);color:#fff;font-size:24px;line-height:34px;font-variant-numeric:tabular-nums;transform-origin:center;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  #tNum small{font-size:14px;opacity:.9}
  #tBar{flex:1;height:14px;border-radius:7px;background:#e3ebf3;overflow:hidden;border:2px solid #c9d6e6}
  #tFill{height:100%;width:100%;background:var(--green);border-radius:5px}
  #timer.warn{border-color:#f5b82e}#timer.warn #tFill,#timer.warn #tNum{background:#f5b82e}
  #timer.danger{border-color:#ff4d4d;background:#fff0f0}#timer.danger #tFill,#timer.danger #tNum{background:#ff4d4d}
  #timer.tick #tNum{animation:tick .45s ease-out}
  #timer.danger.tick{animation:shakeX .4s ease-out}
  #timer.danger.tick #tNum{animation:tickBig .45s ease-out}
  @keyframes tick{0%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes tickBig{0%{transform:scale(1.35)}100%{transform:scale(1)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  #chips{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;margin-top:6px;height:24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;white-space:nowrap;font-size:12px;background:rgba(255,255,255,.88);color:var(--navy);padding:3px 9px 2px;border-radius:12px;border:2px solid rgba(35,48,77,.12);line-height:15px}
  .dbar{display:inline-flex;gap:2px;vertical-align:1px;margin:0 2px}.dbar i{width:5px;height:10px;border-radius:2px;background:rgba(35,48,77,.18)}.dbar i.on{background:currentColor}
  .chip.new{background:var(--yellow);border-color:var(--yellowD)}
  .chip.mis{background:#fff4c7;border-color:var(--yellowD);font-weight:700}.chip.mis b{color:var(--orangeD,#d36a00)}
  .chip.mis.got{background:#e9f9ec;border-color:var(--greenD)}.chip.mis.got b{color:var(--greenD)}
  .chip.mis.ok{background:var(--green);border-color:var(--greenD);color:#fff}.chip.mis.ok b{color:#fff}
  .chip.mis.fail{background:#e3e7ee;border-color:#b9c2cf;color:#8a95a6;text-decoration:line-through}.chip.mis.fail b{color:#8a95a6}
  #mMis{font-size:14px;margin:-2px 0 8px;padding:5px 12px;border-radius:14px;display:inline-block}
  #mMis.new{background:var(--yellow);color:var(--navy);animation:misPop .5s .7s both}#mMis.got{background:#e9f9ec;color:var(--greenD)}#mMis.miss{background:#eef1f5;color:#8a95a6}
  @keyframes misPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
  .pkGrid button small em{font-style:normal;font-size:9px;margin-left:1px}
  .chip.boss{background:var(--red);border-color:var(--redD);color:#fff}

  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 0 6px}
  canvas{touch-action:none;border-radius:16px;display:block;border:3px solid #fff;box-shadow:0 6px 0 rgba(35,48,77,.22),0 10px 24px rgba(35,48,77,.18)}
  #stage.danger::after{content:'';position:absolute;inset:6px 8px 8px;border-radius:18px;pointer-events:none;box-shadow:inset 0 0 0 4px rgba(255,60,60,.7);animation:dpulse .5s ease-in-out infinite alternate}
  @keyframes dpulse{from{opacity:.35}to{opacity:1}}
  #hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--navy);border:3px solid var(--navy);box-shadow:0 4px 0 rgba(35,48,77,.25);padding:8px 14px 7px;border-radius:16px;font-size:14px;text-align:center;pointer-events:none;max-width:86%;width:max-content;line-height:1.45;word-break:keep-all;transition:opacity .4s}
  #hint.fade{opacity:0}
  #hint b{color:#e8590c}

  /* ---------- 결과 창 ---------- */
  .modalWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,32,60,.45);z-index:5}
  .modal{position:relative;background:var(--cream);color:var(--navy);border:4px solid var(--navy);border-radius:26px;padding:34px 18px 18px;width:272px;text-align:center;box-shadow:0 8px 0 rgba(35,48,77,.35);animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .mRibbon{position:absolute;left:50%;top:-22px;transform:translateX(-50%);min-width:170px;padding:9px 22px 7px;font-size:24px;color:#fff;background:var(--green);border:4px solid var(--navy);border-radius:16px;text-shadow:0 2px 0 rgba(0,0,0,.25);white-space:nowrap;box-shadow:0 4px 0 rgba(35,48,77,.3)}
  .mRibbon.fail{background:var(--pink)}
  .mImg{height:92px;margin-top:2px;animation:bob 2s ease-in-out infinite}
  .stars{display:flex;justify-content:center;gap:4px;margin:2px 0 6px;height:46px}
  .stars i{font-style:normal;font-size:44px;line-height:46px;color:#d5dbe4;-webkit-text-stroke:2px var(--navy);transform:scale(0);animation:starPop .45s cubic-bezier(.2,1.8,.4,1) forwards}
  .stars i:nth-child(2){font-size:52px;margin-top:-8px}
  .stars i.on{color:#ffcf3a}
  .stars i.drop{font-size:40px;-webkit-text-stroke:0}
  @keyframes starPop{to{transform:scale(1)}}
  #mReason{font-size:16px;color:var(--pinkD);margin:0 0 6px}
  .mStats{display:flex;gap:6px;justify-content:center}
  .mStats div{flex:1;background:#fff;border:2.5px solid #d9e2ee;border-radius:12px;padding:5px 0 4px}
  .mStats small{display:block;font-size:11px;color:#7a8aa6}
  .mStats b{font-weight:400;font-size:18px}
  #mBest{font-size:13px;color:#d17a00;min-height:16px;margin-top:6px}
  #mTip{font-size:13px;color:#8a4b12;background:#fff1d6;border:2px solid #f2d39b;border-radius:12px;padding:7px 8px;margin-top:6px;word-break:keep-all;line-height:1.4}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .btns .big{font-size:21px;padding:13px 0}
  .brow{display:flex;gap:8px}.brow .wide{flex:1;font-size:17px}
  #shareBox{width:100%;box-sizing:border-box;margin-top:8px;font-size:12px;border:2px solid #c9d6e6;border-radius:10px;padding:6px;resize:none;font-family:inherit}

  /* ---------- 레벨 선택 ---------- */
  #picker{position:fixed;inset:0;z-index:30;background:rgba(20,32,60,.55);display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .pk{width:min(500px,100%);flex:1;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#6cc4ff,#cdeeff);border-radius:0 0 24px 24px}
  .pkTop{display:flex;align-items:center;gap:8px;padding:14px 12px 10px}
  .pkTop h3{margin:0;font-size:24px;flex:1;font-weight:400;color:#fff;text-shadow:0 3px 0 var(--blueD),0 0 2px var(--blueD)}
  .pkTop input{width:70px;height:44px;box-sizing:border-box;padding:6px;border-radius:13px;border:3px solid #c9d6e6;font-size:18px;text-align:center;font-family:inherit;color:var(--navy)}
  .pkList{flex:1;overflow-y:auto;padding:4px 14px 24px}
  .pkCh{margin:14px 0 8px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:6px}
  .pkCh span{background:#fff;border:2.5px solid #c9d6e6;border-radius:12px;padding:4px 12px 2px}
  .pkGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pkGrid button{position:relative;border:3px solid var(--blueD);border-radius:15px;padding:9px 0 5px;background:var(--blue);color:#fff;font-size:21px;cursor:pointer;line-height:1;box-shadow:0 4px 0 var(--blueD);text-shadow:0 2px 0 var(--blueD)}
  .pkGrid button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blueD)}
  .pkGrid button small{display:block;font-size:11px;color:#ffe066;min-height:13px;margin-top:3px;letter-spacing:-1px;text-shadow:0 1px 0 var(--blueD)}
  .pkGrid button.cur{--c:var(--green);background:var(--green);border-color:var(--greenD);box-shadow:0 4px 0 var(--greenD);text-shadow:0 2px 0 var(--greenD)}
  .pkGrid button.boss{background:var(--orange);border-color:var(--orangeD);box-shadow:0 4px 0 var(--orangeD);text-shadow:0 2px 0 var(--orangeD)}
  .lvpill .nav.dim{opacity:.35}
  .pkGrid button.lock{background:#b9c6d6;border-color:#8d9cb1;box-shadow:0 4px 0 #8d9cb1;text-shadow:none;color:#eef3f9}

  /* ---------- 이야기 카드 ---------- */
  #story{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(20,32,60,.6)}
  .scard{width:min(340px,88vw);background:var(--cream);color:var(--navy);border:4px solid var(--navy);border-radius:26px;padding:20px 18px 18px;text-align:center;box-shadow:0 8px 0 rgba(35,48,77,.35);animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
  .sart{height:170px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
  .sart img.big{height:150px}
  .sart .row{font-size:46px;display:flex;gap:10px;align-items:center}
  .sart .row span,.sart .row img{animation:bob 1.2s ease-in-out infinite}
  .sart .row img{height:58px}
  .sart .row svg{width:58px;height:58px}
  .sart .row :nth-child(2){animation-delay:.2s}.sart .row :nth-child(3){animation-delay:.4s}.sart .row :nth-child(4){animation-delay:.6s}
  .sart .zz{position:absolute;top:18px;right:62px;color:#5a7bd8;font-size:24px;animation:bob 1.6s ease-in-out infinite}
  .sart .pen{font-size:54px;animation:draw 1.6s ease-in-out infinite}
  .bob{animation:bob 2s ease-in-out infinite}.shake{animation:shake .5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  @keyframes draw{0%{transform:translate(-20px,10px) rotate(-10deg)}50%{transform:translate(20px,-6px) rotate(10deg)}100%{transform:translate(-20px,10px) rotate(-10deg)}}
  .stext{font-size:17px;line-height:1.6;margin:10px 0 12px;word-break:keep-all;min-height:76px}
  .stext b{font-weight:400;color:#e8590c}
  .sdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .sdots i{width:9px;height:9px;border-radius:5px;background:#e2d5c3}.sdots i.on{background:var(--orange);width:22px}
  .sbtns{display:flex;gap:8px}.sbtns button{flex:1}

  /* ---------- 시작 화면 ---------- */
  #title{position:fixed;inset:0;z-index:20;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 26px);box-sizing:border-box;
    background:linear-gradient(180deg,#5bbcff 0%,#9fdcff 52%,#d7f1ff 78%,#bfe3f6 100%)}
  #title.bgimg{background-size:cover;background-position:center bottom}
  #title.bgimg .tCloud{display:none}
  .tSky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .tCloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.85;animation:cloudMove linear infinite}
  .tCloud::before,.tCloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
  .tCloud::before{width:56px;height:56px;left:16px;top:-26px}.tCloud::after{width:44px;height:44px;left:58px;top:-18px}
  @keyframes cloudMove{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
  .bub{position:absolute;bottom:-60px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.18) 30%,rgba(160,215,255,.25) 70%,rgba(255,255,255,.7) 100%);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8);animation:bubUp var(--d) linear var(--dl) infinite}
  @keyframes bubUp{0%{transform:translate(0,0)}25%{transform:translate(12px,-28vh)}50%{transform:translate(-8px,-56vh)}75%{transform:translate(10px,-84vh)}100%{transform:translate(0,-115vh)}}
  .tTop{position:relative;width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:3px solid #fff;box-shadow:0 4px 0 rgba(35,48,77,.18);border-radius:22px;padding:5px 14px 4px 6px;font-size:18px;color:var(--navy)}
  .pill .pi{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:var(--yellow);border:2.5px solid var(--yellowD)}
  .pill .pi.cat{background:var(--orange);border-color:var(--orangeD)}
  .tLogoWrap{position:relative;margin-top:2vh;text-align:center;animation:logoIn .8s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes logoIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}
  #tLogoImg{width:min(350px,88vw);display:block;margin:0 auto;animation:logoBob 3s ease-in-out infinite}
  .tLogo{display:flex;flex-direction:column;align-items:center;line-height:.86;animation:logoBob 3s ease-in-out infinite}
  @keyframes logoBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
  .tLogo span{display:block;font-size:min(19vw,82px);letter-spacing:2px;color:#fff;
    -webkit-text-stroke:3px var(--navy);paint-order:stroke fill;
    text-shadow:0 6px 0 var(--navy),0 9px 10px rgba(35,48,77,.3)}
  .tLogo .l1{color:#fff;font-size:min(13vw,56px);transform:rotate(-4deg);margin-bottom:4px}
  .tLogo .l1 em{font-style:normal;color:#7fd3ff}
  .tLogo .l2{color:#ffc12e;-webkit-text-stroke:4px var(--navy);text-shadow:0 7px 0 var(--navy),0 10px 12px rgba(35,48,77,.3)}
  .tLogo .l2 i{font-style:normal;display:inline-block;animation:letterHop 2.4s ease-in-out infinite}

    S.push({ x: px, y: (py0 + 8 + GY) / 2 + 2, w: 14, h: GY - py0 - 8 + 4, a: 0, kind: 'post' });
    L.D.push({ type: 'seesaw', x: px, y: py0, w: R(150, 200), h: 12 });
  } else if (arch === 'hang'){
    // 사슬 두 줄에 매달린 발판: 부딪히면 흔들림
    px = R(90, 270); const pw = R(95, 130), py0 = R(390, 500); top = py0 - 7; hw = pw / 2;
    L.D.push({ type: 'hang', x: px, y: py0, w: pw, h: 14, ay: Math.max(26, py0 - R(150, 260)) });
  } else if (CARVED.includes(arch)){
    const cv2 = buildCarve(arch, R, r, D);
    L.carve = cv2.ops; L.carveInfo = cv2.info;
    carveToRects(cv2.ops).forEach(o => S.push(o));
    px = cv2.info.px; top = cv2.info.floorY; hw = 30;
  } else { // stairs: 벽 쪽이 가장 높은 계단
    const left = r() < 0.5, n = 3 + Math.floor(R(0, 2)), sw = R(60, 74), sh = R(38, 56);
    for (let i = 0; i < n; i++){
      const hgt = (n - i) * sh, x = left ? sw * i + sw / 2 : W - sw * i - sw / 2;
      S.push({ x, y: GY - hgt / 2 + 2, w: sw + 1, h: hgt + 4, a: 0, kind: 'stair' });
    }
    const i = Math.floor(R(0, n));
    px = left ? sw * i + sw / 2 : W - sw * i - sw / 2; top = GY - (n - i) * sh; hw = sw / 2;
  }
  // 동생 코코: 땅·받침대·기둥 지형에서 모모와 떨어진 곳에 하나 더(소개 레벨은 반드시)
  const twinIntro = FEATS.find(f => f.k === 'twin' && f.lv === lv);
  const TWIN_OK = ['ground', 'plat', 'pillar', 'cliff', 'stairs', 'shelf', 'valley', 'fall'];
  if (lv >= 35 && TWIN_OK.includes(arch) && (twinIntro || r() < clamp((D - 0.62) * 2.6, 0, 0.6))){
    for (let t = 0; t < 40; t++){
      const d2 = R(120, 190) * (r() < 0.5 ? -1 : 1), x2 = px + d2;
      if (x2 < 45 || x2 > W - 45) continue;
      let top2;
      if (arch === 'fall'){ // 낙하 판: 코코는 옆 작은 발판 위(모모만 떨어짐)
        top2 = clamp(top + R(-50, 30), 290, 450); S.push({ x: x2, y: top2 + 11, w: R(50, 62), h: 22, a: 0, kind: 'plat' });
      } else if (!['ground', 'plat', 'pillar'].includes(arch)){
        // 다른 지형: x2 아래에서 가장 높은 평평한 면 위(머리 위 공간이 비어 있어야 함)
        top2 = GY;
        for (const o of S) if (!o.a && Math.abs(o.x - x2) <= o.w / 2 - 16 && o.y - o.h / 2 < top2) top2 = Math.round(o.y - o.h / 2 + 2);
        if (S.some(o => !o.a ? (Math.abs(o.x - x2) < o.w / 2 + 22 && o.y + o.h / 2 > top2 - 70 && o.y - o.h / 2 < top2 - 4) : dist(o, { x: x2, y: top2 - 30 }) < o.w / 2 + 30)) continue;
        if (top2 < 300) continue;
      } else if (arch === 'ground'){ if (S.some(o => o.kind === 'hill' && Math.abs(o.x - x2) < o.r)) continue; top2 = GY; }
      else if (arch === 'plat'){ top2 = clamp(top + R(-70, 70), 380, 540); S.push({ x: x2, y: top2 + 8, w: R(70, 100), h: 16, a: 0, kind: 'plat' }); }
      else { top2 = clamp(top + R(-60, 60), 380, 510); const pw2 = R(52, 64); S.push({ x: x2, y: (top2 + GY) / 2 + 2, w: pw2, h: GY - top2 + 4, a: 0, kind: 'pillar' }); }
      L.pot2 = { x: x2, y: top2 - 18 + 4 }; L.sp2 = { x: x2, y: top2 - 50 }; L.twin = true; break;
    }
  }
  L.arch = arch;
  L.pot = { x: px, y: top - 18 };
  const sp = { x: px, y: top - 60 };
  L.sp = sp;

  // 바닥(구덩이 가능)
  let ground = [{ x: 0, w: W }];
  if (lv >= 5 && ['plat', 'shelf', 'hang', 'bowl'].includes(arch) && r() < 0.5){
    const gw = R(60, 90); let gx, t = 0;
    do { gx = R(30, W - gw - 30); t++; } while (Math.abs(gx + gw / 2 - px) < hw + 60 && t < 40);
    ground = [{ x: 0, w: gx }, { x: gx + gw, w: W - gx - gw }];
  }
  if (L.carve) ground = [];
  // 욕조 물: 소개 레벨은 반드시, 이후 D에 따라 점점 자주(모모가 땅에 앉은 지형·파낸 지형은 제외)
  const featIntro = FEATS.find(f => f.lv === lv) || null;
  const waterOk = lv >= 12 && WATER_OK.includes(arch) && !L.groundCat && !(arch === 'cliff' && top >= GY - 1) && !(L.twin && L.pot2.y + 14 >= GY - 1);
  L.water = !!L.forceWater || (waterOk && ((featIntro && featIntro.k === 'water') || r() < clamp((D - 0.35) * 1.6, 0, 0.75))); // v2: 물 바닥을 더 일찍·자주
  if (featIntro && featIntro.k === 'water' && !L.water) L.water = waterOk;
  if (featIntro && (featIntro.k === 'spike' || featIntro.k === 'fire') && waterOk) L.water = true;
  if (L.water){ // v2: 바닥 위험 = 물 / 압정 / 불
    const unl = ['water', ...(lv >= 16 ? ['spike'] : []), ...(lv >= 28 ? ['fire'] : [])];
    L.hz = featIntro && (featIntro.k === 'spike' || featIntro.k === 'fire') ? featIntro.k : (featIntro && featIntro.k === 'water') ? 'water' : r() < 0.45 ? 'water' : pick(unl);
  }
  if (L.water) ground = [];
  L.featIntro = featIntro && ((featIntro.k === 'water' && L.water) || ((featIntro.k === 'spike' || featIntro.k === 'fire') && L.hz === featIntro.k) || (featIntro.k === 'spikeblock' && L.fall === 'spikes') || featIntro.k === 'cactus' || (featIntro.k === 'twin' && L.twin)) ? featIntro : null;
  L.ground = ground;
  ground.forEach(g => S.unshift({ x: g.x + g.w / 2, y: H - 20, w: g.w, h: 40, a: 0, kind: 'ground' }));

  // 2) 위협 고르기: 새로 등장한 요소는 반드시 포함
  const pool = ['bee', 'rain', 'rock', 'wasp', 'crawl', 'tank', 'bigdog'].filter(k => has(k) && ((k !== 'crawl' && k !== 'bigdog') || L.groundCat) && !(k === 'rain' && (CARVED.includes(arch) || arch === 'cave')) && !(k === 'wasp' && (L.carve || arch === 'cave')));
  // 위협 종류 수: 소개 레벨은 1종, 이후 레벨대에 따라 2~3종
  const kinds = [];
  if (intro && pool.includes(intro.k)) kinds.push(intro.k);
  const nT = (intro || archIntro || lv < 6) ? 1 : D < 0.45 ? (r() < 0.6 ? 1 : 2) : D < 0.65 ? 2 : D < 0.82 ? (r() < 0.5 ? 2 : 3) : D < 0.95 ? 3 : (r() < 0.5 ? 3 : 4);
  const pickPool = archIntro ? pool.filter(k => k !== 'wind') : pool;
  for (let g = 0; kinds.length < Math.min(nT, pool.length) && g < 60; g++){ const k = pick(pickPool); if (!kinds.includes(k)) kinds.push(k); }
  if (arch === 'alcove' && !kinds.includes('bee') && !kinds.includes('tank')){ const i = kinds.findIndex(k => k !== intro?.k); if (i >= 0 && kinds.length >= nT) kinds[i] = 'bee'; else kinds.push('bee'); }
  // 모모가 땅에 있으면 개가 자주 나옴(소개 레벨 제외)
  if (!intro && !archIntro && L.groundCat && lv >= 8 && !kinds.some(k => k === 'crawl' || k === 'bigdog') && r() < 0.6){
    const dog = has('bigdog') && r() < 0.5 ? 'bigdog' : 'crawl';
    if (kinds.length >= nT) kinds[kinds.length - 1] = dog; else kinds.push(dog);
  }
  if (kinds.includes('wind') && kinds.filter(k => k !== 'wind').every(k => k === 'rain') && pool.includes('bee') && !kinds.includes('bee')) kinds.push('bee');
  if (!kinds.some(k => k !== 'wind')) kinds.push(pool.includes('bee') ? 'bee' : pick(pool.filter(k => k !== 'wind')));
  L.kinds = kinds;
  // 난이도 예산: 레벨에 비례해 완만히 증가. 새 요소 소개 레벨은 20% 낮춤. 어려운 지형일수록 위협 예산 감소
  // 퍼즐 규칙(31레벨~): 소개 레벨은 하나, 40레벨부터 무작위 0~1개, 50레벨부터 1~2개
  const modIntro = MODS.find(m => m.lv === lv) || null;
  let mods = [];
  if (modIntro) mods = [modIntro.k];
  else if (lv >= 38 || (L.boss && lv >= 31)){
    let nm = D > 0.92 ? (r() < 0.5 ? 2 : 1) : (r() < 0.6 ? 1 : 0);
    if (L.boss) nm = Math.max(1, nm);
    const avail = MODS.map(m => m.k);
    while (mods.length < nm){ const k = pick(avail); if (!mods.includes(k)) mods.push(k); }
  }
  // 흔들리는 지형(시소·매달린 발판)에 무거운 잉크는 너무 가혹 → 제외
  if ((arch === 'hang' || arch === 'seesaw') && mods.includes('heavy') && !modIntro) mods = mods.filter(k => k !== 'heavy');
  L.mods = mods; L.modIntro = modIntro;
  const capS = Math.min(2.4, 1 + Math.max(0, D - 0.68) * 2.6); // D가 높아지면 위협 상한(드론 수 등)도 커짐
  L.capS = capS;
  // 30레벨까지 레벨당 +3, 이후 +1.5 (상한이 커지는 속도와 맞춤)
  let B = 8 + 100 * Math.pow(D, 1.15); // 위협 예산
  if (L.boss) B *= 1.1;
  if ((intro || archIntro || modIntro) && lv > 1) B *= 0.85;
  B *= 1 - 0.08 * mods.length;
  if (L.twin) B *= L.featIntro && L.featIntro.k === 'twin' ? 0.6 : 0.85; // 지킬 고양이가 둘
  B /= ARCH_W[arch];
  if (kinds.includes('wind')) B *= 0.8;
  if (L.water && !L.forceWater) B *= 0.88;
  const u = B / kinds.filter(k => k !== 'wind').length;
  L.budget = Math.round(B * 10) / 10;
  const used = [];
  const dynRects = L.D.map(d => ({ x: d.x, y: d.y, w: d.w, h: d.h + 30, a: 0 }));
  const chainRects = L.D.filter(d => d.type === 'hang').map(d => ({ x: d.x, y: (d.ay + d.y) / 2, w: d.w + 10, h: d.y - d.ay, a: 0 }));
  const free = (p, pad) => p.x > 15 && p.x < W - 15 && p.y > 15 && !S.some(o => inRect(p, o, pad)) && !dynRects.some(o => inRect(p, o, pad)) && !chainRects.some(o => inRect(p, o, pad));
  const place = (minD, y0, y1, gap = 80) => {
    for (let t = 0; t < 120; t++){
      const p = { x: R(42, W - 42), y: R(y0, y1) };
      if (dist(p, sp) < minD || (L.sp2 && dist(p, L.sp2) < minD * 0.8) || !free(p, 32) || used.some(q => dist(q, p) < gap)) continue; // 32 = 기지 그림 크기만큼 지형과 띄움
      used.push(p); return p;
    }
    return null;
  };

  if (kinds.includes('crawl') || kinds.includes('bigdog')){
    const n = kinds.includes('crawl') ? clamp(Math.round(u / 2.5), 3, Math.round(8 * capS)) : 0;
    const nb = kinds.includes('bigdog') ? clamp(Math.round(u / 9), 1, Math.round(2 * capS)) : 0;
    // 개는 땅 위로 모모까지 막힘없이 달려올 수 있는 쪽에서만 나옴
    const clearSide = sd => { const x0 = sd < 0 ? 10 : W - 10; for (let x = x0; Math.abs(x - px) > 30; x += (px - x0) > 0 ? 6 : -6){ if (S.some(o => o.kind !== 'ground' && o.kind !== 'hill' && inRect({ x, y: GY - 12 }, o, 4))) return false; } return true; };
    let sides = (r() < 0.5 ? [-1, 1] : [px < W / 2 ? 1 : -1]).filter(clearSide);
    if (!sides.length) sides = [-1, 1].filter(clearSide);
    if (sides.length){
      for (let i = 0; i < n; i++) L.crawl.push({ side: sides[i % sides.length], t: 200 + i * 600 + R(0, 250), big: false });
      for (let i = 0; i < nb; i++) L.crawl.push({ side: sides[(i + 1) % sides.length], t: 400 + i * 1400 + R(0, 300), big: true });
    } else {
      ['crawl', 'bigdog'].forEach(k => { const i = kinds.indexOf(k); if (i >= 0) kinds.splice(i, 1); });

    }
  }
  if (kinds.includes('rain')){
    const n = 1;
    for (let i = 0; i < n; i++){
      const w = R(90, 140);
      let cx = R(w / 2 + 10, W - w / 2 - 10);
      if (i === 0) cx = clamp(px + R(-w / 2 + 25, w / 2 - 25), w / 2 + 10, W - w / 2 - 10);
      L.clouds.push({ x: cx, w, rate: clamp(900 / u, 60, 150) });
    }
  }
  if (kinds.includes('wind')){
    const y0 = clamp(R(sp.y - 170, sp.y - 60), 90, 460), h = R(150, 220);
    L.winds.push({ y0, y1: Math.max(Math.min(y0 + h, sp.y + (L.floatCat ? 160 : 40)), sp.y + 30), dir: r() < 0.5 ? -1 : 1, str: 0.6 + Math.min(0.5, lv * 0.015), ph: R(0, 2200) });
  }
  if (L.winds.length) L.clouds.forEach(c => { c.w = Math.min(190, c.w + 40); c.x = clamp(c.x - L.winds[0].dir * 45, c.w / 2 + 10, W - c.w / 2 - 10); });
  const yMin = L.clouds.length ? 125 : 55, yMax = Math.min(sp.y - 30, 400);
  // v2: 적이 여러 방향(좌·우·위, 아래쪽 옆)에서 오게 → 작은 지붕 하나로는 못 막고 길게 감싸야 함
  const placeDir = a => {
    for (let t = 0; t < 40; t++){
      const aa = a + R(-0.35, 0.35), d = R(150, 230);
      const p = { x: clamp(sp.x + Math.cos(aa) * d, 38, W - 38), y: clamp(sp.y + Math.sin(aa) * d, yMin, GY - 60) };
      if (dist(p, sp) < 120 || (L.sp2 && dist(p, L.sp2) < 100) || !free(p, 32) || used.some(q => dist(q, p) < 80)) continue;
      used.push(p); return p;
    }
    return null;
  };
  const sideAng = () => [Math.PI + R(-0.45, 0.45), R(-0.45, 0.45)];
  if (kinds.includes('bee')){
    const total = clamp(Math.round(u / 2), 4, Math.round(16 * capS)), nh = lv < 3 ? 1 : total > 14 ? 3 : 2;
    const angs = L.fall && nh >= 2 ? [Math.PI * 0.75 + R(-0.3, 0.3), Math.PI * 0.25 + R(-0.3, 0.3), -Math.PI / 2 + R(-0.5, 0.5)] // 낙하 판: 아래 양옆에서도 옴
      : nh === 1 ? [R(-2.5, -0.65)] : r() < 0.5 ? [...sideAng(), -Math.PI / 2 + R(-0.4, 0.4)] : [...sideAng().reverse(), -Math.PI / 2 + R(-0.4, 0.4)];
    for (let i = 0; i < nh; i++){
      const pit = arch === 'alcove' && i === 0 ? L.carveInfo.pit : null;
      const low = !pit && i === 0 && !L.twin && !L.floatCat && !L.groundCat && !L.carve && D > 0.5 && r() < 0.45 + (L.water ? 0.2 : 0) ? place(150, sp.y + 60, GY - 70) : null;
      const p = pit || low || placeDir(angs[i]) || place(170, yMin, yMax) || { x: px < W / 2 ? W - 40 : 40, y: yMin + 30 };
      if (pit) used.push(pit);
      L.hives.push({ ...p, n: Math.round(total / nh), kind: 'bee' });
    }
  }
  if (kinds.includes('tank')){
    // 헤비 드론: 수는 적지만 무거워서 선을 밀어냄
    const bx = L.hives.filter(h => h.kind === 'bee'), oppo = bx.length ? Math.atan2(sp.y - bx[0].y, sp.x - bx[0].x) : R(-2.5, -0.6); // 드론 떼 반대쪽에서
    const p = placeDir(oppo) || place(170, yMin, yMax) || { x: px < W / 2 ? W - 45 : 45, y: yMin + 40 };
    L.hives.push({ ...p, n: clamp(Math.round(u / 7), 1, Math.round(3 * capS)), kind: 'tank' });
  }
  // 두 점 사이에 지형이 없는지(오리의 사격 시야)
  const los = (a, b2) => {
    const n = Math.ceil(dist(a, b2) / 5);
    for (let i = 1; i < n; i++){
      const q = { x: a.x + (b2.x - a.x) * i / n, y: a.y + (b2.y - a.y) * i / n };
      if (dist(q, sp) < 34) break;
      if (S.some(o => inRect(q, o, 12)) || dynRects.some(o => inRect(q, o, 6))) return false;
    }
    return true;
  };
  if (kinds.includes('wasp')){
    // 예산이 크면 오리 두 마리가 서로 다른 각도에서 쏨(벽 하나로 다 막히지 않게)
    const nd = u > 70 ? 3 : u > 30 ? 2 : 1, ud = u / nd;
    for (let k = 0; k < nd; k++){
      let p = null;
      for (let t = 0; t < 40 && !p; t++){
        const c = place(190, yMin, Math.min(sp.y + 40, 470));
        const prev = L.hives.find(h => h.kind === 'wasp');
        const angOk = !prev || !c || Math.abs(Math.atan2(c.y - sp.y, c.x - sp.x) - Math.atan2(prev.y - sp.y, prev.x - sp.x)) > 0.9;
        if (c && los(c, sp) && angOk) p = c; else if (c) used.pop();
      }
      if (!p && k > 0) break;
      p = p || place(190, yMin, yMax) || { x: px < W / 2 ? W - 40 : 40, y: yMin + 60 };
      L.hives.push({ ...p, n: 0, burst: clamp(Math.round(3 + ud / 3), 5, Math.round(10 * Math.min(capS, 1.5))), gap: clamp(13000 / ud, 650 / capS, 1600), kind: 'wasp' });
    }
  }
  if (kinds.includes('rock')){
    const n = u > 45 ? 2 : 1;
    // 파낸 지형: 물풍선은 굴 입구 바로 위에서 떨어뜨림(땅에 맞고 터지는 의미 없는 발사 방지)
    const ci = L.carveInfo, holes = !L.carve ? null : ci.arch === 'alcove' ? (ci.extra ? [ci.extra] : []) : [{ x: ci.shaftX, w: ci.shaftW }, ...(ci.extra ? [ci.extra] : [])];
    for (let i = 0; i < n; i++){
      const rr = R(RAD.balloon[0], RAD.balloon[1]), interval = clamp(10000 * n / u, 480 / capS, 1500);
      const base = { r: rr, interval, first: R(350, 750) };
      if (holes){
        const hs = holes.filter(h => h.w > rr * 2 + 8);
        if (!hs.length) continue;
        const h = hs[i % hs.length], c = { type: 'top', x: h.x + R(-1, 1) * Math.max(0, h.w / 2 - rr - 5), y: -12, vx: 0, vy: 1, ...base };
        if (balloonReaches(S, c, sp)) L.chutes.push(c);
        continue;
      }
      // 물풍선만 있는 레벨은 첫 발사대를 모모 바로 위에 둠
      const onlyRock = i === 0 && !kinds.some(k => ['bee', 'wasp', 'crawl', 'tank', 'bigdog', 'rain'].includes(k));
      const top = () => ({ type: 'top', x: clamp(px + R(-30, 30), 24, W - 24), y: -12, vx: 0, vy: 1, ...base });
      const cloudOver = L.clouds.some(cl => Math.abs(cl.x - px) < cl.w / 2 + 30); // 비구름이 모모 위에 있으면 옆 발사대를 먼저
      if ((onlyRock || r() < 0.5) && !cloudOver && !L.cave && !(intro && intro.k === 'rock')){ L.chutes.push(top()); continue; }
      // 옆 발사대: 실제로 날려 보고 모모 근처까지 가는 궤도만 씀(지형에 막히면 다시 고르고, 끝내 안 되면 위에서 떨어뜨림)
      let ok = null;
      for (let t2 = 0; t2 < 6 && !ok; t2++){
        const fromLeft = L.cave ? !L.cave.left : r() < 0.5;
        let y = R(Math.max(120, sp.y - 230), sp.y - 50);
        for (let t = 0; t < 20 && !free({ x: fromLeft ? 20 : W - 20, y }, 20); t++) y = R(120, sp.y - 40);
        const vx = (fromLeft ? 1 : -1) * R(3.2, 4.2), x0 = fromLeft ? -40 : W + 40;
        const t = Math.abs(sp.x - x0) / Math.abs(vx), gstep = 0.278;

    for (let i = L.chutes.length - 1; i > 0; i--) for (let j = 0; j < i; j++){

      const near = a.type === c.type && (a.type === 'top' ? Math.abs(a.x - c.x) < 80 : Math.sign(a.x) === Math.sign(c.x) && Math.abs(a.y - c.y) < 70);

  }
  // 적이 하나도 안 남은 판(발사대 자리를 못 찾아 빠진 경우 등) → 드론 기지 하나를 넣음
  if (!L.hives.length && !L.chutes.length && !L.clouds.length && !kinds.some(k => k === 'crawl' || k === 'bigdog')){

  L.cacti = [];

  //   선반 = 벽에 붙은 판자(모모 옆, 지붕을 한쪽 걸칠 수 있음) / 상자·바위 = 모모 옆 바닥 위(지붕 다리가 막혀 돌아가야 함)
  const surfAt = x => { let t = GY; for (const o of S) if (!o.a && !o.shape && Math.abs(o.x - x) <= o.w / 2 - 6 && o.y - o.h / 2 < t && o.y - o.h / 2 > sp.y - 10) t = o.y - o.h / 2; return t; };

      S.push(o); used.push(o); break;
    }
  }
  // 금지 구역: 모모 주변·핀은 피해서 배치
  L.zones = [];
  if (mods.includes('nozone')){
    const nz = 1 + (r() < 0.5 ? 1 : 0) + (lv >= 50 ? 1 : 0);
    // 모모 가까이에 둬서 '늘 그리던 지붕'을 못 쓰게 함:
    //  cap = 머리 바로 위(낮고 꽉 끼는 지붕만 됨), side = 한쪽 옆(그쪽을 크게 돌아 감싸야 함), near = 모모 둘레 아무 데나

      const typ = t < 40 && !L.twin ? typs[i % 3] : 'near'; // 코코 판은 두 마리를 잇는 지붕 길은 비워 둠
      let z;
      if (typ === 'cap'){ const w = R(90, 150), h = R(50, 90); z = { x: sp.x + R(-30, 30), y: sp.y - R(52, 62) - h / 2, w, h, a: 0 }; }
      else if (typ === 'side'){ const w = R(50, 80), h = R(80, 130), sd = r() < 0.5 ? -1 : 1; z = { x: sp.x + sd * (R(42, 56) + w / 2), y: sp.y + R(-30, 10), w, h, a: 0 }; }
      else { const ang = R(-Math.PI, 0.3), d = R(90, 150), w = R(60, 110), h = R(50, 100); z = { x: sp.x + Math.cos(ang) * d, y: sp.y + Math.sin(ang) * d, w, h, a: 0 }; }

      if (S.some(o => !o.shape && !o.a && Math.abs(o.x - z.x) < (o.w + z.w) / 2 - 10 && Math.abs(o.y - z.y) < (o.h + z.h) / 2 - 10 && o.w * o.h > z.w * z.h * 0.6)) continue; // 지형 속에 파묻힌 구역은 의미 없음

    }

  }
  // v2.9.2: 금지 구역 없앰(게임에 별 의미가 없었음). 다른 배치가 그대로이도록 만들고 나서 지움

  if (mods.includes('nozone')){
    L.mods = mods = mods.filter(k => k !== 'nozone');
    if (L.modIntro && L.modIntro.k === 'nozone') L.modIntro = null;
  }
  // 잉크: D가 오를수록 짧아짐(덮개 하나 ≈ 230px). 파낸 지형은 입구만 막으면 돼서 더 짧게
  const inkOld = clamp(620 - 380 * D, 210, 620) * (L.carve ? 0.85 : L.floatCat ? 1.9 : L.slope ? 1.15 : 1);
  {
    const PAR0 = { fall: 380, pocket: 95, well: 95, alcove: 100, cave: 95, stairs: 150, bowl: 170, plat: 185, ground: 190, cliff: 190, shelf: 190, valley: 190, pillar: 205, hang: 205, seesaw: 205, slope: 190, drop: 300 };
    let par = (PAR0[arch] || 190) + (L.carveInfo && L.carveInfo.extra ? 70 : 0) + (L.cacti && L.cacti.length ? 35 : 0);
    if (L.twin) par += Math.abs(L.pot2.x - px) + 70; // 둘을 잇는 지붕
    par += L.zones.reduce((n, z) => n + (z.typ === 'side' ? 60 : z.typ === 'cap' ? 20 : 30), 0); // 금지 구역을 돌아가는 만큼
    if (L.hives.some(h => h.y > sp.y + 40)) par *= 1.35; // 아래에서도 공격 → 아래까지 감싸야 함

  }
  // 넉넉함 = 잉크 / 최소 잉크: 초반 2.2배 → D 0.85에서 1.35배 → 끝 1.25배
  L.ink = Math.round(Math.max(L.par * 1.22, Math.min(inkOld * (L.twin ? 1.6 : 1), Math.max(L.par * clamp(2.6 - 1.45 * D, arch === 'seesaw' || arch === 'hang' ? 1.55 : 1.25, 2.2), 0.6 * inkOld))));

  L.speed = clamp(2.0 + 1.9 * D, 2.0, 4.2);
  L.force = clamp(0.75 + 0.85 * D + (L.boss ? 0.1 : 0), 0.75, 1.8); // 적이 선을 밀어내는 힘 배율

  // 별 기준(잉크 px): 지형마다 '꼭 필요한 최소 잉크'(par)를 잡고, ★3 = par 이하, ★2 = par×1.5 이하.

  // v2.6 압정 띠(5레벨~): 모모가 앉은 면 바로 옆(적이 미는 반대쪽)에 깔아 둠. 받침이 좁으면 가장자리 아래 바닥에.

        && !L.hives.some(h => dist(h, rc2) < 40) && !L.pins.some(p => Math.abs(p.x - rc2.x) < rc2.w / 2 + 8 && Math.abs(p.y - rc2.y) < 16) && !(L.sp2 && Math.abs(L.pot2.x - rc2.x) < rc2.w / 2 + 26 && Math.abs(L.pot2.y + 14 - rc2.y) < 30) && !(Math.abs(px - rc2.x) < rc2.w / 2 + 26 && Math.abs(top - 4 - rc2.y) < 30);
      for (const [ci, c] of cats.entries()){
        const sup = S.find(o => !o.shape && !o.a && Math.abs((o.y - o.h / 2) - c.top) < 6 && Math.abs(o.x - c.x) <= o.w / 2);

      }

  }

}

function linePoints(){

function computeFlow(){

    for (let t = -w / 2; t <= w / 2; t += 6) markCircle(g, b.position.x + c * t, b.position.y + sn * t, b.plugin.h / 2 + 6);

    const a = P[i - 1], b = P[i], n = Math.max(1, Math.ceil(dist(a, b) / 4));
    for (let j = 0; j <= n; j++) markCircle(g, a.x + (b.x - a.x) * j / n, a.y + (b.y - a.y) * j / n, 5.5 + RAD.drone);
  }

// 격자에서 a→모모 직선이 막혔는지

function flowDir(b){

  if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return null;

  const F = flow[i] >= 0 || !flow2 || flow2[i] < 0 ? flow : flow2; // 선에 막혀 길이 없으면 지형만 본 지도로 → 선까지 와서 밀어붙임

// ---------- 시뮬레이션 ----------
function capV(body, max){
  const v = Body.getVelocity(body), m = Math.hypot(v.x, v.y);
  if (m > max) Body.setVelocity(body, { x: v.x / m * max, y: v.y / m * max });
}
function clampSpeeds(){
  for (const bug of bugs) capV(bug, (bug.label === 'tank' ? 1.6 + L.speed * 0.3 : L.speed * 1.8) * (bug.plugin.atk === 'charge' ? 1.6 : 1));
  for (const d of drops) capV(d, d.label === 'jet' ? 7.5 : 7);
  for (const k of rocks) capV(k, 9);
  for (const c of crawlers){ const v = Body.getVelocity(c), cap = (c.plugin.big ? 1.15 : 2.4) * (c.plugin.atk === 'charge' ? 1.9 : 1); if (Math.abs(v.x) > cap) Body.setVelocity(c, { x: Math.sign(v.x) * cap, y: v.y }); }

    capV(lineBody, 9);
    const av = Body.getAngularVelocity(lineBody);
    if (Math.abs(av) > 0.09) Body.setAngularVelocity(lineBody, Math.sign(av) * 0.09);
  }
  catList().forEach(c => capV(c, 8));
  for (const b of dynBodies){
    if (b.label === 'seesaw' && Math.abs(b.angle) > 0.42){ Body.setAngle(b, Math.sign(b.angle) * 0.42); Body.setAngularVelocity(b, 0); }
    if (b.label === 'hang' && Math.abs(b.angle) > 0.3){ Body.setAngle(b, Math.sign(b.angle) * 0.3); Body.setAngularVelocity(b, 0); }

function addBody(b, arr){ arr.push(b); Composite.add(engine.world, b); }
// ---------- 집게 드론 ----------
function makeClaws(){ return (L && L.claws || []).map((d, i) => ({ dock: d, x: d.x, y: d.y + CLAW_DOCKY, st: 'wait', t: (400 + i * 700) * TC, k: -1, re: 0, y0: 0, x0: 0, sd: 1 })); }
function linePt(k){ const c = Math.cos(lineBody.angle), s = Math.sin(lineBody.angle), o = lineBody.position, p = lineLocal[k]; return { x: o.x + p.x * c - p.y * s, y: o.y + p.x * s + p.y * c }; }

  if (!baseGrid) return true;

    const x = a.x + (b.x - a.x) * i / n, y = a.y + (b.y - a.y) * i / n;
    if (Math.hypot(x - b.x, y - b.y) < 16) break;

// 집을 곳: 핀에서 멀고(잘 들림), 가깝고, 모모 가까운 곳(덮개가 열림). 지형에 막혀 못 가는 곳은 빼고

  const on = L.pins.filter(p => p.on), n = lineLocal.length, hand = { x: c.x, y: c.y + 12 };
  let best = -1, bs = -1e9;
  for (let k = 0; k < n; k += 3){

    if (p.y < 24 || p.y > H - 8 || p.x < 4 || p.x > W - 4) continue;
    if (claws.some(o => o !== c && o.k >= 0 && o.st !== 'back' && Math.abs(o.k - k) < n * 0.25)) continue;

function stepClaws(){

      if (c.k < 0){ c.x += (c.dock.x - c.x) * 0.05; c.y += (c.dock.y + 40 + Math.sin(simT / 300) * 6 - c.y) * 0.05; continue; }

  for (const c of crawlers){
    if (!c.plugin.big && c.plugin.atk !== 'back' && simT > c.plugin.nextHop && Math.abs(c.velocity.y) < 0.4){
      Body.setVelocity(c, { x: Body.getVelocity(c).x, y: -4.6 }); c.plugin.nextHop = simT + 900 + simRng() * 700;
    }
  }
  for (const d of drops) if (d.position.y > H + 20 || d.position.x < -20 || d.position.x > W + 20 || simT - d.plugin.born > (d.label === 'splash' ? 1500 : 4000)) toRemove.add(d);
  for (const k of rocks) if (k.position.y > H + 40 || k.position.x < -60 || k.position.x > W + 60) toRemove.add(k);

  const g = engine.gravity, sp = sproutPart.position;
  for (let s = 0; s < SUB; s++){
    for (const bug of bugs){
      const sp = nearestHead(bug.position); // 가까운 고양이를 노림
      Body.applyForce(bug, bug.position, { x: 0, y: -bug.mass * g.y * g.scale });
      let dx = sp.x - bug.position.x, dy = sp.y - bug.position.y, m = Math.hypot(dx, dy) || 1;
      if (bug.label === 'wasp'){
        const P = bug.plugin;
        if (P.mode === 'aim'){
          if (s === 0) P.shot = clearShot(bug.position, sp);
          const fd = s === 0 ? (P.fd = flowDir(bug)) : P.fd;
          if (!P.shot && fd){
            // 직선이 막혀 있으면 길을 따라 돌아서 접근
            Body.applyForce(bug, bug.position, { x: bug.mass * fd.x * 0.0012, y: bug.mass * fd.y * 0.0012 });
          } else {
            // 모모에서 110px 떨어진 곳에서 맴돌며 노림
            const tx = sp.x - dx / m * 110, ty = sp.y - dy / m * 110;
            const ex = tx - bug.position.x, ey = ty - bug.position.y, em = Math.hypot(ex, ey) || 1;
            Body.applyForce(bug, bug.position, { x: bug.mass * (ex / em * 0.0011 + (simRng() - 0.5) * 0.001), y: bug.mass * (ey / em * 0.0011 + (simRng() - 0.5) * 0.001) });
          }
          if (simT > P.until && (P.shot || !fd)){ P.mode = 'dash'; P.dir = { x: dx / m, y: dy / m }; P.until = simT + 550; }
        } else {
          Body.applyForce(bug, bug.position, { x: bug.mass * P.dir.x * 0.004, y: bug.mass * P.dir.y * 0.004 });
          if (simT > P.until){ P.mode = 'aim'; P.until = simT + 700 + simRng() * 500; }
        }
      } else {
        const tank = bug.label === 'tank', P = bug.plugin;
        const fd = s === 0 ? (P.fd = flowDir(bug)) : P.fd;
        // 선에 막혀 0.6초간 모모에게 못 다가가면: 물러났다 돌진하거나, 옆으로 미끄러지며 틈을 찾음
        if (s === 0){
          if (P.best === undefined){ P.best = m; P.prog = simT; P.atk = 'seek'; }
          if (m < P.best - 4){ P.best = m; P.prog = simT; }
          const stuck = simT - P.prog > (tank ? 700 : 600) && simT - (P.lineT ?? -1e9) < 350;
          if (P.atk === 'seek' && stuck){
            if (simRng() < (tank ? 0.75 : 0.6)){ P.atk = 'back'; P.atkT = simT + 320 + simRng() * 200; }
            else { P.atk = 'probe'; P.atkT = simT + 450 + simRng() * 300; P.side = simRng() < 0.5 ? -1 : 1; }
          } else if (P.atk === 'back' && simT > P.atkT){ P.atk = 'charge'; P.atkT = simT + 480; }
          else if ((P.atk === 'charge' || P.atk === 'probe') && simT > P.atkT){ P.atk = 'seek'; P.best = m; P.prog = simT; }
        }
        if (P.atk !== 'seek'){
          const ux = dx / m, uy = dy / m, base = tank ? 0.0012 * (0.6 + L.force * 0.5) : 0.0012 * L.speed / 2.2;
          let fx, fy;
          if (P.atk === 'back'){ fx = -ux * base * 1.5; fy = -uy * base * 1.5; }
          else if (P.atk === 'charge'){ fx = ux * base * 3.2; fy = uy * base * 3.2; }
          else { fx = (-uy * P.side * 1.4 + ux * 0.35) * base; fy = (ux * P.side * 1.4 + uy * 0.35) * base; }
          Body.applyForce(bug, bug.position, { x: bug.mass * (fx + (simRng() - 0.5) * 0.0008), y: bug.mass * (fy + (simRng() - 0.5) * 0.0008) });
          continue;
        }
        // 헤비 드론은 길이 막히면(직진 모드) 추력을 올려 선을 밀어붙임
        const acc = tank ? (fd ? 0.0010 : 0.0018) * (0.6 + L.force * 0.5) : 0.0012 * L.speed / 2.2 * (fd ? 1 : 1 + 0.5 * L.force);
        bug.plugin.ram = tank && !fd;
        let ux = dx / m, uy = dy / m;
        if (fd){ ux = fd.x; uy = fd.y; }
        // 좌우로 흔들리는 비행(일직선 방지)
        const wob = Math.sin(simT / 200 + bug.plugin.ph) * (tank ? 0.00012 : 0.0004);
        Body.applyForce(bug, bug.position, {
          x: bug.mass * (ux * acc - uy * wob + (simRng() - 0.5) * 0.001),
          y: bug.mass * (uy * acc + ux * wob + (simRng() - 0.5) * 0.001)
        });
      }
    }
    for (const c of crawlers){
      const P = c.plugin, ddx = nearestHead(c.position).x - c.position.x, ad = Math.abs(ddx), dir = Math.sign(ddx);
      // 0.7초간 못 다가가면 뒷걸음질 → 달려들기(강아지는 뛰어오름)
      if (s === 0){
        if (P.best === undefined){ P.best = ad; P.prog = simT; P.atk = 'seek'; }
        if (ad < P.best - 4){ P.best = ad; P.prog = simT; }
        if (P.atk === 'seek' && simT - P.prog > 700 && ad > 18){ P.atk = 'back'; P.atkT = simT + 380 + simRng() * 150; }
        else if (P.atk === 'back' && simT > P.atkT){
          P.atk = 'charge'; P.atkT = simT + 550; AU.sfx('woof', { big: P.big });
          const v = Body.getVelocity(c);
          if (Math.abs(v.y) < 0.8) Body.setVelocity(c, { x: dir * (P.big ? 1.6 : 3.5), y: P.big ? -2.2 : -5.2 });
        } else if (P.atk === 'charge' && simT > P.atkT){ P.atk = 'seek'; P.best = ad; P.prog = simT; }
      }
      const base = P.big ? 0.0012 : 0.0011;
      const k = P.atk === 'back' ? -0.9 : P.atk === 'charge' ? 2.6 : 1;
      Body.applyForce(c, c.position, { x: c.mass * base * k * dir, y: 0 });
    }
    for (const d of drops) if (d.label === 'jet') Body.applyForce(d, d.position, { x: 0, y: -d.mass * g.y * g.scale });
    for (const w of L.winds){
      const inB = y => y > w.y0 && y < w.y1;
      if (s === 0){ const gp = gustPhase(w, simT)[0]; if (gp !== w._ph){ if (gp === 'blast') AU.sfx('gust'); if (gp === 'warm') AU.sfx('rev'); w._ph = gp; } }
      const gk = gustK(w, simT), push = (b, k) => { if (inB(b.position.y)) Body.applyForce(b, b.position, { x: b.mass * k * w.dir * w.str * gk, y: 0 }); };
      // 빗물·물줄기·드론·물풍선 모두 밀림(돌풍 때 확실히 휘도록). 물풍선은 발사구를 나온 뒤부터
      drops.forEach(d => push(d, d.label === 'jet' ? 0.0011 : 0.0007));
      bugs.forEach(b => push(b, b.label === 'tank' ? 0.0007 : b.label === 'wasp' ? 0.0010 : 0.0013));
      rocks.forEach(k => { if (!k.plugin.side || k.plugin.out || (k.position.x > -4 && k.position.x < W + 4)) push(k, 0.0010); });
      // v2: 돌풍이 모모(코코)도 옆으로 밀어요 — 떨어지는 중이면 크게, 발판 위에 앉아 있으면 조금(가장자리에선 밀려 떨어질 수 있음)
      for (const c of catList()) if (inB(c.position.y)){ const air = Math.abs(c.velocity.y) > 0.6; Body.applyForce(c, c.position, { x: c.mass * (air ? WIND_CAT_AIR : WIND_CAT_GND) * w.dir * w.str * gk, y: 0 }); }
      if (lineBody){
        const parts = lineBody.parts.length > 1 ? lineBody.parts.slice(1) : [lineBody];
        for (const p of parts) if (inB(p.position.y)) Body.applyForce(lineBody, p.position, { x: p.mass * 0.0005 * w.dir * w.str * gk * (act.tough ? 0.5 : 1), y: 0 });
      }
    }
    if (claws.length) clawForces(g);
    if (jetPush.length && lineBody){
      for (const j of jetPush){ const m = Math.hypot(j.vx, j.vy) || 1; Body.applyForce(lineBody, { x: j.x, y: j.y }, { x: j.vx / m * lineBody.mass * j.k, y: j.vy / m * lineBody.mass * j.k }); }
      jetPush = [];
    }
    Engine.update(engine, STEP / SUB);
    clampSpeeds();
  }
  if (popQ.size){
    popQ.forEach(bl => {
      toRemove.add(bl);
      for (let i = 0; i < 8; i++){
        const ang = -Math.PI * (0.05 + 0.9 * i / 7) + (simRng() - 0.5) * 0.3, sp2 = 2.5 + simRng() * 2;
        const sx = bl.position.x + Math.cos(ang) * (bl.circleRadius + 3), sy = bl.position.y + Math.sin(ang) * (bl.circleRadius + 3);
        const d = Bodies.circle(sx, sy, 2.8, { label: 'splash', frictionAir: 0.01, density: 0.0008, collisionFilter: { category: CAT_DROP, mask: CAT_DEF } });
        d.plugin = { born: simT };
        Body.setVelocity(d, { x: Math.cos(ang) * sp2 + bl.velocity.x * 0.3, y: Math.sin(ang) * sp2 });
        addBody(d, drops);
      }
      pops.push({ x: bl.position.x, y: bl.position.y, t: simT, col: bl.plugin.col });
      fxPop(bl.position.x, bl.position.y, BALLOON[bl.plugin.col || 0]); AU.sfx('pop');
    });
    popQ.clear();
  }
  if (toRemove.size){
    toRemove.forEach(b => Composite.remove(engine.world, b));
    drops = drops.filter(d => !toRemove.has(d));
    rocks = rocks.filter(k => !toRemove.has(k));
    toRemove.clear();
  }
  if (flashT > 0) flashT -= STEP;
  hp = Math.max(0, hp);
  if (L.mis && !misFail && ((L.mis.k === 'hp70' && hp < 70) || (L.mis.k === 'hp50' && hp < 50) || (L.mis.k === 'flawless' && hp < 100) || (L.mis.k === 'still' && catList().some((c, i) => misPos[i] && dist(c.position, misPos[i]) > 18)))) misFailNow();
  if (hp <= 0) return finish(false, (coco ? '모모·코코가 ' : '모모가 ') + (lastWet ? '흠뻑 젖었어요' : '다쳤어요'));
  if (failNext && phase === 'sim'){ const rs = failNext; failNext = null; return finish(false, rs); }
  for (const c of catList()){
    const nm = c === coco ? '코코가' : '모모가';
    if (phase === 'sim' && L.water && footOf(c) > WATER_Y + 6){ if (L.hz === 'water' || !L.hz) fxSplash(c.position.x, WATER_Y); AU.sfx('pop'); AU.sfx('meow'); return finish(false, nm + (L.hz === 'spike' ? ' 압정에 찔렸어요' : L.hz === 'fire' ? ' 불에 데었어요' : ' 물에 빠졌어요')); }
    if (c.position.y > H + 60 || c.position.x < -90 || c.position.x > W + 90) return finish(false, nm + ' 떨어졌어요');
    c.plugin.pv = Body.getSpeed(c);
  }
  prevPotSpeed = Body.getSpeed(potBody);
  if (simT >= simDur) return finish(true);
}

// ---------- 보너스 목표 표시 ----------
function misDoneBefore(){ const b = store.get(curKey(), null); return !!(b && b.mis); }
function misChipHTML(){ const done = misDoneBefore(); return `<span class="chip mis${done ? ' got' : ''}" id="misChip">🎯 ${MIS_TEXT[L.mis.k](L)} <b>${done ? '✓' : '+★'}</b></span>`; }
function misFailNow(){
  misFail = true;
  const c = document.getElementById('misChip'); if (c){ c.classList.add('fail'); c.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 260 }); }
}
// ---------- 종료 ----------
function finish(win, reason, delay = 450){
  phase = 'end'; endT = performance.now();
  if (win){ delay = Math.max(delay, 1100); fxWin(potBody.position.x, potBody.position.y + potOff.foot); AU.sfx('win'); AU.sfx('popper'); }
  else AU.sfx('fail');
  AU.duck(2.4); AU.setState('draw'); AU.drawingStop();
  const pct = Math.round(inkUsed / L.ink * 100);
  const stars = inkUsed <= L.s3 + 0.5 ? 3 : inkUsed <= L.s2 + 0.5 ? 2 : 1;
  const score = win ? Math.round(Math.max(0, 1 - inkUsed / L.ink) * 700 + hp * 3) : 0;
  endInfo = { win, pct, stars, score, hp: Math.round(hp), reason };
  let best = store.get(curKey(), null), newBest = false;
  if (win && (!best || score > best.score)){ best = { score, pct, stars: Math.max(stars, recStars(best)), ...(best && best.mis ? { mis: true } : {}) }; store.set(curKey(), best); newBest = true; }
  else if (win && best && stars > recStars(best)){ best.stars = stars; store.set(curKey(), best); }
  const misOK = !!(win && L.mis && !misFail), misNew = misOK && best && !best.mis;
  if (misNew){ best.mis = true; store.set(curKey(), best); }
  if (L.mis){ const c = document.getElementById('misChip'); if (c) c.classList.toggle('ok', misOK); }
  endInfo.mis = misOK;
  if (win && mode === 'level' && level + 1 > store.get('ss_level', 1)) store.set('ss_level', level + 1);
  setTimeout(() => {
    if (phase !== 'end') return;
    const mt = document.getElementById('mTitle');
    mt.textContent = win ? (newBest && best && !tut ? '최고 기록!' : '성공!') : '앗, 실패!'; mt.classList.toggle('fail', !win);
    document.getElementById('mImg').src = win ? 'assets/momo_heart.png' : 'assets/momo_angry.png';
    refreshAccs();
    const rs = document.getElementById('mReason'); rs.textContent = win ? '' : reason; rs.classList.toggle('hidden', win);
    const tip = document.getElementById('mTip');
    const tipText = tut ? (win ? '잉크를 적게 쓸수록 ⭐이 늘어나요. 잉크 막대의 ★ 표시 전에 끝내면 ⭐⭐⭐!' : '틈이 있으면 드론이 돌아서 들어와요. 빈틈없이 감싸 보세요!')
      : (!win && /떨어졌어요/.test(reason)) ? '선이 너무 무거우면 모모를 밀어낼 수 있어요'
      : (!win && /물에 빠졌어요|압정에 찔렸어요|불에 데었어요|가시에 찔렸어요/.test(reason)) ? (L.slope ? '미끄럼판 아래쪽을 막아서 모모를 붙잡아요' : L.floatCat ? '모모가 떨어질 자리에 받침을 그려 주세요' : '선이 모모를 밀어내지 않게, 모모 옆을 단단히 받쳐요') : '';
    tip.textContent = tipText; tip.classList.toggle('hidden', !tipText);
    if (tut && win) store.set('momo_tut_done', true);
    if (win && pinTut()) store.set('momo_pin_done', true);
    document.getElementById('mStars').innerHTML = win ? [0, 1, 2].map(i => `<i class="${i < stars ? 'on' : ''}" style="animation-delay:${0.2 + i * 0.18}s">★</i>`).join('') : '<i class="drop" style="animation-delay:.15s">💧</i>';
    const mm = document.getElementById('mMis');
    mm.classList.toggle('hidden', !L.mis || !win);
    if (L.mis && win){
      const t = MIS_TEXT[L.mis.k](L);
      mm.className = misNew ? 'new' : misOK || (best && best.mis) ? 'got' : 'miss';
      mm.innerHTML = misNew ? `🎯 ${t} <b>성공! ★+1</b>` : misOK || (best && best.mis) ? `🎯 ${t} <b>✓</b>` : `🎯 ${t} <b>실패</b>`;
    }
    document.getElementById('mInk').textContent = pct + '%';
    document.getElementById('mHp').textContent = Math.round(hp);
    document.getElementById('mScore').textContent = score;
    document.getElementById('mBest').textContent = newBest ? '🏆 새 최고 기록!' : (best ? `최고 기록 ${best.score}점` : '');
    document.getElementById('mNext').classList.toggle('hidden', !win || mode === 'daily');
    document.getElementById('mRetry').textContent = win && (recStars(best) < 3 || (L.mis && !(best && best.mis))) ? '⭐ 더 받기' : '다시 도전';
    document.getElementById('mShare').classList.toggle('hidden', !win);
    document.getElementById('modalWrap').classList.remove('hidden');
    if (win) for (let i = 0; i < stars + (misNew ? 1 : 0); i++) setTimeout(() => AU.sfx('star', { i }), 220 + i * 180);
  }, delay);
}

// 레벨 선택 화면: 챕터별 10칸, 별 기록 표시, 번호로 바로 이동
// 기록의 별 수(새 기록은 stars를 저장, 예전 기록은 잉크 비율로 계산)
function recStars(b){ return !b ? 0 : b.stars || (b.pct <= 22 ? 3 : b.pct <= 40 ? 2 : 1); }
function starsOfPct(p){ return p <= 22 ? '★★★' : p <= 40 ? '★★' : '★'; }
function starsOf(lv){ const b = store.get('ss_best_' + lv, null); if (!b) return ''; return '★'.repeat(recStars(b)) + (b.mis ? '<em>🎯</em>' : ''); }
const STAR_I = c => `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="${c}" stroke="#23304d" stroke-width="2" stroke-linejoin="round"/></svg>`;
function chStars(c){ let n = 0; for (let lv = c * 10 + 1; lv <= c * 10 + 10; lv++){ const b = store.get('ss_best_' + lv, null); if (b) n += recStars(b) + (b.mis ? 1 : 0); } return n; }
// 레벨 선택 = 챕터 지도: 아래(1챕터)부터 위로 떠 있는 섬들. 섬을 누르면 아래 시트에 그 챕터 레벨 10개
function openPicker(){
  if (mode !== 'level') return;
  const top = store.get('ss_level', 1), maxLv = Math.max(top, level) + 10;
  const chapters = Math.ceil(maxLv / 10), curC = Math.floor((level - 1) / 10), topC = Math.floor((top - 1) / 10);
  document.getElementById('picker').classList.remove('hidden');
  const list = document.getElementById('pkList');
  const Wd = list.clientWidth || 360, GAP = 196, Hh = chapters * GAP + 90;
  const pos = c => ({ x: Math.round(c % 2 ? Wd * 0.68 : Wd * 0.32), y: Hh - 150 - c * GAP });
  let path = '', html = '';
  for (let c = 0; c < chapters - 1; c++){
    const a = pos(c), b = pos(c + 1), my = (a.y + b.y) / 2, done = c < topC;
    const d = `M${a.x} ${a.y + 10} C${a.x} ${my - 20} ${b.x} ${my + 40} ${b.x} ${b.y + 60}`;
    path += `<path d="${d}" fill="none" stroke="#23304d" stroke-width="12" stroke-linecap="round" opacity=".16"/><path d="${d}" fill="none" stroke="${done ? '#ffcf3a' : '#fff'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${done ? '0' : '1 13'}"/>`;
  }
  for (let c = 0; c < chapters; c++){
    const p = pos(c), first = c * 10 + 1, ch = CHAPTERS[chapterOf(first)], rd = roundOf(first);
    const gl = !devOpen() && !canPlay(first), locked = gl || (!devOpen() && first > top), boss = c % CHAPTERS.length === CHAPTERS.length - 1;
    if (c % 2 === 0) html += `<i class="pkCloud" style="left:${Wd - 90 - (c * 37) % 60}px;top:${p.y - 60}px"></i>`;
    html += `<button class="isl${locked ? ' lockI' : ''}${c === curC ? ' sel' : ''}" data-ch="${c}" aria-label="챕터 ${c + 1} ${ch.name}" style="left:${p.x - 75}px;top:${p.y - 100}px"><img src="assets/map/isl${chapterOf(first)}.svg" alt=""></button>`;
    const badge = gl ? `<em>🔒 ★${gateFor(first)}</em>` : locked ? '<em>🔒</em>' : `<b>${STAR_I('#ffcf3a')} ${chStars(c)}</b>`;
    html += `<div class="islLbl${locked ? ' lockL' : ''}${boss ? ' boss' : ''}${c === curC ? ' sel' : ''}" style="left:${p.x}px;top:${p.y + 62}px"><i>${c + 1}</i>${ch.name}${rd ? ' ★' + (rd + 1) : ''}${badge}</div>`;
    if (c === curC) html += `<img class="pkMomo" src="assets/momo_sit.png" alt="" style="left:${p.x - 20}px;top:${p.y - 78}px">`;
  }
  list.innerHTML = `<div class="pkMap" style="height:${Hh}px"><svg class="pkPath" width="${Wd}" height="${Hh}" aria-hidden="true">${path}</svg>${html}</div>`;
  pickSheet(curC);
  list.scrollTop = pos(curC).y - list.clientHeight / 2;
}
function pickSheet(c){
  const top = store.get('ss_level', 1), first = c * 10 + 1, ch = CHAPTERS[chapterOf(first)], rd = roundOf(first), gl = !canPlay(first);

  const th = TH(), w = b.plugin.w, h = b.plugin.h, seed = b.position.x * 0.37 + b.position.y;
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  ctx.fillStyle = texFill(ctx, th.stone); rrect(-w / 2, -h / 2, w, h, Math.min(6, h / 3)); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  const n = Math.max(2, Math.floor(w * h / 900));
  for (let i = 0; i < n; i++){ ctx.beginPath(); ctx.ellipse(-w / 2 + hash(seed + i) * w, -h / 2 + 8 + hash(seed + i * 3.1) * (h - 8), 3 + hash(seed + i * 7) * 6, 2 + hash(seed + i * 5) * 3, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(-w / 2, -h / 2, w, 3);
  if (grassTop){
    ctx.fillStyle = th.grass; ctx.fillRect(-w / 2, -h / 2, w, 6);
    for (let x = -w / 2 + 4; x < w / 2; x += 7) { ctx.beginPath(); ctx.moveTo(x, -h / 2 + 6); ctx.lineTo(x + 3, -h / 2 + 10); ctx.lineTo(x + 6, -h / 2 + 6); ctx.fill(); }
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; rrect(-w / 2, -h / 2, w, h, Math.min(6, h / 3)); ctx.stroke();
  ctx.restore();
}
// 나무 판자
function drawWood(b){
  const w = b.plugin.w, h = b.plugin.h;
  ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
  if (sprOk('plank')){ drawPlankSpr(w, h + 2); ctx.restore(); return; }
  ctx.fillStyle = '#b07a43'; rrect(-w / 2, -h / 2, w, h, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(80,45,15,.35)'; ctx.lineWidth = 1;
  for (let y = -h / 2 + 4; y < h / 2 - 1; y += 4){ ctx.beginPath(); ctx.moveTo(-w / 2 + 3, y); ctx.lineTo(w / 2 - 3, y + (y % 8 ? 0.6 : -0.6)); ctx.stroke(); }
  ctx.fillStyle = '#5b3a1c';
  for (const x of [-w / 2 + 6, w / 2 - 6]){ ctx.beginPath(); ctx.arc(x, 0, 1.6, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 1.5; rrect(-w / 2, -h / 2, w, h, 3); ctx.stroke();
  ctx.restore();
}
// 화면 가장자리에 붙은 블록은 옆으로 넓힌 배경까지 이어 그림(그림만, 물리는 그대로)
function edgeExt(b){
  if (!XP || !b.plugin.w || Math.abs(b.angle) > 0.01) return b;
  let x0 = b.bounds.min.x, x1 = b.bounds.max.x;
  if (x0 > 1 && x1 < W - 1) return b;
  if (x0 <= 1) x0 = -XP - 2; if (x1 >= W - 1) x1 = W + XP + 2;
  return { position: { x: (x0 + x1) / 2, y: b.position.y }, angle: 0, vertices: b.vertices, plugin: { ...b.plugin, w: x1 - x0 } };
}
function drawCactus(x, y, r){
  ctx.save(); ctx.translate(x, y); ctx.lineJoin = 'round'; ctx.strokeStyle = '#23304d'; ctx.lineWidth = 2;
  ctx.fillStyle = '#e07a4a'; ctx.beginPath(); ctx.moveTo(-r * 0.8, r * 0.3); ctx.lineTo(r * 0.8, r * 0.3); ctx.lineTo(r * 0.6, r * 1.1); ctx.lineTo(-r * 0.6, r * 1.1); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4fbf5e'; ctx.beginPath(); ctx.ellipse(0, -r * 0.25, r * 0.62, r * 0.9, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-r * 0.75, -r * 0.2, r * 0.28, r * 0.42, -0.4, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(r * 0.75, -r * 0.35, r * 0.28, r * 0.42, 0.4, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4;
  for (const [sx, sy, dx, dy] of [[-0.3, -0.8, -0.5, -1.1], [0.3, -0.7, 0.55, -1], [0, -1.1, 0, -1.45], [-0.95, -0.5, -1.25, -0.75], [0.95, -0.7, 1.25, -0.95], [-0.25, 0, -0.55, 0.05], [0.25, -0.2, 0.55, -0.15]]){ ctx.beginPath(); ctx.moveTo(sx * r, sy * r); ctx.lineTo(dx * r, dy * r); ctx.stroke(); }
  ctx.restore();
}
function drawTack(x, y, s, col){ // 압정 하나: 뾰족한 침 + 둥근 머리
  ctx.fillStyle = '#c9d3df'; ctx.strokeStyle = '#5b6378'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x - 2.2 * s, y); ctx.lineTo(x, y - 12 * s); ctx.lineTo(x + 2.2 * s, y); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y + 1, 6.5 * s, 3.2 * s, 0, 0, 7); ctx.fill(); ctx.stroke();
}
function drawSpikeFloor(){
  const y0 = WATER_Y;
  ctx.save(); ctx.fillStyle = '#4a5368'; ctx.fillRect(-XP - 2, y0 + 4, W + XP * 2 + 4, H - y0);
  ctx.strokeStyle = '#2f3545'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-XP - 2, y0 + 4); ctx.lineTo(W + XP + 2, y0 + 4); ctx.stroke();
  const cols = ['#ff5a5a', '#ffcf3a', '#3ea8f2', '#4fd65e'];
  for (let x = -XP + 6, i = 0; x < W + XP; x += 15, i++) drawTack(x, y0 + 6, 1, cols[i % 4]);

function drawFireFloor(){
  const t = (phase === 'sim' ? simT : performance.now()) / 1000, y0 = WATER_Y;
  ctx.save();
  const g = ctx.createLinearGradient(0, y0 - 14, 0, H); g.addColorStop(0, 'rgba(255,200,60,.95)'); g.addColorStop(0.5, 'rgba(255,120,40,.95)'); g.addColorStop(1, 'rgba(200,40,30,.95)');
  ctx.beginPath(); ctx.moveTo(-XP - 2, H + 2);
  for (let x = -XP - 2; x <= W + XP + 2; x += 5) ctx.lineTo(x, y0 + 4 - Math.abs(Math.sin(x / 13 + t * 5)) * 10 - Math.abs(Math.sin(x / 7 - t * 3)) * 5);
  ctx.lineTo(W + XP + 2, H + 2); ctx.closePath(); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#c0391b'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,245,180,.9)';
  for (let i = 0; i < 10; i++){ const x = (i * 41 + 17) % (W + 20) - 10, yy = y0 - 4 - ((t * 40 + i * 23) % 30); ctx.globalAlpha = 1 - ((t * 40 + i * 23) % 30) / 30; ctx.beginPath(); ctx.arc(x + Math.sin(t * 3 + i) * 4, yy, 2.2, 0, 7); ctx.fill(); }

  ctx.font = '700 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.95)'; if (phase === 'draw') ctx.fillText('🛁 욕조 물', W / 2, y0 + 22);

function drawStatic(b){
  const th = TH(), k = b.label;
  if (k === 'tile') return; // 파낸 지형은 배경에 미리 그림
  if (k === 'ground'){
    const v = b.vertices; let x0 = Math.min(...v.map(p => p.x)), x1 = Math.max(...v.map(p => p.x));
    if (x0 <= 1) x0 = -XP; if (x1 >= W - 1) x1 = W + XP; // 화면 양옆 빈 곳까지 바닥을 이어 그림
    ctx.fillStyle = texFill(ctx, th.ground); ctx.fillRect(x0, GY, x1 - x0, 40);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, GY, x1 - x0, 40); ctx.clip();
    const bg = th.bg;
    if (bg === 'living'){ ctx.strokeStyle = 'rgba(60,35,15,.35)'; ctx.lineWidth = 1.5; for (let y = GY + 10; y < H; y += 10){ ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); for (let x = ((y / 10) % 2) * 30; x < W; x += 60){ ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y); ctx.stroke(); } } }
    else if (bg === 'roof'){ ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let y = GY + 6; y < H; y += 10) for (let x = ((y / 10) % 2) * 8; x < W; x += 16){ ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI); ctx.fill(); } }
    else if (bg === 'beach'){ ctx.fillStyle = 'rgba(150,110,50,.3)'; for (let i = 0; i < 60; i++) ctx.fillRect((i * 53) % W, GY + 6 + (i * 17) % 32, 2, 2); }
    else if (bg === 'alley'){ ctx.fillStyle = 'rgba(120,150,200,.25)'; for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.ellipse((i * 97 + 40) % W, GY + 16, 24, 4, 0, 0, 7); ctx.fill(); } }
    else if (bg === 'bath'){ ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; for (let x = 0; x < W; x += 20){ ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x, H); ctx.stroke(); } for (let y = GY + 20; y < H; y += 20){ ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); } }
    ctx.restore();
    if (bg === 'yard' || bg === 'park'){ ctx.fillStyle = th.grass; ctx.fillRect(x0, GY, x1 - x0, 7); }
    else { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x0, GY, x1 - x0, 3); }
    return;
  }
  if (k === 'hill'){
    const r = b.circleRadius;
    ctx.fillStyle = texFill(ctx, th.ground); ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GY + 6); ctx.clip();
    ctx.strokeStyle = th.grass; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r - 5, 0, 7); ctx.stroke();
    ctx.restore(); return;
  }
  if (k === 'boulder' && sprOk('boulder')){ drawSpr('boulder', b.position.x, b.position.y, b.circleRadius * 2.06, b.circleRadius * 2.06, b.angle); return; }
  if (k === 'boulder'){
    const r = b.circleRadius;
    ctx.fillStyle = '#8a8278'; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(b.position.x - r * 0.3, b.position.y - r * 0.35, r * 0.4, 0, 7); ctx.fill();
    ctx.strokeStyle = '#5a534b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.position.x, b.position.y, r, 0, 7); ctx.stroke();
    return;
  }
  if (k === 'obs'){ // 벽 선반: 아래에 쇠 받침 두 개
    const w = b.plugin.w; ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
    ctx.fillStyle = '#5b6378'; ctx.strokeStyle = '#2f3545'; ctx.lineWidth = 1.5;
    for (const x of [-w * 0.3, w * 0.3]){ ctx.beginPath(); ctx.moveTo(x - 7, 6); ctx.lineTo(x + 7, 6); ctx.lineTo(x - 5, 20); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.restore(); return drawWood(b);
  }
  if (k === 'plank') return drawWood(b);
  if (k === 'soap'){ drawWood(b); const w = b.plugin.w; ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
    for (let i = 0; i < Math.floor(w / 18); i++){ const x = -w / 2 + 10 + i * 18 + (i % 2) * 5, r0 = 4 + (i % 3) * 1.5; ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = 'rgba(120,170,220,.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, -8, r0, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.restore(); return; }
  if (k === 'cactus'){ drawCactus(b.position.x, b.position.y, b.circleRadius); return; }
  if (k === 'spikes'){ // 가시 발판: 나무 받침 + 위에 압정
    const w = b.plugin.w, h = b.plugin.h, x0 = b.position.x - w / 2, y0 = b.position.y - h / 2;
    if (h < 14){ // 압정 띠: 얇은 판 위에 압정
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x0, y0 + h - 4, w, 4); const cols = ['#ff5a5a', '#ffcf3a', '#3ea8f2'];
      for (let x = x0 + 5, i = 0; x < x0 + w - 3; x += 8, i++) drawTack(x, y0 + 2, 0.7, cols[i % 3]);
      return;
    }
    drawWood(b); const cols = ['#ff5a5a', '#ffcf3a', '#3ea8f2'];
    for (let x = x0 + 7, i = 0; x < x0 + w - 4; x += 11, i++) drawTack(x, y0 + 1, 0.85, cols[i % 3]);
    return;
  }
  if (k === 'box' && sprOk('crate')){ drawSpr('crate', b.position.x, b.position.y, b.plugin.w + 2, b.plugin.w + 2, b.angle); return; }
  if (k === 'box'){
    const w = b.plugin.w;
    ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
    ctx.fillStyle = '#c08a4a'; ctx.fillRect(-w / 2, -w / 2, w, w);
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2.5; ctx.strokeRect(-w / 2 + 1, -w / 2 + 1, w - 2, w - 2);
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-w / 2 + 3, -w / 2 + 3); ctx.lineTo(w / 2 - 3, w / 2 - 3); ctx.moveTo(w / 2 - 3, -w / 2 + 3); ctx.lineTo(-w / 2 + 3, w / 2 - 3); ctx.stroke();
    ctx.restore(); return;
  }
  if (k === 'pillar' || k === 'post'){
    drawStone(edgeExt(b), k === 'pillar');
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1.5;
    const v = b.vertices, x0 = v[0].x, x1 = v[1].x;
    for (let y = v[0].y + 20; y < GY; y += 20){ ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
    return;
  }
  drawStone(edgeExt(b), ['plat', 'shelf', 'cliff', 'stair', 'cave'].includes(k));
}
function drawDyn(b){
  const d = b.plugin.d;
  if (d.type === 'hang'){
    const c = Math.cos(b.angle), sn = Math.sin(b.angle);
    for (const sd of [-1, 1]){
      const ox = sd * (d.w / 2 - 10), ex = b.position.x + c * ox, ey = b.position.y + sn * ox, ax = d.x + ox;
      const n = Math.max(4, Math.round(Math.hypot(ex - ax, ey - d.ay) / 9));
      ctx.strokeStyle = '#4a4a52'; ctx.lineWidth = 2.5;
      for (let i = 0; i < n; i++){
        const t0 = i / n, t1 = (i + 0.7) / n;
        ctx.beginPath(); ctx.moveTo(ax + (ex - ax) * t0, d.ay + (ey - d.ay) * t0); ctx.lineTo(ax + (ex - ax) * t1, d.ay + (ey - d.ay) * t1); ctx.stroke();
      }
      ctx.fillStyle = '#4a4a52'; ctx.beginPath(); ctx.arc(ax, d.ay, 4, 0, 7); ctx.fill();
    }
  }
  drawWood(b);
  if (d.type === 'seesaw'){ ctx.fillStyle = '#3a3a40'; ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, 7); ctx.fill(); }
}
function drawPin(p){

    if (p.on || phase === 'draw'){ ctx.fillStyle = p.on ? 'rgba(255,209,102,.55)' : 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.on ? 13 : 15, 0, 7); ctx.fill(); }
    drawSpr('pin', p.x, p.y, 26, 26); return;
  }
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(VIS.pin, VIS.pin); ctx.translate(-p.x, -p.y);
  ctx.fillStyle = p.on ? '#ffd166' : '#c9a54a';
  ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6b5418'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#6b5418'; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 7); ctx.fill();

    ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, 7); ctx.stroke(); ctx.setLineDash([]);

function drawPlankSpr(w, h){

// 지형 무늬(챕터별 이음매 없는 타일). 512px 그림을 128px 크기로 반복
const texCache = new Map();
function texFill(c, fallback){
  const im = L && TEX[TH().bg];
  if (!ok(im)) return fallback;
  let byCtx = texCache.get(c); if (!byCtx){ byCtx = {}; texCache.set(c, byCtx); }
  const key = TH().bg;
  if (!byCtx[key]){ const pt = c.createPattern(im, 'repeat'); if (pt.setTransform) pt.setTransform(new DOMMatrix().scale(128 / im.naturalWidth)); byCtx[key] = pt; }
  return byCtx[key];
}

function earnedStars(){
  let n = 0;
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && (k.startsWith('ss_best_') || k.startsWith('ss_daily_'))){ const b = store.get(k, null); if (b && b.pct != null) n += recStars(b) + (b.mis ? 1 : 0); }
    }
  } catch (_){}
  return n;
}
const walletStars = () => earnedStars() - store.get('momo_spent', 0);
// 업데이트 전에 이미 간 레벨까지는 문 없이 그대로
if (store.get('momo_gate_base', null) === null) store.set('momo_gate_base', store.get('ss_level', 1));
function gateFor(lv){ return lv <= store.get('momo_gate_base', 0) ? 0 : Math.floor((lv - 1) / 10) * GATE_PER_CH; }
const canPlay = lv => earnedStars() >= gateFor(lv);
// 아직 안 깬 레벨은 못 들어감(바로 다음 레벨까지만). 테스트용: 버전 글자를 5번 누르면 모든 레벨 열림
const devOpen = () => store.get('momo_dev_all', false);
function tryLevel(lv){
  lv = Math.max(1, Math.floor(+lv || 1));
  if (mode === 'level' && !devOpen() && lv > store.get('ss_level', 1)){
    AU.sfx('nope'); showToast(`🔒 ${lv - 1}레벨을 먼저 깨야 열려요`);
    const pk = document.getElementById('picker'); if (!pk.classList.contains('hidden')) flashPicker(lv);
    return false;
  }
  if (mode === 'level' && !devOpen() && !canPlay(lv)){ showGate(lv); return false; }
  level = lv; hideTitle(); setup(); return true;
}
function showGate(lv){
  const need = gateFor(lv), have = earnedStars(), c = Math.floor((lv - 1) / 10), ch = CHAPTERS[c % CHAPTERS.length];
  document.getElementById('gTitle').textContent = `챕터 ${c + 1} · ${ch.name}`;
  document.getElementById('gText').innerHTML = `이 챕터는 <b>별 ${need}개</b>를 모아야 열려요.<br>지난 레벨을 잉크를 아껴 다시 깨면 별이 늘어나요.`;
  document.getElementById('gFill').style.width = Math.min(100, have / need * 100) + '%';
  document.getElementById('gNum').textContent = `지금 모은 별 ${have} / ${need}`;
  document.getElementById('gate').classList.remove('hidden'); AU.sfx('lock');
}
document.getElementById('gClose').onclick = () => document.getElementById('gate').classList.add('hidden');
document.getElementById('gPick').onclick = () => { document.getElementById('gate').classList.add('hidden'); if (mode !== 'level'){ mode = 'level'; } openPicker(); };

function renderItemBar(){
  const bar = document.getElementById('itemBar');
  if (phase !== 'draw' || tut){ bar.innerHTML = ''; return; }
  bar.innerHTML = ITEMS.map(it => {
    const n = inv[it.k] || 0, on = !!act[it.k];
    return `<button class="ib ${on ? 'on' : ''} ${n ? '' : 'empty'}" data-k="${it.k}" aria-label="${it.name}">${it.icon}<b>${n || '+'}</b></button>`;
  }).join('');
}
document.getElementById('itemBar').onclick = e => {
  const b = e.target.closest('.ib'); if (!b) return;
  const k = b.dataset.k, it = ITEMS.find(x => x.k === k);
  if (!(inv[k] > 0)){ openShop('item'); return; }
  if (pts.length){ showToast('아이템은 선을 긋기 전에 켜야 해요'); return; }
  act[k] = !act[k]; AU.sfx(act[k] ? 'item' : 'back');
  showToast(act[k] ? `${it.icon} ${it.name} 켬 · ${it.desc}` : `${it.name} 끔`);
  renderItemBar(); updateInk();
};
// 시뮬레이션이 시작되면 켠 아이템을 씀

  for (const k of Object.keys(act)) if (act[k] && inv[k] > 0) inv[k]--;
  saveInv();
  simDur = act.sand ? SIM_MS - 1000 : SIM_MS;
  document.getElementById('itemBar').innerHTML = '';
}

// 상점
let shopTab = 'item';
function penSwatch(p, w = 120, h = 60){
  const d = `M10 ${h - 14} C ${w * 0.3} 6, ${w * 0.6} ${h}, ${w - 10} 14`;
  const out = p.k === 'white' ? '#23304d' : '#23304d';
  if (p.k === 'navy') return `<svg viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="#1e2a4a" stroke-width="11" stroke-linecap="round"/></svg>`;
  const fill = p.k === 'rainbow' ? 'url(#rb)' : p.c;
  return `<svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset=".25" stop-color="#ffc93c"/><stop offset=".5" stop-color="#35c46a"/><stop offset=".75" stop-color="#3ea8f2"/><stop offset="1" stop-color="#9b6cf0"/></linearGradient></defs><path d="${d}" fill="none" stroke="${out}" stroke-width="13" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${fill}" stroke-width="8" stroke-linecap="round"/>${p.k === 'gold' ? `<path d="${d}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round" transform="translate(0,-1.5)"/>` : ''}</svg>`;
}
function accHTML(a, head){
  if (!a || !ACC_ART[a.k]) return '';
  const d = ACC_ART[a.k], [x, y, w, rot] = d[head ? 'head' : 'full'], im = accImg(a.k);
  return `<i class="acc" style="left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;transform:translate(${-d.an[0] * 100}%,${-d.an[1] * 100}%) rotate(${rot}deg);transform-origin:${d.an[0] * 100}% ${d.an[1] * 100}%"><img src="${im.src}" alt=""></i>`;
}
// 그림 높이에 맞춰 이모지 크기를 정함
function fitAcc(box){
  const im = box.querySelector('img'); if (!im) return;
  const set = () => { box.style.setProperty('--accfs', (im.clientWidth * 0.5) + 'px'); box.querySelectorAll('.acc').forEach(a => { if (!a.querySelector('img')) a.style.fontSize = (im.clientWidth * parseFloat(a.style.width) / 100 * 0.85) + 'px'; }); };
  if (im.complete) set(); else im.onload = set;
}
function refreshAccs(){
  document.querySelectorAll('.momoBox').forEach(box => {
    const slot = box.querySelector('.acc[data-head], .acc[data-acc-img]');
    if (!slot) return;
    const head = slot.hasAttribute('data-head') || (box.querySelector('img').src.includes('angry'));
    const html = accHTML(accNow(), head);
    const keep = slot.getAttribute('data-head') !== null ? 'data-head="1"' : `data-acc-img="${slot.getAttribute('data-acc-img')}"`;
    slot.outerHTML = html ? html.replace('<i class="acc"', `<i class="acc" ${keep}`) : `<i class="acc" ${keep}></i>`;
    fitAcc(box);
  });
}
function openShop(tab){ if (tab) shopTab = tab; renderShop(); document.getElementById('shop').classList.remove('hidden'); }
function renderShop(){
  const w = walletStars();
  document.getElementById('shopWallet').textContent = w;
  document.getElementById('shopEarned').textContent = `쓸 수 있는 별 · 지금까지 모은 별 ${earnedStars()}개`;
  document.querySelectorAll('.shopTabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === shopTab));
  let h = '';
  if (shopTab === 'item'){
    h = ITEMS.map(it => `<div class="scardI"><div class="pv">${it.icon}</div><h4>${it.name}</h4><p>${it.desc}</p><p>가진 개수 <b style="font-weight:400;color:var(--navy)">${inv[it.k] || 0}</b></p>
      <button class="cbtn ${w >= it.price ? 'green' : 'green dis'}" data-buy="item:${it.k}">★ ${it.price} 사기</button></div>`).join('')
      + `<div class="scardI" style="justify-content:center"><p style="font-size:13px;color:var(--navy)">게임 화면 아래 아이템 버튼을 눌러 켜요.<br>선을 긋기 전에만 켤 수 있고, 그 판이 시작되면 하나 써요.</p></div>`;
  } else {
    const isPen = shopTab === 'pen', list = isPen ? PENS : ACCS, own = owned(isPen ? 'momo_pens' : 'momo_accs', [isPen ? 'navy' : 'none']), cur = isPen ? penNow().k : accNow().k;
    h = list.map(x => {
      const has = own.includes(x.k), eq = cur === x.k;
      const pv = isPen ? penSwatch(x) : `<div class="momoBox"><img src="assets/momo_sit.png" alt="">${accHTML(x, false)}</div>`;
      const btn = eq ? `<button class="cbtn white" disabled>쓰는 중</button>` : has ? `<button class="cbtn blue" data-eq="${shopTab}:${x.k}">쓰기</button>` : `<button class="cbtn ${w >= x.price ? 'green' : 'green dis'}" data-buy="${shopTab}:${x.k}">★ ${x.price} 사기</button>`;
      return `<div class="scardI ${eq ? 'eq' : ''}"><div class="pv">${pv}</div><h4>${x.name}</h4>${btn}</div>`;
    }).join('');
  }
  const g = document.getElementById('shopGrid'); g.innerHTML = h;
